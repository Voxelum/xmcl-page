    instances:
      short: Інстанси
      title: Інстанси та профілі
      description: Зберігайте кожну конфігурацію Minecraft окремо, на видноті та готовою до запуску.
    community:
      short: Спільнота
      title: Моди та вміст спільноти
      description: Знаходьте, перевіряйте та встановлюйте проєкти для вашого наступного світу Minecraft.
    mods:
      short: Керування модами
      title: Керування модами
      description: Підтримуйте порядок у великих збірках за допомогою пошуку, груп, перевірки залежностей та оновлень.
    world-tools:
      short: Світи
      title: Інструменти світу
      description: Досліджуйте світи, вибирайте їхні частини та вивчайте використані матеріали.
    sharing:
      short: Поширення
      title: Поширення та мультиплеєр
      description: Переміщуйте робочу конфігурацію друзям, на сервер або іншу інсталяцію разом із деталями.
    accounts:
      short: Облікові записи
      title: Облікові записи та продуктивність
      description: Керуйте обліковими записами, оформленням і частими діями поруч з ігровими світами.
    diagnostics:
      short: Діагностика
      title: Діагностика та допомога
      description: У разі помилки запуску всі відомості та наступні дії знаходяться в одному місці.
  items:
    instance-library:
      title: Організована бібліотека інстансів
      benefit: Тримайте ванільні, модифіковані та експериментальні світи разом в одному місці, готовими до запуску.
      capabilities: Окремі версії гри та завантажувачі|Швидкий огляд модів, збережень і ресурсів|Запуск потрібної конфігурації
    instance-create-modloaders:
      title: Створення інстансів Java та Bedrock
      benefit: Створюйте нову конфігурацію із завантажувачем та виданням, що відповідають бажаному світу.
      capabilities: Підтримка Java Edition та експериментального Bedrock|Forge, Fabric, Quilt, NeoForge, OptiFine та LabyMod|Джерела версій Minecraft та локальні версії
    instance-folder-groups:
      title: Групи інстансів за папками
      benefit: Впорядковуйте інстанси за папками, щоб різні світи та конфігурації завжди було легко знайти.
      capabilities: Групування інстансів за призначенням чи проєктом|Зберігання пов'язаних збірок разом|Перемикання між папками на панелі інстансів
    instance-settings:
      title: Налаштування інстансу
      benefit: Налаштовуйте Java, пам'ять, версії, завантажувачі та параметри запуску, не змінюючи інші конфігурації.
      capabilities: Незалежна конфігурація кожного інстансу|Вибір версії та завантажувача|Налаштування оформлення для окремих інстансів
    instance-theme:
      title: Тема інстансу
      benefit: Надайте кожному світу власну індивідуальність за допомогою фонів, кольорів, розмиття, шрифтів і власного CSS.
      capabilities: Фонове зображення та накладання|Керування скругленням кутів і шрифтами|Експорт та імпорт теми
    local-server:
      title: Запуск локального сервера
      benefit: Перетворіть інстанс на налаштовуваний локальний сервер зі світом, лімітом гравців та файлами для експорту.
      capabilities: MOTD, порт і ліміт гравців|Вибір світу та файлів сервера|Експорт пакета сервера
    server-list:
      title: Список серверів
      benefit: Зберігайте адреси для мультиплеєра поруч з інстансом, де вони використовуються, і бачте стан з'єднання.
      capabilities: Статус сервера та кількість гравців|Закріплення та видалення адрес|Чітке відображення помилок з'єднання
    modpack-market:
      title: Ринок модпаків
      benefit: Переглядайте вміст із Modrinth, CurseForge та FTB на єдиному ринку зі зручним пошуком.
      capabilities: Фільтри за джерелом, версією, завантажувачем і категорією|Популярні та найновіші паки|Перегляд сторінки деталей паку
    online-mod-search:
      title: Пошук модів онлайн
      benefit: Знаходьте сумісні моди на основних платформах спільноти ще до їх додавання в інстанс.
      capabilities: Джерела Modrinth і CurseForge|Фільтри за версією Minecraft і завантажувачем|Фільтри середовища та категорій
    modpack-detail:
      title: Деталі модпаку
      benefit: "Дізнайтеся все про пак перед встановленням: від скриншотів та авторів до технічних вимог."
      capabilities: Скриншоти, теги та статистика проєкту|Дії встановлення та запуску|Технічна інформація та зовнішні ресурси
    mod-collections:
      title: Колекції модів
      benefit: Зберігайте проєкти, до яких хочете повернутися, і перетворюйте колекцію на готову до повторного використання збірку.
      capabilities: Колекції лаунчера|Відстежувані проєкти Modrinth|Пакетне встановлення та керування колекціями
    mod-detail:
      title: Деталі моду
      benefit: Ознайомтеся з модом перед зміною інстансу та вивчіть його версії, залежності й джерела.
      capabilities: Вибір версії та залежності|Завантажувачі, категорії та посилання на джерела|Опис і зовнішні ресурси
    local-mods:
      title: Керування встановленими модами
      benefit: Переглядайте ввімкнені моди, швидко фільтруйте їх і підтримуйте стабільність робочого набору.
      capabilities: Пошук, сортування та фільтрація модів|Перевірка залежностей і невикористовуваного вмісту|Вибір політики оновлення
    custom-mod-groups:
      title: Власні групи модів
      benefit: Створюйте власні групи та зберігайте правила, що впорядковують складні інстанси.
      capabilities: Застосування та збереження правил групування|Групування модів із контекстного меню|Вмикання, вимикання або огляд файлів
    save-preview:
      title: Перегляд світу та інструменти чанків
      benefit: Візуально оглядайте світ перед запуском і вносьте точні зміни на рівні чанків.
      capabilities: Переміщення та огляд карт світу|Вибір, копіювання чи видалення чанків|Перегляд властивостей світу та матеріалів
    blueprint-preview:
      title: Перегляд blueprint
      benefit: Переглядайте споруди у 3D та перевіряйте сумісність і матеріали перед розміщенням у грі.
      capabilities: Формати Litematica та WorldEdit|Сумісність і статус відсутніх модів|Список матеріалів і конвертація форматів
    modpack-export:
      title: Експорт модпаку
      benefit: Пакуйте інстанс для інших гравців без втрати метаданих і файлів, необхідних для його роботи.
      capabilities: Експорт для CurseForge та Modrinth|Метадані автора, опису та URL|Вибір файлів і ресурсів для включення
    server-export:
      title: Експорт сервера
      benefit: Оберіть потрібний світ і файли сервера, а потім експортуйте локальний сервер із чіткою конфігурацією.
      capabilities: Експорт у папку або завантаження|Вибір файлів сервера|Налаштування MOTD і параметрів сервера
    account-login:
      title: Кілька сервісів автентифікації
      benefit: "Обирайте сервіс облікових записів під ваш стиль гри: від Microsoft до автономних і сторонніх сервісів."
      capabilities: Облікові записи Microsoft та автономні|Сервіси Ely.by і LittleSkin|Додавання сервісів автентифікації та керування ними
    quick-action:
      title: Швидкі дії
      benefit: Знаходьте інстанси та команди, не залишаючи поточної сторінки.
      capabilities: Пошук команд, інстансів і модів|Запуск або створення інстансу|Зручна навігація з клавіатури через Ctrl+K
    crash-diagnosis:
      title: Звіти про збої та помилки запуску
      benefit: Читайте справжні журнали, звіти про збої та вивід сервера, що призвели до невдалого запуску.
      capabilities: Журнали, звіти про збої та помилки запуску|Помилки несумісності модів і коди виходу|Копіювання промпту для зовнішніх інструментів AI
    ai-agent:
      title: Вбудований AI Agent
      benefit: Дозвольте агенту дослідити віртуальну файлову систему інстансу та запропонувати практичне виправлення.
      capabilities: Аналіз файлів інстансу та звітів|Дослідження перед формулюванням висновків|Застосування практичного виправлення, коли це можливо
