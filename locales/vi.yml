features:
  label: Tính năng
  ui:
    kicker: XMCL / DANH MỤC TÍNH NĂNG
    heading: Toàn cảnh trình khởi chạy.
    description: Khám phá các quy trình giúp việc xây dựng, thấu hiểu và chia sẻ Minecraft mod trở nên dễ dàng.
    all: Tất cả tính năng
    search: Tìm kiếm tính năng...
