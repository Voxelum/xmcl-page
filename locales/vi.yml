  status:
    homepage: Trang chủ
    catalog: Danh mục
    guide: Hướng dẫn
    detail: Chi tiết
  groups:
    instances:
      short: Bản cài đặt
      title: Bản cài đặt và hồ sơ
      description: Giữ mọi thiết lập Minecraft độc lập, rõ ràng và sẵn sàng khởi chạy mà không làm mất cấu hình riêng.
    community:
      short: Cộng đồng
      title: Mod và nội dung cộng đồng
      description: Khám phá, kiểm tra và cài đặt các dự án biến phiên bản Minecraft thành thế giới tiếp theo của bạn.
    mods:
      short: Quản lý Mod
      title: Kiểm soát Mod
      description: Giữ thiết lập mod phong phú luôn ngăn nắp với tìm kiếm, phân nhóm, kiểm tra phụ thuộc và cập nhật chủ động.
    world-tools:
      short: Công cụ thế giới
      title: Công cụ thế giới
      description: 'Tương tác với các thế giới trong bản cài đặt: xem cấu trúc, chọn từng phần và nắm rõ tài nguyên.'
    sharing:
      short: Chia sẻ
      title: Chia sẻ & Chơi nhiều người
      description: Chuyển cấu hình hoàn chỉnh từ máy của bạn sang bạn bè, máy chủ hoặc máy khác nguyên vẹn.
    accounts:
      short: Tài khoản
      title: Tài khoản và năng suất
      description: Giữ thông tin danh tính, tùy chỉnh và thao tác thường dùng gắn liền với các thế giới bạn chơi.
    diagnostics:
      short: Chẩn đoán
      title: Chẩn đoán và hỗ trợ
      description: Khi khởi chạy thất bại, XMCL tập hợp nhật ký lỗi và hành động khắc phục ngay tại một nơi.
  items:
    instance-library:
      title: Thư viện bản cài đặt khoa học
      benefit: Xem thế giới gốc, mod và thử nghiệm cùng nhau trong một giao diện sẵn sàng khởi chạy.
      capabilities: Tách biệt phiên bản game và bộ nạp|Xem nhanh Mod, Save và tài nguyên|Khởi chạy thiết lập theo ý muốn
    instance-create-modloaders:
      title: Tạo bản cài đặt Java và Bedrock
      benefit: Bắt đầu thiết lập mới với bộ nạp và phiên bản phù hợp với thế giới bạn muốn chơi.
      capabilities: Hỗ trợ Java Edition và Bedrock thử nghiệm|Forge, Fabric, Quilt, NeoForge, OptiFine và LabyMod|Nguồn phiên bản Minecraft và cục bộ
    instance-folder-groups:
      title: Nhóm thư mục bản cài đặt
      benefit: Sắp xếp nhiều bản cài đặt vào các thư mục để dễ dàng duyệt qua các thế giới khác nhau.
      capabilities: Nhóm bản cài đặt theo mục đích hoặc dự án|Giữ các thiết lập liên quan cùng nhau|Chuyển đổi thư mục từ thanh điều hướng
    instance-settings:
      title: Cài đặt bản cài đặt
      benefit: Tinh chỉnh Java, bộ nhớ, phiên bản, bộ nạp và hành vi khởi chạy độc lập hoàn toàn.
      capabilities: Cấu hình bản cài đặt độc lập|Chọn phiên bản và bộ nạp|Tùy chỉnh giao diện theo từng bản cài đặt
    instance-theme:
      title: Giao diện bản cài đặt
      benefit: Tạo bản sắc riêng cho từng thế giới với hình nền, màu sắc, độ mờ, phông chữ và CSS tùy chỉnh.
      capabilities: Ảnh nền và lớp phủ|Bo góc và điều chỉnh phông chữ|Xuất và nhập giao diện tùy chỉnh
    local-server:
      title: Khởi chạy máy chủ nội bộ
      benefit: Biến một bản cài đặt thành máy chủ nội bộ hoàn chỉnh với thế giới, giới hạn người chơi và tệp có thể xuất.
      capabilities: MOTD, cổng kết nối và giới hạn người chơi|Chọn thế giới và tệp máy chủ|Xuất gói máy chủ hoàn chỉnh
    server-list:
      title: Danh sách máy chủ
      benefit: Lưu danh sách máy chủ ngay cạnh bản cài đặt tương ứng và theo dõi trạng thái kết nối.
      capabilities: Trạng thái máy chủ và số lượng người chơi|Ghim và gỡ bỏ máy chủ|Hiển thị lỗi kết nối rõ ràng
    modpack-market:
      title: Thị trường Modpack
      benefit: Duyệt nội dung từ Modrinth, CurseForge và FTB ngay tại một nơi có thể tìm kiếm.
      capabilities: Bộ lọc nguồn, phiên bản, bộ nạp và danh mục|Khám phá gói thịnh hành và mới nhất|Xem trang chi tiết gói mod
    online-mod-search:
      title: Tìm kiếm Mod trực tuyến
      benefit: Tìm các Mod tương thích từ các nền tảng cộng đồng lớn trước khi đưa vào bản cài đặt.
      capabilities: Nguồn từ Modrinth và CurseForge|Bộ lọc phiên bản Minecraft và bộ nạp|Bộ lọc môi trường và thể loại
    modpack-detail:
      title: Chi tiết Modpack
      benefit: 'Tìm hiểu kỹ gói mod trước khi cài đặt: từ ảnh chụp màn hình, tác giả đến yêu cầu kỹ thuật.'
      capabilities: Ảnh chụp, thẻ nhãn và số liệu thống kê|Thao tác cài đặt và khởi chạy|Thông tin kỹ thuật và liên kết ngoài
    mod-collections:
      title: Bộ sưu tập Mod
      benefit: Lưu các dự án muốn xem lại và biến bộ sưu tập thành thiết lập có thể tái sử dụng.
      capabilities: Bộ sưu tập trình khởi chạy|Theo dõi dự án Modrinth|Cài đặt hàng loạt và quản lý bộ sưu tập
    mod-detail:
      title: Chi tiết Mod
      benefit: 'Kiểm tra Mod trước khi áp dụng: xem phiên bản, phụ thuộc và nguồn phát hành.'
      capabilities: Lựa chọn phiên bản và phụ thuộc|Bộ nạp, phân loại và liên kết nguồn|Mô tả chi tiết và tài nguyên bên ngoài
    local-mods:
      title: Quản lý Mod đã cài đặt
      benefit: Xem mod nào đang kích hoạt, lọc nhanh và duy trì trạng thái hoạt động ổn định.
      capabilities: Tìm kiếm, sắp xếp và lọc Mod|Kiểm tra phụ thuộc và nội dung không dùng|Tùy chọn chính sách cập nhật
    custom-mod-groups:
      title: Nhóm Mod tùy chỉnh
      benefit: Tạo các nhóm riêng và lưu quy tắc phân loại cho các bản cài đặt phức tạp.
      capabilities: Áp dụng và lưu quy tắc phân nhóm|Phân nhóm Mod từ menu chuột phải|Bật, tắt hoặc kiểm tra tệp mod
    save-preview:
      title: Xem trước Save và công cụ Chunk
      benefit: Xem bản đồ thế giới trước khi khởi chạy và thực hiện chỉnh sửa chính xác ở cấp độ Chunk.
      capabilities: Di chuyển và quan sát bản đồ thế giới|Chọn, sao chép hoặc xóa Chunk|Xem thuộc tính thế giới và vật liệu
    blueprint-preview:
      title: Xem trước bản thiết kế Blueprint
      benefit: Xem trước công trình dạng 3D, xác minh độ tương thích và vật liệu trước khi xây dựng in-game.
      capabilities: Định dạng Litematica và WorldEdit|Trạng thái tương thích và mod còn thiếu|Danh sách vật liệu và chuyển đổi định dạng
    modpack-export:
      title: Xuất Modpack
      benefit: Đóng gói bản cài đặt để chia sẻ với người khác mà không làm mất metadata và tệp tin quan trọng.
      capabilities: Xuất sang CurseForge và Modrinth|Metadata tác giả, mô tả và liên kết|Chọn tệp và tài nguyên cần đưa vào
    server-export:
      title: Xuất máy chủ
      benefit: Chọn thế giới và tệp máy chủ phù hợp, sau đó xuất ra máy chủ nội bộ với cấu hình rõ ràng.
      capabilities: Xuất ra thư mục hoặc tải lên|Chọn tệp máy chủ|Cấu hình MOTD và tùy chọn máy chủ
    account-login:
      title: Nhiều dịch vụ xác thực
      benefit: 'Chọn dịch vụ tài khoản phù hợp với bạn: từ Microsoft đến ngoại tuyến và các dịch vụ bên thứ ba.'
      capabilities: Tài khoản Microsoft và ngoại tuyến|Dịch vụ Ely.by và LittleSkin|Thêm và quản lý dịch vụ xác thực
    quick-action:
      title: Thao tác nhanh
      benefit: Tìm kiếm bản cài đặt và lệnh điều khiển mà không cần rời khỏi trang hiện tại.
      capabilities: Tìm kiếm lệnh, bản cài đặt và Mod|Khởi chạy hoặc tạo bản cài đặt mới|Điều hướng bàn phím nhanh với Ctrl+K
    crash-diagnosis:
      title: Báo cáo sự cố và lỗi khởi chạy
      benefit: Xem nhật ký thực tế, báo cáo sự cố và kết quả máy chủ khi khởi chạy không thành công.
      capabilities: Nhật ký, báo cáo crash và lỗi khởi chạy|Lỗi giải quyết Mod và mã thoát|Sao chép câu lệnh hỏi AI bên ngoài
    ai-agent:
      title: Trợ lý AI tích hợp
      benefit: Cho phép trợ lý kiểm tra hệ thống tệp ảo của bản cài đặt và giải thích giải pháp khắc phục cụ thể.
      capabilities: Đọc tệp và báo cáo của bản cài đặt|Điều tra kỹ lưỡng trước khi kết luận|Áp dụng giải pháp sửa lỗi khả thi
