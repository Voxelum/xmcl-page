    homepage: Kaca Ngarep
    catalog: Katalog
    guide: Pandhuan
    detail: Rincian
  groups:
    instances:
      short: Instansi
      title: Instansi lan profil
      description: Jaga saben persiyapan Minecraft tetep mandhiri, cetha, lan siyap diluncurake tanpa kelangan setelan panjenengan.
    community:
      short: Komunitas
      title: Mod lan konten komunitas
      description: Temokake, priksa, lan pasang proyek sing ngowahi versi Minecraft dadi jagad anyar panjenengan.
    mods:
      short: Kontrol mod
      title: Manajemen mod
      description: Atur modifikasi kanthi gampang liwat telusuran, klompok, pamriksa dependensi, lan pembaruan teratur.
    world-tools:
      short: Piranti donya
      title: Piranti donya
      description: 'Garap jagad ing mburi instansi: priksa bentuke, pilih bagean, lan mangerteni bahane.'
    sharing:
      short: Bagi
      title: Bagi lan bebarengan
      description: Pindhahake persiyapan sing wis mlaku saka komputer menyang kanca utawa server kanthi wutuh.
    accounts:
      short: Akun
      title: Akun lan produktivitas
      description: Jaga identitas, kustomisasi, lan tumindak penting tetep cedhak karo jagad sing panjenengan dolanake.
    diagnostics:
      short: Diagnostik
      title: Diagnostik lan pitulungan
      description: Nalika game gagal mlaku, XMCL nuduhake bukti lan langkah sabanjure ing siji panggonan.
  items:
    instance-library:
      title: Perpustakaan instansi sing rapi
      benefit: Deleng jagad vanilla, mod, lan eksperimental bebarengan ing siji papan sing siyap diluncurake.
      capabilities: Pisahake versi game lan loader|Deleng Mod, Save, lan sumber daya kanthi cepet|Luncurake persiyapan sing dikarepake
    instance-create-modloaders:
      title: Gawe instansi Java lan Bedrock
      benefit: Mulai persiyapan anyar kanthi loader lan edisi sing cocog karo jagad sing arep dimainake.
      capabilities: Dhukungan Java Edition lan Bedrock eksperimental|Forge, Fabric, Quilt, NeoForge, OptiFine, lan LabyMod|Sumber versi Minecraft lan lokal
    instance-folder-groups:
      title: Klompok folder instansi
      benefit: Tata pirang-pirang instansi dadi folder supaya gampang dipriksa lan ora semrawut.
      capabilities: Klompokake instansi miturut tujuan utawa proyek|Kumpulake persiyapan sing gegandhengan|Ganti folder kanthi cepet saka sidebar
    instance-settings:
      title: Setelan instansi
      benefit: Atur Java, memori, versi, loader, lan prilaku peluncuran tanpa ngganggu instansi liyane.
      capabilities: Konfigurasi instansi mandhiri|Pilihan versi lan loader|Setelan tampilan saben instansi
    instance-theme:
      title: Tema instansi
      benefit: Wenehi saben jagad identitas dhewe nganggo latar mburi, warna, blur, font, lan CSS kustom.
      capabilities: Gambar latar mburi lan overlay|Sudut bunder lan kontrol font|Ekspor lan impor tema kustom
    local-server:
      title: Luncurake server lokal
      benefit: Owahi instansi dadi server lokal kanthi donya, wates pemain, lan file sing bisa diekspor.
      capabilities: MOTD, port, lan wates pemain|Pilihan donya lan file server|Ekspor paket server lengkap
    server-list:
      title: Daftar server
      benefit: Simpen server cedhak karo instansi sing nggunakake lan deleng kahanan sambungane.
      capabilities: Status server lan jumlah pemain|Pasang pin lan busak tujuan|Tampilake masalah sambungan kanthi cetha
    modpack-market:
      title: Pasar Modpack
      benefit: Jelajahi konten Modrinth, CurseForge, lan FTB saka siji pasar sing gampang digoleki.
      capabilities: Filter sumber, versi, loader, lan kategori|Temokake paket trending lan paling anyar|Bukak kaca rincian paket
    online-mod-search:
      title: Telusuran Mod online
      benefit: Temokake mod sing cocog saka platform komunitas gedhe sadurunge dipasang.
      capabilities: Sumber saka Modrinth lan CurseForge|Filter versi Minecraft lan loader|Filter lingkungan lan kategori
    modpack-detail:
      title: Rincian Modpack
      benefit: Mangerteni paket sadurunge dipasang, wiwit saka gambar, pangripta, nganti syarat teknis.
      capabilities: Tangkapan layar, tag, lan statistik|Aksi pasang lan luncurake|Informasi teknis lan pranala njaba
    mod-collections:
      title: Koleksi Mod
      benefit: Simpen proyek sing pengin dideleng maneh lan dadekake koleksi sing bisa digunakake maneh.
      capabilities: Koleksi launcher|Proyek Modrinth sing dituruti|Pemasangan akeh lan manajemen koleksi
    mod-detail:
      title: Rincian Mod
      benefit: 'Priksa mod sadurunge diowahi: deleng versi, dependensi, lan sumber resmine.'
      capabilities: Pilihan versi lan dependensi|Loader, kategori, lan pranala sumber|Katrangan lan sumber daya njaba
    local-mods:
      title: Manajemen Mod sing dipasang
      benefit: Deleng apa sing aktif, saring kanthi cepet, lan jaga setelan tetep lancar.
      capabilities: Golek, urutake, lan saring Mod|Priksa dependensi lan konten sing ora digunakake|Pilih kabijakan pembaruan
    custom-mod-groups:
      title: Klompok Mod kustom
      benefit: Gawe klompok dhewe lan simpen aturan sing ngatur persiyapan sing rumit.
      capabilities: Terapake lan simpen aturan klompok|Klompokake mod saka menu konteks|Aktifake, mateni, utawa priksa file
    save-preview:
      title: Pratonton Save lan piranti Chunk
      benefit: Priksa jagad kanthi visual sadurunge diluncurake lan gawe owah-owahan ing tingkat Chunk.
      capabilities: Geser lan priksa peta jagad|Pilih, salin, utawa busak Chunk|Waca sifat jagad lan materi
    blueprint-preview:
      title: Pratonton Blueprint
      benefit: Pratonton struktur ing format 3D lan priksa kompatibilitas sadurunge dipasang ing game.
      capabilities: Format Litematica lan WorldEdit|Status kompatibilitas lan mod sing kurang|Daftar bahan lan konversi format
    modpack-export:
      title: Ekspor Modpack
      benefit: Bungkus instansi kanggo pemain liyane tanpa kelangan metadata lan file penting.
      capabilities: Ekspor menyang CurseForge lan Modrinth|Metadata pangripta, katrangan, lan URL|Pilih file lan aset sing dilebokake
    server-export:
      title: Ekspor server
      benefit: Pilih jagad lan file server sing bener, banjur ekspor server lokal kanthi konfigurasi cetha.
      capabilities: Ekspor menyang folder utawa unggah|Pilih file server|Konfigurasi MOTD lan setelan server
    account-login:
      title: Macem-macem layanan login
      benefit: Pilih layanan akun sing cocog karo cara dolanan panjenengan, saka Microsoft nganti offline.
      capabilities: Akun Microsoft lan offline|Layanan Ely.by lan LittleSkin|Tambah lan atur layanan otentikasi
    quick-action:
      title: Aksi cepet
      benefit: Temokake instansi lan prentah tanpa ninggalake kaca sing lagi dibukak.
      capabilities: Golek prentah, instansi, lan Mod|Luncurake utawa gawe instansi anyar|Navigasi keyboard cepet nganggo Ctrl+K
    crash-diagnosis:
      title: Laporan crash lan gagal luncur
      benefit: Waca log asli, laporan kacilakan, lan output server nalika peluncuran gagal.
      capabilities: Log, laporan crash, lan gagal luncur|Masalah resolusi mod lan kode metu|Salin pituduh kanggo alat AI njaba
    ai-agent:
      title: Asisten AI internal
      benefit: Ayo asisten mriksa sistem file virtual instansi lan nerangake solusi sing pas.
      capabilities: Waca file instansi lan laporan|Nyelidiki kanthi tliti sadurunge njupuk kesimpulan|Terapake solusi nyata yen bisa
