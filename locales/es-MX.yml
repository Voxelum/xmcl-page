        description: Pasa de un escritorio Linux a una sesión en Steam Deck sin renunciar a una biblioteca clara ni a una configuración confiable. XMCL le da espacio a tu colección para crecer sin convertirse en una hoja de cálculo.
        point1: Ruta en Flathub pensada para Steam Deck
        point2: Interfaz enfocada y nítida en pantallas 4K
