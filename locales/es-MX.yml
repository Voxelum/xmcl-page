        title: Busca en ambos ecosistemas sin dividir tu atención.
        description: Encuentra proyectos en Modrinth y CurseForge con filtros de versión, loader, entorno y categoría. XMCL vincula proyectos de ambas fuentes para que compares el mismo trabajo sin adivinar.
        point1: Búsqueda en Modrinth y CurseForge en un solo flujo
        point2: Filtros de compatibilidad de versión de Minecraft y loader
        point3: Mapeo de proyectos entre plataformas
        alt: Búsqueda de mods en línea de XMCL con filtros de origen y compatibilidad
      build:
        label: 02 / CONSTRUYE
        title: Haz que las dependencias formen parte del plan.
        description: Cuando un mod necesita otro mod, XMCL puede instalar la dependencia junto con él. Al activar o desactivar un proyecto, el launcher ayuda a mantener coherente el conjunto sin obligarte a rastrear el grafo a mano.
        point1: Instalación automática de dependencias
        point2: Activación y desactivación consciente de dependencias
        point3: Inspecciona versiones, loaders y metadatos del proyecto
        alt: Vista de detalles del mod de XMCL mostrando versiones y dependencias
      curate:
        label: 03 / SELECCIONA
        title: Mantén tu conjunto de mods ligero y bien definido.
        description: Busca, ordena, agrupa, actualiza y elimina los mods que ya no aportan. Los grupos personalizados facilitan probar contenido opcional, comparar perfiles o mantener enfocada una versión candidata.
        point1: Comprobación automática de actualizaciones de mods
        point2: Grupos personalizados para contenido opcional y de prueba
        point3: Encuentra y elimina mods sin usar
        alt: Vista de gestión de mods instalados de XMCL con controles de búsqueda y actualización
      export:
        label: 04 / EXPORTA
        title: Publica un pack en el formato que tus jugadores necesitan.
        description: Exporta un modpack pulido para Modrinth o CurseForge con los metadatos correctos y los archivos elegidos. La publicación se vuelve una parte repetible del flujo de trabajo y no una tarea de compresión de último minuto.
        point1: Exportación a Modrinth y CurseForge en un clic
        point2: Metadatos de autor, descripción, URL y versión
        point3: Elige exactamente qué archivos y recursos incluir
        alt: Pantalla de exportación de modpacks de XMCL para formatos de Modrinth y CurseForge
      diagnose:
        label: 05 / DIAGNOSTICA
        title: Deja que la IA ayude a convertir informes de error en soluciones.
        description: Cuando un inicio de prueba falla, XMCL reúne registros, informes de crash y un agente de IA en un mismo lugar. El agente puede inspeccionar el contexto de la instancia y explicar el siguiente paso práctico.
        point1: Lee registros de inicio e informes de crash en contexto
        point2: Investigación asistida por IA de los archivos de la instancia
        point3: Resuelve conflictos de mods antes de publicar
        alt: Agente de IA de XMCL investigando un fallo de inicio de Minecraft
    cta:
      kicker: TU BANCO DE TRABAJO PARA EL PRÓXIMO LANZAMIENTO
      title: Crea el pack. Publícalo. Mantenlo sano.
      description: XMCL les da a los creadores un ciclo local rápido para descubrir, probar, diagnosticar y exportar en los dos ecosistemas que tus jugadores ya usan.
      button: Explorar todas las funciones
