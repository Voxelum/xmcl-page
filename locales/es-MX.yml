gameInstall:
  title:
    body: No te preocupes más por la {gameInstall}
    gameInstall: instalación del juego
  description: >-
    XMCL soporta la instalación de Minecraft oficial, Forge, Fabric e
    incluso OptiFine, ¡todo en un solo lugar! Puedes instalarlos directamente
    desde el lanzador. También es compatible con el espejo de terceros BMCL API
    y te permite configurar tu propio espejo en el lanzador.
optimalDisk:
  title:
    body: Espacio en disco {optimal} con {massiveResources}
    optimal: óptimo
    massiveResources: recursos masivos
  description: >-
    XMCL guarda todos los mods, paquetes de recursos, shaders y modpacks en una
    sola ubicación. En lugar de copiar archivos para cada instancia, usa enlaces
    duros para instalarlos sin duplicarlos. Esto significa que nunca volverás a
    ver copias repetidas en la carpeta /mods, ahorrando mucho espacio en disco.
cleanWorkspace:
  title:
    body: Mantén tu espacio de trabajo {clean} con múltiples instancias
    clean: limpio
  description: >-
    XMCL tiene soporte integrado para múltiples instancias. Puedes crear varias
    instancias fácilmente para no preocuparte por mezclar distintas
    configuraciones de inicio.
communityIntegration:
  title:
    body: Integrado con {multipleCommunities}
    multipleCommunities: múltiples comunidades
  description: >-
    XMCL incluye soporte integrado para CurseForge y Modrinth. También ofrece
    compatibilidad con cuentas personalizadas y sistemas de skins como Blessing
    Skin.
