  linux:
    eyebrow: XMCL / EDICIÓN LINUX
    title: El launcher de Minecraft que se siente nativo en Linux.
    lede: Un launcher pulido y de código abierto para escritorios Linux y Steam Deck. Elige el paquete que tu distribución espera, conéctalo a una pantalla 4K y ten cada mundo a un clic de distancia.
