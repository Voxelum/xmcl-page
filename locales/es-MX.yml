features:
  label: Funciones
  ui:
    kicker: XMCL / CATÁLOGO DE FUNCIONES
    heading: El launcher, en un mapa
    description: Explora los flujos de trabajo que hacen más fácil crear, entender y compartir una instalación modificada de Minecraft.
    all: Todas las funciones
    search: Buscar funciones...
    features: funciones
    featuresInView: funciones visibles
    readWorkflow: Ver el flujo de trabajo
  status:
    homepage: Inicio
    catalog: Catálogo
    guide: Guía
    detail: Detalles
  groups:
    instances:
      short: Instancias
      title: Instancias y perfiles
      description: Mantén cada configuración de Minecraft independiente, visible y lista para iniciar sin perder los detalles que la hacen tuya.
    community:
      short: Comunidad
      title: Mods y contenido comunitario
      description: Descubre, revisa e instala proyectos que convierten una versión de Minecraft en tu próximo mundo.
    mods:
      short: Control de mods
      title: Gestión de mods
      description: Mantén ordenada una configuración grande con búsqueda, grupos, revisión de dependencias y actualizaciones controladas.
    world-tools:
      short: Herramientas del mundo
      title: Herramientas del mundo
      description: "Trabaja con los mundos de tus instancias: inspecciona su forma, selecciona sus partes y entiende sus materiales."
    sharing:
      short: Compartir
      title: Compartir y multijugador
      description: Lleva una configuración funcional de tu computadora a un amigo, un servidor u otra instalación con todos sus detalles intactos.
    accounts:
      short: Cuentas
      title: Cuentas y productividad
      description: Mantén tu identidad, personalización y acciones frecuentes cerca de los mundos que juegas.
    diagnostics:
      short: Diagnóstico
      title: Diagnóstico y asistencia
      description: Cuando un inicio falla, XMCL reúne las pruebas y el siguiente paso en el mismo lugar.
  items:
    instance-library:
      title: Una biblioteca de instancias organizada
      benefit: Ve mundos vanilla, modificados y experimentales juntos en un inicio listo para jugar.
      capabilities: Separar versiones y loaders|Ver mods, mundos y recursos de un vistazo|Iniciar la configuración que necesitas
    instance-create-modloaders:
      title: Crear instancias Java y Bedrock
      benefit: Comienza una configuración con la edición y el loader adecuados para el mundo que quieres jugar.
      capabilities: Java Edition y soporte experimental de Bedrock|Forge, Fabric, Quilt, NeoForge, OptiFine y LabyMod|Fuentes de Minecraft y versiones locales
    instance-folder-groups:
      title: Grupos de instancias por carpetas
      benefit: Organiza muchas instancias en carpetas para encontrar mundos y configuraciones rápidamente.
      capabilities: Agrupar instancias por proyecto o propósito|Mantener juntas las configuraciones relacionadas|Cambiar de carpeta desde la barra lateral
    instance-settings:
      title: Ajustes de la instancia
      benefit: Configura Java, memoria, versiones, loaders y comportamiento de inicio sin afectar otra configuración.
      capabilities: Configuración independiente|Selección de versión y loader|Personalización de aspecto por instancia
    instance-theme:
      title: Tema de la instancia
      benefit: Dale a cada mundo su propia identidad con fondos, colores, desenfoque, fuentes y CSS personalizado.
      capabilities: Imagen de fondo y superposición|Esquinas redondeadas y control de fuentes|Importar y exportar temas
    local-server:
      title: Iniciar un servidor local
      benefit: Convierte una instancia en un servidor local configurable con mundo, límite de jugadores y archivos exportables.
      capabilities: MOTD, puerto y límite de jugadores|Selección de mundo y archivos del servidor|Exportar un paquete de servidor
    server-list:
      title: Lista de servidores
      benefit: Mantén tus destinos multijugador junto a la instancia correspondiente y revisa su estado de conexión.
      capabilities: Estado del servidor y jugadores|Fijar y eliminar destinos|Mostrar claramente los fallos de conexión
    modpack-market:
      title: Mercado de modpacks
      benefit: Explora contenido de Modrinth, CurseForge y FTB desde un único mercado con búsqueda.
      capabilities: Filtros de fuente, versión, loader y categoría|Descubrir packs populares y recientes|Abrir detalles de un pack
    online-mod-search:
      title: Búsqueda de mods en línea
      benefit: Encuentra mods compatibles en las principales plataformas comunitarias antes de agregarlos a tu instancia.
      capabilities: Fuentes Modrinth y CurseForge|Filtros de versión de Minecraft y loader|Filtros de entorno y categoría
    modpack-detail:
      title: Detalles del modpack
      benefit: Revisa capturas, autores, estadísticas y requisitos técnicos antes de instalar.
      capabilities: Capturas, etiquetas y estadísticas|Acciones de instalar e iniciar|Información técnica y recursos externos
    mod-collections:
      title: Colecciones de mods
      benefit: Guarda proyectos para volver a ellos después y convierte una colección en una configuración reutilizable.
      capabilities: Colecciones del launcher|Proyectos de Modrinth seguidos|Instalación por lotes y gestión de colecciones
    mod-detail:
      title: Detalles del mod
      benefit: Inspecciona un mod antes de modificar tu instancia y revisa sus versiones, dependencias y fuentes.
      capabilities: Selección de versión y dependencias|Loaders, categorías y enlaces de origen|Descripción y recursos externos
    local-mods:
      title: Gestión de mods instalados
      benefit: Consulta qué está activado, filtra rápido y mantén tu configuración en buen estado.
      capabilities: Buscar, ordenar y filtrar mods|Comprobar dependencias y contenido sin uso|Elegir una política de actualización
    custom-mod-groups:
      title: Grupos de mods personalizados
      benefit: Crea tus propios grupos y guarda reglas para organizar instancias complejas.
      capabilities: Aplicar y guardar reglas de agrupación|Agrupar mods desde el menú contextual|Activar, desactivar o inspeccionar archivos
    save-preview:
      title: Vista previa del mundo y herramientas de chunks
      benefit: Revisa un mundo visualmente antes de iniciarlo y haz cambios precisos a nivel de chunks.
      capabilities: Mover e inspeccionar mapas|Seleccionar, copiar o eliminar chunks|Consultar propiedades y materiales del mundo
    blueprint-preview:
      title: Vista previa de blueprints
      benefit: Previsualiza una estructura en 3D y verifica compatibilidad y materiales antes de colocarla en el juego.
      capabilities: Formatos Litematica y WorldEdit|Compatibilidad y estado de mods faltantes|Lista de materiales y conversión de formato
    modpack-export:
      title: Exportar un modpack
      benefit: Empaqueta una instancia para otros jugadores sin perder los metadatos y archivos necesarios.
      capabilities: Exportación a CurseForge y Modrinth|Metadatos de autor, descripción y URL|Elegir archivos y recursos incluidos
    server-export:
      title: Exportar un servidor
      benefit: Elige el mundo y los archivos correctos, y exporta un servidor local con una configuración clara.
      capabilities: Exportar a una carpeta o subir|Seleccionar archivos del servidor|Configurar MOTD y opciones del servidor
    account-login:
      title: Múltiples servicios de autenticación
      benefit: Elige el servicio de cuentas que se adapte a cómo juegas, desde Microsoft hasta perfiles sin conexión y servicios externos.
      capabilities: Cuentas Microsoft y sin conexión|Servicios Ely.by y LittleSkin|Agregar y gestionar servicios de autenticación
    quick-action:
      title: Acciones rápidas
      benefit: Busca instancias y comandos sin salir de la página en la que estás trabajando.
      capabilities: Buscar comandos, instancias y mods|Iniciar o crear una instancia|Navegación con teclado mediante Ctrl+K
    crash-diagnosis:
      title: Informes de crash y fallos de inicio
      benefit: Lee los registros reales, informes de crash y salidas del servidor detrás de un inicio fallido.
      capabilities: Registros, crashes y fallos de inicio|Errores de resolución de mods y códigos de salida|Copiar un prompt para herramientas de IA externas
    ai-agent:
      title: Agente de IA integrado
      benefit: Deja que un agente inspeccione el sistema de archivos virtual de la instancia y explique una solución práctica.
      capabilities: Leer archivos e informes de la instancia|Investigar antes de concluir|Aplicar una solución práctica cuando sea posible
