        description: Prenesite izvorni paket za svoje namizje ali uporabite Flathub za prenosljivo pot, prijazno do Steam Decka. XMCL ponuja tudi gradnje ARM64, kjer jih strojna oprema zahteva.
        point1: DEB in RPM za uveljavljena namizja Linux
        point2: AppImage in tar.xz za prenosljive namestitve
        point3: Podpora za Flathub za Steam Deck
        alt: Pogovorno okno XMCL za ustvarjanje primerka z različicami Minecrafta in nalagalniki modov
      organize:
        label: 02 / OHRANITE UREJENOST
        title: Vsak primerek dobi svojo čisto stezo.
        description: Ločite osnovne, modirane, testne in strežniške nastavitve brez ročnega premetavanja map. Vaše različice, nalagalniki, modi, shranjeni svetovi in nastavitve ostanejo skupaj.
        point1: Neodvisni podatki igre in zagonske nastavitve
        point2: Forge, Fabric, Quilt, NeoForge in več
        point3: Hitro preklapljanje med svetovi in preizkusi
        alt: Knjižnica primerkov XMCL z urejenimi profili igre Minecraft
      anywhere:
        label: 03 / IGRAJTE KJERKOLI
        title: Namizni zaganjalnik, ki dobro potuje.
        description: Preidite z namizja Linux na igranje na Steam Decku, ne da bi se odpovedali pregledni knjižnici ali zanesljivi nastavitvi. XMCL daje vaši zbirki prostor za rast, ne da bi se spremenila v preglednico.
        point1: Pot prek Flathuba, zasnovana za Steam Deck
        point2: Osredotočen vmesnik na zaslonih 4K
        point3: Odprtokoden in ustvarjen za igralce na Linuxu
        alt: Domača stran XMCL z veliko knjižnico primerkov
    download:
      kicker: PRENOS ZA LINUX
      title: Namestite XMCL po svoje.
      description: Izberite paket, ki spada na vaš sistem, ali uporabite Flathub za namestitev XMCL na Steam Deck.
