  creators:
    eyebrow: XMCL / ZA USTVARJALCE PAKETOV MODOV
    title: Gradite pakete modov s celotnim ciklom izdaje na enem mestu.
    lede: Odkrivajte projekte, razrešujte odvisnosti, preizkušajte delujoč nabor, diagnosticirajte sesutja in izvozite čist paket Modrinth ali CurseForge, ne da bi zapustili zaganjalnik.
    primaryAction: Razišči poteke dela za ustvarjalce
    secondaryAction: Odpri katalog funkcij
    heroNote: Poteki dela za Modrinth in CurseForge z diagnostiko ob pomoči UI
    visualLabel: XMCL · delovno okolje ustvarjalca
    heroAlt: Tržnica paketov modov XMCL s projekti Modrinth in CurseForge
    visualTag: MODRINTH ↔ CURSEFORGE
    visualStatus: DELUJOČI NABOR USKLAJEN
    workflowKicker: KROG USTVARJALCA
    workflowTitle: Hitrejša pot od grobe zamisli do paketa, ki ga igralci res lahko zaženejo.
    workflowDescription: 'XMCL obravnava paket modov kot živ sistem. Raziščite oba kataloga, izvajajte premišljene spremembe in pustite zaganjalniku, da pokaže povezave, ki ohranjajo vašo izdajo zdravo.'
    signals:
      sources:
        number: '2×'
        label: Vira projektov
        description: Iščite po Modrinthu in CurseForge iz enega delovnega okolja.
      export:
        number: '1-KLIK'
        label: Izvoz paketa
        description: Ustvarite paket MR ali CF za distribucijo v nekaj korakih.
      ai:
        number: 'UI'
        label: Pomoč pri sesutjih
        description: Spremenite poročilo o napaki v uporaben naslednji korak.
    features:
      discover:
        label: 01 / ODKRIJTE
        title: Iščite po obeh ekosistemih brez razpršene pozornosti.
        description: Poiščite projekte na Modrinthu in CurseForge s filtri po različici, nalagalniku, okolju in kategoriji. XMCL povezuje projekte med obema viroma, da lahko primerjate isto delo z manj ugibanja.
        point1: Iskanje po Modrinthu in CurseForge v enem toku
        point2: Filtri združljivosti za različico Minecrafta in nalagalnik
        point3: Medplatformsko preslikovanje projektov
        alt: Spletno iskanje modov v XMCL s filtri virov in združljivosti
      build:
        label: 02 / ZGRADITE
        title: Naj bodo odvisnosti del načrta.
        description: Ko mod potrebuje drug mod, lahko XMCL samodejno namesti odvisnost. Ko projekt omogočite ali onemogočite, zaganjalnik pomaga ohraniti nastali nabor skladen, namesto da bi ročno sledili grafu odvisnosti.
        point1: Samodejna namestitev odvisnosti
        point2: Omogočanje in onemogočanje z upoštevanjem odvisnosti
        point3: Pregled različic, nalagalnikov in metapodatkov projekta
        alt: Podrobni pogled moda v XMCL s prikazom različic in odvisnosti
      curate:
        label: 03 / UREDITE
        title: Ohranite delujoči nabor vitek in premišljen.
        description: Iščite, razvrščajte, združujte v skupine, posodabljajte in odstranjujte mode, ki ne sodijo več zraven. Skupine po meri olajšajo preizkušanje izbirne vsebine, primerjavo profilov ali osredotočanje kandidata za izdajo.
        point1: Samodejno preverjanje posodobitev modov
        point2: Skupine po meri za izbirno in testno vsebino
        point3: Iskanje in odstranjevanje neuporabljenih modov
        alt: Pogled upravljanja nameščenih modov v XMCL z iskanjem in nadzorom posodobitev
      export:
        label: 04 / IZVOZITE
        title: Izdajte en paket v formatu, ki ga potrebujejo vaši igralci.
        description: Izvozite izpopolnjen paket modov Modrinth ali CurseForge s pravimi metapodatki in izbranimi datotekami. Korak izdaje postane ponovljiv del poteka dela, ne pa arhiviranje v zadnjem trenutku.
        point1: Izvoz za Modrinth in CurseForge z enim klikom
        point2: Metapodatki avtorja, opisa, URL-ja in različice
        point3: Natančna izbira datotek in sredstev za vključitev
        alt: Zaslon za izvoz paketa modov v XMCL za formata Modrinth in CurseForge
      diagnose:
        label: 05 / DIAGNOSTICIRAJTE
        title: Naj UI pomaga spremeniti poročila o sesutjih v popravke.
        description: Ko testni zagon ne uspe, XMCL združi dnevnike, poročila o sesutjih in agenta UI na istem mestu. Agent lahko pregleda kontekst primerka in pojasni uporaben naslednji korak.
        point1: Branje zagonskih dnevnikov in poročil o sesutjih v kontekstu
        point2: Preiskava datotek primerka ob pomoči UI
        point3: Odpravljanje sporov med modi pred izdajo
        alt: Agent UI v XMCL pri preiskavi napake zagona Minecrafta
    cta:
      kicker: DELOVNA MIZA ZA VAŠO NASLEDNJO IZDAJO
      title: Ustvarite paket. Izdajte paket. Ohranite ga zdravega.
      description: XMCL ustvarjalcem ponuja hiter lokalen krog za odkrivanje, preizkušanje, diagnostiko in izvoz v obeh ekosistemih, ki ju vaši igralci že uporabljajo.
      button: Razišči vse funkcije
