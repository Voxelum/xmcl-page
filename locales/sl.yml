    catalog: Katalog
    guide: Vodnik
    detail: Podrobnosti
  groups:
    instances:
      short: Primerki
      title: Primerki in profili
      description: Ohranite vsako nastavitev Minecrafta neodvisno, pregledno in pripravljeno za zagon, ne da bi izgubili podrobnosti, ki jo delajo vašo.
    community:
      short: Skupnost
      title: Modi in vsebina skupnosti
      description: Odkrivajte, pregledujte in nameščajte projekte, ki različico Minecrafta spremenijo v vaš naslednji svet.
    mods:
      short: Nadzor modov
      title: Upravljanje modov
      description: Ohranite veliko modirano nastavitev pregledno z iskanjem, združevanjem v skupine, preverjanjem odvisnosti in premišljenim nadzorom posodobitev.
    world-tools:
      short: Orodja za svetove
      title: Orodja za svetove
      description: 'Delajte s svetovi v svojih primerkih: preglejte njihovo obliko, izberite dele in spoznajte njihove materiale.'
    sharing:
      short: Deljenje
      title: Deljenje in večigralstvo
      description: Prenesite delujočo nastavitev iz svojega računalnika k prijatelju, na strežnik ali v drugo namestitev z vsemi podrobnostmi.
    accounts:
      short: Računi
      title: Računi in produktivnost
      description: Imejte identiteto, prilagoditve in pogosta dejanja blizu svetov, ki jih igrate.
    diagnostics:
      short: Diagnostika
      title: Diagnostika in pomoč
      description: Ko zagon ne uspe, XMCL postavi dokaze in naslednji korak na isto mesto.
  items:
    instance-library:
      title: Ena urejena knjižnica primerkov
      benefit: Oglejte si osnovne, modirane in eksperimentalne svetove skupaj na enem domačem zaslonu, pripravljenem za zagon.
      capabilities: Ločene različice igre in nalagalniki|Pregled modov, shranjenih svetov in virov na prvi pogled|Zagon nastavitve, ki jo potrebujete
    instance-create-modloaders:
      title: Ustvarjanje primerkov Java in Bedrock
      benefit: Začnite novo nastavitev z nalagalnikom in izdajo, ki ustrezata svetu, ki ga želite igrati.
      capabilities: Izdaja Java in eksperimentalna podpora Bedrock|Forge, Fabric, Quilt, NeoForge, OptiFine in LabyMod|Minecraft in lokalni viri različic
    instance-folder-groups:
      title: Skupine map za primerke
      benefit: Razporedite številne primerke v mape, da različni svetovi in nastavitve ostanejo pregledni.
      capabilities: Združevanje primerkov po namenu ali projektu|Ohranjanje sorodnih nastavitev skupaj|Preklapljanje med mapami iz vrstice primerkov
    instance-settings:
      title: Nastavitve primerka
      benefit: Prilagodite Javo, pomnilnik, različice, nalagalnike in vedenje pri zagonu, ne da bi posegali v druge nastavitve.
      capabilities: Neodvisna konfiguracija primerka|Izbira različice in nalagalnika|Nastavitve videza za posamezen primerek
    instance-theme:
      title: Tema primerka
      benefit: Dajte vsakemu svetu lastno identiteto z ozadji, barvami, zameglitvijo, pisavami in CSS po meri.
      capabilities: Slika ozadja in prekrivni sloj|Zaobljeni robovi in nastavitve pisav|Izvoz in uvoz teme
    local-server:
      title: Zagon lokalnega strežnika
      benefit: Spremenite primerek v nastavljiv lokalni strežnik s svetom, omejitvijo igralcev in datotekami za izvoz.
      capabilities: MOTD, vrata in omejitev igralcev|Izbira datotek sveta in strežnika|Izvoz strežniškega paketa
    server-list:
      title: Seznam strežnikov
      benefit: Imejte večigralske cilje blizu primerka, ki jih uporablja, in spremljajte stanje njihove povezave.
      capabilities: Stanje strežnika in število igralcev|Pripenjanje in odstranjevanje ciljev|Jasen prikaz napak povezave
    modpack-market:
      title: Tržnica paketov modov
      benefit: Brskajte po vsebini Modrinth, CurseForge in FTB na eni sami iskalni tržnici.
      capabilities: Filtri po viru, različici, nalagalniku in kategoriji|Odkrivanje priljubljenih in najnovejših paketov|Odpiranje strani s podrobnostmi paketa
    online-mod-search:
      title: Spletno iskanje modov
      benefit: Poiščite združljive mode na vodilnih platformah skupnosti, še preden pridejo v vaš primerek.
      capabilities: Vira Modrinth in CurseForge|Filtri po različici Minecrafta in nalagalniku|Filtri po okolju in kategoriji
    modpack-detail:
      title: Podrobnosti paketa modov
      benefit: Spoznajte paket pred namestitvijo – od posnetkov zaslona in avtorjev do tehničnih zahtev.
      capabilities: Posnetki zaslona, oznake in statistika projekta|Dejanja namestitve in zagona|Tehnične informacije in zunanji viri
    mod-collections:
      title: Zbirke modov
      benefit: Shranite projekte, h katerim se želite vrniti, in spremenite zbirko v ponovno uporabno nastavitev.
      capabilities: Zbirke v zaganjalniku|Sledeni projekti Modrinth|Paketna namestitev in upravljanje zbirk
    mod-detail:
      title: Podrobnosti moda
      benefit: Preglejte mod pred spremembo primerka ter spoznajte njegove različice, odvisnosti in vire.
      capabilities: Izbira različice in odvisnosti|Nalagalniki, kategorije in povezave do virov|Opis in zunanji viri
    local-mods:
      title: Upravljanje nameščenih modov
      benefit: Oglejte si, kaj je omogočeno, hitro filtrirajte in ohranite delujoči nabor zdrav.
      capabilities: Iskanje, razvrščanje in filtriranje modov|Preverjanje odvisnosti in neuporabljene vsebine|Izbira pravilnika posodabljanja
    custom-mod-groups:
      title: Skupine modov po meri
      benefit: Ustvarite lastne skupine in shranite pravila, ki urejajo zapleten primerek.
      capabilities: Uporaba in shranjevanje pravil združevanja|Združevanje modov iz kontekstnega menija|Omogočanje, onemogočanje ali pregled datotek
    save-preview:
      title: Predogled shranjenih svetov in orodja za koščke (Chunks)
      benefit: Vizualno preglejte svet pred zagonom in izvajajte natančne spremembe na ravni koščkov.
      capabilities: Premikanje in pregledovanje zemljevidov sveta|Izbira, kopiranje ali brisanje koščkov|Branje lastnosti sveta in materialov
    blueprint-preview:
      title: Predogled načrtov
      benefit: Oglejte si strukturo v 3D ter preverite združljivost in materiale, preden jo postavite v igro.
      capabilities: Formata Litematica in WorldEdit|Združljivost in stanje manjkajočih modov|Seznam materialov in pretvorba formatov
    modpack-export:
      title: Izvoz paketa modov
      benefit: Zapakirajte primerek za druge igralce, ne da bi izgubili metapodatke in datoteke, zaradi katerih deluje.
      capabilities: Izvoz za CurseForge in Modrinth|Metapodatki o avtorju, opisu in URL-ju|Izbira datotek in sredstev za vključitev
    server-export:
      title: Izvoz strežnika
      benefit: Izberite prave datoteke sveta in strežnika ter izvozite lokalni strežnik z jasno konfiguracijo.
      capabilities: Izvoz v mapo ali nalaganje|Izbira strežniških datotek|Nastavitev MOTD in možnosti strežnika
    account-login:
      title: Več storitev za preverjanje pristnosti
      benefit: Izberite storitev računa, ki ustreza vašemu načinu igranja – od Microsofta do računov brez povezave in storitev tretjih oseb.
      capabilities: Microsoftovi računi in računi brez povezave|Storitvi Ely.by in LittleSkin|Dodajanje in upravljanje storitev preverjanja pristnosti
    quick-action:
      title: Hitra dejanja
      benefit: Poiščite primerke in ukaze, ne da bi zapustili stran, na kateri delate.
      capabilities: Iskanje ukazov, primerkov in modov|Zagon ali ustvarjanje primerka|Navigacija s tipkovnico prek Ctrl+K
    crash-diagnosis:
      title: Poročila o sesutjih in napakah zagona
      benefit: Preberite dejanske dnevnike, poročila o sesutjih in izpis strežnika ob neuspešnem zagonu.
      capabilities: Dnevniki, poročila o sesutjih in napake zagona|Napake razreševanja modov in izhodne kode|Kopiranje poziva za zunanja orodja umetne inteligence
    ai-agent:
      title: Vgrajeni agent UI
      benefit: Naj agent pregleda navidezni datotečni sistem primerka in pojasni uporaben popravek.
      capabilities: Branje datotek primerka in poročil|Preiskava pred podajo zaključka|Uporaba uporabnega popravka, kadar je to mogoče
