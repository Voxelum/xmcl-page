gameInstall:
  title:
    body: Brez skrbi glede {gameInstall}
    gameInstall: namestitve igre
  description: >-
    XMCL podpira namestitev osnovnega Minecrafta, Minecraft Forge, Fabric
    in celo OptiFine vse na enem mestu! Namestite jih lahko neposredno v
    zaganjalniku. Podpira tudi zrcalni strežnik tretje osebe BMCL API,
    v zaganjalniku pa lahko celo nastavite svoj zrcalni strežnik.
optimalDisk:
  title:
    body: '{optimal} prostor na disku z {massiveResources}'
    optimal: Optimalen
    massiveResources: obsežnimi viri
  description: >-
    XMCL shranjuje vse mode, pakete virov, pakete senčilnikov in pakete modov na
    enotni lokaciji shrambe. Ko želite uporabiti znan vir, ga v primerek namesti
    s trdo povezavo brez kopiranja. To pomeni, da v mapi /mods nikoli več
    ne boste imeli podvojenih kopij.
cleanWorkspace:
  title:
    body: Ohranite svoje delovno okolje {clean} z več primerki
    clean: čisto
  description: >-
    XMCL ima vgrajeno podporo za več primerkov. Z lahkoto lahko ustvarite
    več primerkov, zato vam ni treba skrbeti za mešanje različnih
    zagonskih nastavitev.
communityIntegration:
  title:
    body: Povezan z {multipleCommunities}
    multipleCommunities: več skupnostmi
  description: >-
    XMCL ima vgrajeno podporo za CurseForge in Modrinth. Ponuja tudi možnost
    podpore za uporabniške račune in sisteme preoblek po meri, kot je Blessing Skin.
