        label: 02 / 構成の構築
        title: 依存関係の解決もワークフローの一部に。
        description: Mod が別の Mod を必要とする場合、XMCL はその前提 Mod も一緒にインストールできます。プロジェクトを有効化または無効化する際も、依存関係グラフを手動で追跡することなく整合性を保てるようランチャーが支援します。
        point1: 依存関係の自動インストール
        point2: 依存関係を考慮した有効化・無効化の切り替え
        point3: バージョン、Loader、プロジェクトのメタデータを確認
        alt: バージョンと依存関係を表示する XMCL の Mod 詳細画面
      curate:
        label: 03 / 構成の整理
        title: 作業セットを常に無駄なく整理。
        description: 検索、並べ替え、グループ化、更新を行い、不要になった Mod を削除できます。カスタムグループを活用すれば、オプション機能のテスト、プロファイルの比較、リリース候補の絞り込みが容易になります。
        point1: Mod の自動更新チェック
        point2: オプションやテスト用のカスタムグループ
        point3: 未使用の Mod を検出して削除
        alt: 検索と更新操作を備えた XMCL のインストール済み Mod 管理画面
      export:
        label: 04 / エクスポートと配布
        title: プレイヤーが必要とする形式で Modpack を配布。
        description: 適切なメタデータと選択したファイルを含んだ、完成度の高い Modrinth または CurseForge 形式の Modpack をエクスポートできます。リリースの作業が、直前の手作業アーカイブではなく再現可能なワークフローの一部になります。
        point1: Modrinth と CurseForge へのワンクリックエクスポート
        point2: 作者、説明、URL、バージョンのメタデータ設定
        point3: 配布に含めるファイルやアセットを正確に選択
        alt: Modrinth および CurseForge 形式の XMCL Modpack エクスポート画面
      diagnose:
        label: 05 / 問題の診断
        title: AI がクラッシュレポートを解決策へと変換。
        description: テスト起動が失敗した際、XMCL はログ、クラッシュレポート、AI Agent を同じ画面にまとめます。Agent がインスタンス環境を調査し、実行可能な次の解決ステップを提示します。
        point1: コンテキストとともに起動ログとクラッシュレポートを確認
        point2: AI によるインスタンスファイルの調査支援
        point3: リリース前に Mod の競合を解決
        alt: Minecraft の起動失敗を調査する XMCL AI Agent
