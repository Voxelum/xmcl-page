        title: Koristite format koji vaša distribucija razumije.
        description: Preuzmite izvorni paket za svoju radnu površinu ili upotrijebite Flathub ako želite prijenosnu opciju prilagođenu Steam Decku. XMCL također nudi ARM64 izdanja kada hardver to zahtijeva.
        point1: DEB i RPM za popularne Linux distribucije
        point2: AppImage i tar.xz za prijenosne instalacije
        point3: Podrška za Flathub na Steam Decku
        alt: XMCL dijaloški okvir za izradu instance s Minecraft verzijama i učitavačima modova
      organize:
        label: 02 / ODRŽITE RED
        title: Svaka instanca ima vlastitu čistu stazu.
        description: Odvojite vanilla, modirane, testne i poslužiteljske konfiguracije bez ručnog prebacivanja mapa. Vaše verzije, učitavači, modovi, svjetovi i postavke ostaju zajedno.
        point1: Neovisni podaci igre i postavke pokretanja
        point2: Forge, Fabric, Quilt, NeoForge i drugi
        point3: Brzo prebacivanje između svjetova i eksperimenata
        alt: XMCL biblioteka instanci s organiziranim Minecraft profilima igre
      anywhere:
        label: 03 / IGRAJTE BILO GDJE
        title: Stolni pokretač koji dobro putuje.
        description: Prijeđite s Linux stolnog računala na Steam Deck bez odricanja od pregledne biblioteke ili pouzdane konfiguracije. XMCL daje vašoj kolekciji prostor za rast bez da se pretvori u tablicu.
        point1: Flathub put dizajniran za Steam Deck
        point2: Fokusirano sučelje na 4K zaslonima
        point3: Otvoreni kod stvoren za Linux igrače
        alt: Početna stranica XMCL-a s velikom bibliotekom instanci
    download:
      kicker: PREUZMI ZA LINUX
      title: Instalirajte XMCL na svoj način.
      description: Odaberite paket koji pripada vašem sustavu ili koristite Flathub za instalaciju XMCL-a na Steam Deck.
      link: Pogledaj sva izdanja i predizdanja
  creators:
    eyebrow: XMCL / ZA KREATORE MODPACKOVA
    title: Izrađujte modpackove s cijelim ciklusom izdanja na jednom mjestu.
    lede: Otkrivajte projekte, rješavajte ovisnosti, testirajte radni skup, dijagnosticirajte rušenja i izvezite uredan Modrinth ili CurseForge paket bez napuštanja pokretača.
    primaryAction: Istraži tijekove rada za kreatore
    secondaryAction: Otvori katalog značajki
    heroNote: Modrinth i CurseForge tijekovi rada uz dijagnostiku potpomognutu AI-em
    visualLabel: XMCL · radni prostor kreatora
    heroAlt: XMCL trgovina modpackova s Modrinth i CurseForge projektima
    visualTag: MODRINTH ↔ CURSEFORGE
    visualStatus: RADNI SKUP USKLAĐEN
    workflowKicker: KREATORSKI CIKLUS
    workflowTitle: Brži put od grube ideje do paketa koji igrači zaista mogu pokrenuti.
    workflowDescription: 'XMCL tretira modpack kao živi sustav. Istražujte oba kataloga, uvodite promišljene izmjene i pustite pokretaču da prikaže odnose koji održavaju vaše izdanje ispravnim.'
    signals:
      sources:
        number: '2×'
        label: Izvori projekata
        description: Pretražujte Modrinth i CurseForge iz jednog radnog prostora.
      export:
        number: '1-KLIK'
        label: Izvoz paketa
        description: Izradite MR ili CF paket spreman za distribuciju u nekoliko koraka.
      ai:
        number: 'AI'
        label: Pomoć kod rušenja
        description: Pretvorite izvješće o grešci u koristan sljedeći korak.
    features:
      discover:
        label: 01 / OTKRIJ
        title: Pretražujte oba ekosustava bez gubitka fokusa.
        description: Pronađite projekte na Modrinthu i CurseForgeu uz filtre za verziju, učitavač, okruženje i kategoriju. XMCL povezuje projekte između oba izvora kako biste lakše usporedili isti rad bez nagađanja.
        point1: Pretraživanje Modrintha i CurseForgea u jednom toku
        point2: Filtri kompatibilnosti za verziju Minecrafta i učitavač
        point3: Povezivanje projekata između platformi
        alt: XMCL mrežno pretraživanje modova s filtrima izvora i kompatibilnosti
      build:
        label: 02 / IZGRADI
        title: Učinite ovisnosti dijelom plana.
        description: Kada jedan mod zahtijeva drugi, XMCL može instalirati ovisnost zajedno s njim. Kada omogućite ili onemogućite projekt, pokretač pomaže održati skup usklađenim umjesto da ručno pratite stablo ovisnosti.
        point1: Automatska instalacija ovisnosti
        point2: Omogućavanje i onemogućavanje svjesno ovisnosti
        point3: Pregled verzija, učitavača i metapodataka projekta
        alt: XMCL prikaz detalja moda s verzijama i ovisnostima
      curate:
        label: 03 / UREDI
        title: Držite radni skup laganim i promišljenim.
        description: Pretražujte, sortirajte, grupirajte, ažurirajte i uklanjajte modove koji više ne pripadaju paketu. Prilagođene grupe olakšavaju testiranje opcionalnog sadržaja, usporedbu profila ili održavanje fokusa kandidata za izdanje.
        point1: Automatska provjera ažuriranja modova
        point2: Prilagođene grupe za opcionalni i testni sadržaj
        point3: Pronalaženje i uklanjanje nekorištenih modova
        alt: XMCL prikaz upravljanja instaliranim modovima s kontrolama pretraživanja i ažuriranja
      export:
        label: 04 / IZVEZI
        title: Isporučite paket u formatu koji vašim igračima treba.
        description: Izvezite dotjeran Modrinth ili CurseForge modpack s točnim metapodacima i odabranim datotekama. Korak izdanja postaje ponovljiv dio tijeka rada, a ne ručno arhiviranje u zadnji čas.
        point1: Izvoz za Modrinth i CurseForge jednim klikom
        point2: Metapodaci o autoru, opisu, URL-u i verziji
        point3: Odaberite točno koje datoteke i resursi idu u paket
        alt: XMCL zaslon za izvoz modpacka u Modrinth i CurseForge formatima
      diagnose:
        label: 05 / DIJAGNOSTICIRAJ
        title: Neka AI pomogne pretvoriti izvješća o rušenju u rješenja.
        description: Kada testno pokretanje ne uspije, XMCL stavlja zapisnike, izvješća o rušenju i AI agenta na isto mjesto. Agent može pregledati kontekst instance i objasniti konkretan sljedeći korak.
        point1: Čitanje zapisnika pokretanja i izvješća o rušenju u kontekstu
        point2: Istraga datoteka instance potpomognuta AI-em
        point3: Rješavanje sukoba modova prije objave
        alt: XMCL AI agent koji istražuje neuspjelo pokretanje Minecrafta
    cta:
      kicker: RADNA KLUPA ZA VAŠE SLJEDEĆE IZDANJE
      title: Napravite paket. Objavite paket. Održavajte ga ispravnim.
      description: XMCL daje kreatorima brz lokalni ciklus za otkrivanje, testiranje, dijagnostiku i izvoz za oba ekosustava koja vaši igrači već koriste.
      button: Istraži svaku značajku
