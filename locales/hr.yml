  description: >-
    XMCL je moderan Minecraft pokretač koji vam omogućuje upravljanje ogromnim
    količinama resursa poput modpackova, paketa resursa, modova, paketa
    shadera... Također ima ugrađenu integraciju s Minecraft Forge, Fabric,
    Quilt, CurseForge i Modrinth platformama.
