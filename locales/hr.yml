gameInstall:
  title:
    body: Više ne brinite o {gameInstall}
    gameInstall: instalaciji igre
  description: >-
    XMCL podržava instalaciju izvornog Minecrafta, Minecraft Forgea, Fabrica,
    pa čak i OptiFinea – sve na jednom mjestu! Sve ih možete instalirati unutar
    samog pokretača. Također podržava zrcalne poslužitelje trećih strana poput
    BMCL API-ja, a možete prilagoditi i vlastito zrcalo u pokretaču.
optimalDisk:
  title:
    body: '{optimal} prostor na disku uz {massiveResources}'
    optimal: Optimalan
    massiveResources: ogromne resurse
  description: >-
    XMCL sprema sve modove, pakete resursa, pakete shadera i modpackove na
    jedno zajedničko mjesto. Kada želite upotrijebiti već poznati resurs,
    pokretač koristi tvrdu vezu (hard link) za instalaciju u instancu bez
    kopiranja. To znači da više nikada nećete imati duplicirane kopije u mapi
    /mods.
cleanWorkspace:
  title:
    body: Održite radni prostor {clean} uz više instanci
    clean: urednim
  description: >-
    XMCL ima ugrađenu podršku za više instanci. Možete jednostavno stvoriti
    više odvojenih instanci tako da ne morate brinuti o miješanju različitih
    postavki pokretanja.
communityIntegration:
  title:
    body: Integriran s {multipleCommunities}
    multipleCommunities: više zajednica
  description: >-
    XMCL ima ugrađenu podršku za CurseForge i Modrinth. Također omogućuje
    podršku za prilagođene korisničke račune i sustave skinova poput Blessing
    Skina.
