  groups:
    instances:
      short: Instance
      title: Instance i profili
      description: Držite svaku Minecraft konfiguraciju neovisnom, preglednom i spremnom za pokretanje bez gubitka detalja koji je čine vašom.
    community:
      short: Zajednica
      title: Modovi i sadržaj zajednice
      description: Otkrijte, pregledajte i instalirajte projekte koji pretvaraju Minecraft verziju u vaš sljedeći svijet.
    mods:
      short: Upravljanje modovima
      title: Upravljanje modovima
      description: Održavajte veliko modirano okruženje preglednim uz pretraživanje, grupiranje, provjeru ovisnosti i promišljenu kontrolu ažuriranja.
    world-tools:
      short: Alati za svjetove
      title: Alati za svjetove
      description: "Radite sa svjetovima unutar svojih instanci: pregledajte njihov oblik, odaberite dijelove i razumijte njihove materijale."
    sharing:
      short: Dijeljenje
      title: Dijeljenje i višeigrački način
      description: Prenesite funkcionalnu konfiguraciju sa svog računala prijatelju, na poslužitelj ili drugu instalaciju sa svim detaljima.
    accounts:
      short: Računi
      title: Računi i produktivnost
      description: Držite identitet, prilagodbe i česte radnje blizu svjetova koje igrate.
    diagnostics:
      short: Dijagnostika
      title: Dijagnostika i pomoć
      description: Kada pokretanje ne uspije, XMCL stavlja dokaze i sljedeći korak na isto mjesto.
  items:
    instance-library:
      title: Jedna organizirana biblioteka instanci
      benefit: Pogledajte vanilla, modirane i eksperimentalne svjetove zajedno na jednom mjestu spremnom za pokretanje.
      capabilities: Odvojene verzije igre i učitavači|Pregled modova, svjetova i resursa na prvi pogled|Pokrenite konfiguraciju koja vam treba
    instance-create-modloaders:
      title: Izrada Java i Bedrock instanci
      benefit: Započnite novu konfiguraciju s učitavačem i izdanjem koje odgovara svijetu koji želite igrati.
      capabilities: Java Edition i eksperimentalna podrška za Bedrock|Forge, Fabric, Quilt, NeoForge, OptiFine i LabyMod|Minecraft i lokalni izvori verzija
    instance-folder-groups:
      title: Grupe mapa za instance
      benefit: Rasporedite veći broj instanci u mape kako bi različiti svjetovi i konfiguracije ostali lako pregledni.
      capabilities: Grupirajte instance prema namjeni ili projektu|Držite povezane konfiguracije zajedno|Prebacujte se između mapa s trake instanci
    instance-settings:
      title: Postavke instance
      benefit: Podesite Javu, memoriju, verzije, učitavače i ponašanje pri pokretanju bez utjecaja na druge konfiguracije.
      capabilities: Neovisna konfiguracija instance|Odabir verzije i učitavača|Kontrole izgleda za svaku instancu
    instance-theme:
      title: Tema instance
      benefit: Dajte svakom svijetu vlastiti identitet pomoću pozadina, boja, zamućenja, fontova i prilagođenog CSS-a.
      capabilities: Pozadinska slika i prekrivanje|Zaobljeni kutovi i kontrole fonta|Izvoz i uvoz teme
    local-server:
      title: Pokretanje lokalnog poslužitelja
      benefit: Pretvorite instancu u prilagodljiv lokalni poslužitelj sa svijetom, ograničenjem igrača i datotekama za izvoz.
      capabilities: MOTD, port i ograničenje broja igrača|Odabir svijeta i datoteka poslužitelja|Izvoz paketa poslužitelja
    server-list:
      title: Popis poslužitelja
      benefit: Držite višeigračka odredišta blizu instance koja ih koristi i pratite status njihove veze.
      capabilities: Status poslužitelja i broj igrača|Prikvačite i uklonite odredišta|Jasan prikaz grešaka povezivanja
    modpack-market:
      title: Trgovina modpackova
      benefit: Pregledavajte sadržaj s platformi Modrinth, CurseForge i FTB na jednom pretraživom mjestu.
      capabilities: Filtri po izvoru, verziji, učitavaču i kategoriji|Otkrivanje popularnih i najnovijih paketa|Otvaranje stranice s detaljima paketa
    online-mod-search:
      title: Mrežno pretraživanje modova
      benefit: Pronađite kompatibilne modove na glavnim platformama zajednice prije nego što dođu u vašu instancu.
      capabilities: Izvori Modrinth i CurseForge|Filtri po verziji Minecrafta i učitavaču|Filtri po okruženju i kategoriji
    modpack-detail:
      title: Detalji modpacka
      benefit: Upoznajte paket prije instalacije, od snimaka zaslona i autora do tehničkih zahtjeva.
      capabilities: Snimke zaslona, oznake i statistike projekta|Radnje instalacije i pokretanja|Tehničke informacije i vanjski resursi
    mod-collections:
      title: Kolekcije modova
      benefit: Spremite projekte kojima se želite vratiti i pretvorite kolekciju u ponovno upotrebljivu konfiguraciju.
      capabilities: Kolekcije u pokretaču|Praćeni Modrinth projekti|Skupna instalacija i upravljanje kolekcijama
    mod-detail:
      title: Detalji moda
      benefit: Pregledajte mod prije izmjene instance i upoznajte njegove verzije, ovisnosti i izvore.
      capabilities: Odabir verzije i ovisnosti|Učitavači, kategorije i poveznice na izvore|Opis i vanjski resursi
    local-mods:
      title: Upravljanje instaliranim modovima
      benefit: Pogledajte što je omogućeno, brzo filtrirajte i održavajte radni skup ispravnim.
      capabilities: Pretraživanje, sortiranje i filtriranje modova|Provjera ovisnosti i nekorištenog sadržaja|Odabir pravila ažuriranja
    custom-mod-groups:
      title: Prilagođene grupe modova
      benefit: Izradite vlastite grupe i spremite pravila koja organiziraju složenu instancu.
      capabilities: Primjena i spremanje pravila grupiranja|Grupiranje modova iz kontekstnog izbornika|Omogućavanje, onemogućavanje ili pregled datoteka
    save-preview:
      title: Pregled svjetova i alati za chunkove
      benefit: Vizualno pregledajte svijet prije pokretanja i napravite precizne izmjene na razini chunkova.
      capabilities: Pomicanje i pregled karata svijeta|Odabir, kopiranje ili brisanje chunkova|Pregled svojstava svijeta i materijala
    blueprint-preview:
      title: Pregled nacrta
      benefit: Pregledajte strukturu u 3D prikazu te provjerite kompatibilnost i materijale prije postavljanja u igri.
      capabilities: Formati Litematica i WorldEdit|Status kompatibilnosti i nedostajućih modova|Popis materijala i pretvorba formata
    modpack-export:
      title: Izvoz modpacka
      benefit: Zapakirajte instancu za druge igrače bez gubitka metapodataka i datoteka koje je čine funkcionalnom.
      capabilities: Izvoz za CurseForge i Modrinth|Metapodaci o autoru, opisu i URL-u|Odabir datoteka i resursa za uključivanje
    server-export:
      title: Izvoz poslužitelja
      benefit: Odaberite pravi svijet i datoteke poslužitelja, a zatim izvezite lokalni poslužitelj s jasnom konfiguracijom.
      capabilities: Izvoz u mapu ili prijenos|Odabir datoteka poslužitelja|Konfiguracija MOTD-a i opcija poslužitelja
    account-login:
      title: Više servisa za autentifikaciju
      benefit: Odaberite servis računa koji odgovara načinu na koji igrate, od Microsofta do izvanmrežnih i servisa trećih strana.
      capabilities: Microsoft i izvanmrežni računi|Servisi Ely.by i LittleSkin|Dodavanje i upravljanje servisima autentifikacije
    quick-action:
      title: Brza radnja
      benefit: Pronađite instance i naredbe bez napuštanja stranice na kojoj radite.
      capabilities: Pretraživanje naredbi, instanci i modova|Pokretanje ili izrada instance|Navigacija tipkovnicom putem Ctrl+K
    crash-diagnosis:
      title: Izvješća o rušenju i neuspjelom pokretanju
      benefit: Pročitajte stvarne zapisnike, izvješća o rušenju i izlaz poslužitelja iza neuspjelog pokretanja.
      capabilities: Zapisnici, izvješća o rušenju i greške pokretanja|Greške razrješavanja modova i izlazni kodovi|Kopiranje upita za vanjske AI alate
    ai-agent:
      title: Ugrađeni AI agent
      benefit: Dopustite agentu da pregleda virtualni datotečni sustav instance i objasni konkretno rješenje.
      capabilities: Čitanje datoteka i izvješća instance|Istraga prije donošenja zaključka|Primjena konkretnog popravka kada je to moguće
