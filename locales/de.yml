sceneLanding:
  linux:
    eyebrow: XMCL / LINUX EDITION
    title: Der Minecraft-Launcher, der sich unter Linux zu Hause fühlt.
    lede: Ein moderner Open-Source-Launcher für Linux-Desktops und Steam Deck. Wähle das passende Paket und starte jede Welt mit einem klaren Klick.
    primaryAction: Für Linux herunterladen
    secondaryAction: Linux-Workflow ansehen
    heroNote: Native Linux-Builds, ARM64 und Flathub-Unterstützung
    visualLabel: XMCL · Linux-Arbeitsbereich
    heroAlt: XMCL-Startseite mit einer Minecraft-Instanzbibliothek
    visualTag: 4K-bereiter Arbeitsbereich
    visualStatus: BEREIT FÜR DEINE NÄCHSTE WELT
    workflowKicker: LINUX-FIRST WORKFLOW
    workflowTitle: Vom Paketmanager bis zum Spielstart ohne Reibung.
    workflowDescription: XMCL verbindet zuverlässige Installationen, eine klare Oberfläche und unabhängige Spielumgebungen für Linux-Spieler.
    signals:
      packages:
        number: "05"
        label: Linux-Pakete
        description: DEB, RPM, AppImage, tar.xz und Flathub.
      scale:
        number: 4K
        label: Klar auf jeder Größe
        description: Eine übersichtliche Bibliothek für große Bildschirme.
      worlds:
        number: ∞
        label: Getrennte Welten
        description: Versionen, Loader und Speicherstände bleiben getrennt.
    download:
      kicker: FÜR LINUX HERUNTERLADEN
      title: Installiere XMCL auf deine Weise.
      description: Wähle das passende Paket oder nutze Flathub für Steam Deck.
      link: Alle Releases und Prebuilds ansehen
    features:
      install:
        label: 01 / INSTALLATION WÄHLEN
        title: Nutze das Format, das deine Distribution versteht.
        description: Lade ein natives Paket für deinen Desktop herunter oder nutze Flathub für eine portable, Steam-Deck-freundliche Variante. XMCL bietet zudem ARM64-Builds für passende Hardware.
        point1: DEB und RPM für gängige Linux-Desktops
        point2: AppImage und tar.xz für portable Installationen
        point3: Flathub-Unterstützung für Steam Deck
        alt: XMCL-Dialog „Instanz erstellen“ mit Minecraft-Versionen und Mod-Loadern
      organize:
        label: 02 / ORDNUNG BEHALTEN
        title: Jede Instanz bekommt ihre eigene saubere Basis.
        description: Trenne Vanilla-, Mod-, Test- und Server-Setups, ohne Ordner manuell verwalten zu müssen. Deine Versionen, Loader, Mods, Spielstände und Einstellungen bleiben beisammen.
        point1: Unabhängige Spieldaten und Starteinstellungen
        point2: Forge, Fabric, Quilt, NeoForge und mehr
        point3: Schneller Wechsel zwischen Welten und Experimenten
        alt: XMCL-Instanzbibliothek mit organisierten Minecraft-Spielprofilen
      anywhere:
        label: 03 / ÜBERALL SPIELEN
        title: Ein Desktop-Launcher, der dich überallhin begleitet.
        description: Wechsle nahtlos vom Linux-Desktop zu einer Steam-Deck-Session, ohne auf eine übersichtliche Bibliothek oder ein verlässliches Setup zu verzichten. XMCL gibt deiner Sammlung Raum zum Wachsen, ohne dass sie zur Tabelle wird.
        point1: Flathub-Weg, maßgeschneidert für das Steam Deck
        point2: Fokussierte Benutzeroberfläche auf 4K-Bildschirmen
        point3: Open Source und für Linux-Spieler entwickelt
        alt: XMCL-Startseite mit einer großen Instanzbibliothek
  creators:
    eyebrow: XMCL / FÜR MODPACK-ERSTELLER
    title: Baue Modpacks mit dem gesamten Release-Workflow an einem Ort.
    lede: Projekte finden, Abhängigkeiten lösen, testen, Abstürze untersuchen und saubere Modrinth- oder CurseForge-Pakete exportieren.
    primaryAction: Creator-Workflows entdecken
    secondaryAction: Feature-Katalog öffnen
    heroNote: Modrinth-, CurseForge- und KI-gestützte Diagnose-Workflows
    visualLabel: XMCL · Creator-Arbeitsbereich
    heroAlt: XMCL-Modpack-Markt mit Modrinth- und CurseForge-Projekten
    visualTag: MODRINTH ↔ CURSEFORGE
    visualStatus: ARBEITSMENGE SYNCHRON
    workflowKicker: DER CREATOR-KREISLAUF
    workflowTitle: Schneller von der Idee zu einem Modpack, das Spieler starten können.
    workflowDescription: XMCL behandelt ein Modpack als lebendes System und hilft dir, beide Kataloge, Änderungen und Abhängigkeiten im Blick zu behalten.
    signals:
      sources:
        number: 2×
        label: Projektquellen
        description: Modrinth und CurseForge in einem Arbeitsbereich durchsuchen.
      export:
        number: EIN KLICK
        label: Pack-Export
        description: Ein verteilbares MR- oder CF-Paket in wenigen Schritten erstellen.
      ai:
        number: AI
        label: Crash-Hilfe
        description: Aus einem Fehlerbericht eine nächste Aktion ableiten.
    cta:
      kicker: DEINE NÄCHSTE VERÖFFENTLICHUNG
      title: Pack bauen. Pack veröffentlichen. Pack gesund halten.
      description: XMCL bietet Creators einen schnellen lokalen Kreislauf für Suche, Tests, Diagnose und Export.
      button: Alle Features entdecken
    features:
      discover:
        label: 01 / ENTDECKEN
        title: Durchsuche beide Ökosysteme, ohne deinen Fokus zu verlieren.
        description: Finde Projekte auf Modrinth und CurseForge mit Filtern für Version, Loader, Umgebung und Kategorie. XMCL verknüpft Projekte beider Quellen, sodass du denselben Inhalt ohne Rätselraten vergleichen kannst.
        point1: Modrinth- und CurseForge-Suche in einem gemeinsamen Ablauf
        point2: Kompatibilitätsfilter für Minecraft-Versionen und Loader
        point3: Plattformübergreifende Projektzuordnung
        alt: Online-Modsuche in XMCL mit Quell- und Kompatibilitätsfiltern
      build:
        label: 02 / BAUEN
        title: Plane Abhängigkeiten von Anfang an mit ein.
        description: Wenn ein Mod einen anderen Mod benötigt, kann XMCL die Abhängigkeit direkt mitinstallieren. Beim Aktivieren oder Deaktivieren eines Projekts sorgt der Launcher für ein stimmiges Gesamtpaket, statt dich Abhängigkeitsbäume manuell nachverfolgen zu lassen.
        point1: Automatische Installation von Abhängigkeiten
        point2: Abhängigkeitsbewusstes Aktivieren und Deaktivieren
        point3: Versionen, Loader und Projekt-Metadaten prüfen
        alt: XMCL-Mod-Detailansicht mit Versionen und Abhängigkeiten
      curate:
        label: 03 / KURATIEREN
        title: Halte das Mod-Set schlank und zielgerichtet.
        description: Suche, sortiere, gruppiere, aktualisiere und entferne Mods, die nicht mehr benötigt werden. Eigene Gruppen erleichtern das Testen optionaler Inhalte, das Vergleichen von Profilen oder das Fokussieren eines Release-Kandidaten.
        point1: Automatische Prüfung auf Mod-Updates
        point2: Benutzerdefinierte Gruppen für optionale und Test-Inhalte
        point3: Ungenutzte Mods finden und entfernen
        alt: XMCL-Ansicht zur Verwaltung installierter Mods mit Such- und Update-Steuerung
      export:
        label: 04 / EXPORTIEREN
        title: Veröffentliche ein Pack genau in dem Format, das deine Spieler brauchen.
        description: Exportiere ein fertiges Modrinth- oder CurseForge-Modpack mit den passenden Metadaten und ausgewählten Dateien. Die Veröffentlichung wird so zu einem wiederholbaren Schritt im Workflow statt zu einer hektischen Archivierungsaktion in letzter Minute.
        point1: Modrinth- und CurseForge-Export mit einem Klick
        point2: Autor-, Beschreibungs-, URL- und Versions-Metadaten
        point3: Wähle präzise aus, welche Dateien und Assets enthalten sein sollen
        alt: XMCL-Modpack-Exportansicht für Modrinth- und CurseForge-Formate
      diagnose:
        label: 05 / DIAGNOSTIZIEREN
        title: Lass dir von KI helfen, Absturzberichte in Lösungen zu verwandeln.
        description: Schlägt ein Teststart fehl, bündelt XMCL Logs, Absturzberichte und einen KI-Agenten an einem Ort. Der Agent kann den Instanzkontext untersuchen und konkrete nächste Schritte vorschlagen.
        point1: Start-Logs und Absturzberichte im Kontext lesen
        point2: KI-gestützte Untersuchung von Instanzdateien
        point3: Mod-Konflikte vor der Veröffentlichung beheben
        alt: XMCL-KI-Agent bei der Untersuchung eines Minecraft-Startfehlers
