gameInstall:
  title:
    body: Nu-ți mai face griji pentru {gameInstall}
    gameInstall: Instalarea jocului
  description: >-
    XMCL suportă instalarea Minecraft vanilla, Minecraft Forge, Fabric și chiar
    OptiFine, toate într-un singur loc! Le poți instala direct din Launcher. De
    asemenea, suportă link-ul mirror terț BMCL API și îți poți configura chiar
    propriul mirror în launcher.
optimalDisk:
  title:
    body: 'Spațiu pe disc {optimal} pentru {massiveResources}'
    optimal: Optim
    massiveResources: Resurse masive
  description: >-
    XMCL stochează toate modurile, pachetele de resurse, pachetele de shadere și
    pachetele de moduri într-o singură locație. Când folosești orice resursă
    cunoscută, acesta utilizează legături fizice (hard links) pentru a instala
    resursa în instanță fără a o copia. Astfel, nu vei mai vedea niciodată copii
    duplicate în folderul /mods.
cleanWorkspace:
  title:
    body: Păstrează-ți spațiul de lucru {clean} cu instanțe multiple
    clean: Curat
  description: >-
    XMCL are suport integrat pentru instanțe multiple. Poți crea cu ușurință mai
    multe instanțe, astfel încât nu trebuie să îți faci griji că setările
    diferite de lansare se vor amesteca.
communityIntegration:
  title:
    body: Integrat cu {multipleCommunities}
    multipleCommunities: Multiple comunități
  description: >-
    XMCL are suport integrat pentru CurseForge și Modrinth. Oferă, de asemenea,
    posibilitatea de a suporta conturi personalizate și sisteme de skin-uri
    precum Blessing Skin.
