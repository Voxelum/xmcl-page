    search: Caută funcționalități...
    features: funcționalități
    featuresInView: funcționalități afișate
    readWorkflow: Citește fluxul de lucru
  status:
    homepage: Pagina principală
    catalog: Catalog
    guide: Ghid
    detail: Detalii
  groups:
    instances:
      short: Instanțe
      title: Instanțe și profiluri
      description: Păstrează fiecare configurație Minecraft independentă, vizibilă și gata de lansare, fără a pierde detaliile care o fac unică.
    community:
      short: Comunitate
      title: Moduri și conținut al comunității
      description: Descoperă, inspectează și instalează proiectele care transformă o versiune de Minecraft în următoarea ta lume.
    mods:
      short: Control moduri
      title: Gestionarea modurilor
      description: Păstrează o configurație mare cu moduri ușor de înțeles prin căutare, grupare, verificări de dependențe și control precis al actualizărilor.
    world-tools:
      short: Unelte pentru lumi
      title: Unelte pentru lumi
      description: "Lucrează cu lumile din spatele instanțelor tale: inspectează forma lor, selectează porțiuni și analizează materialele."
    sharing:
      short: Partajare
      title: Partajare și multiplayer
      description: Mută o configurație funcțională de pe calculatorul tău la un prieten, pe un server sau pe o altă instalare, cu toate detaliile intacte.
    accounts:
      short: Conturi
      title: Conturi și productivitate
      description: Păstrează identitatea, personalizarea și acțiunile frecvente aproape de lumile pe care le joci.
    diagnostics:
      short: Diagnosticare
      title: Diagnosticare și asistență
      description: Când o lansare eșuează, XMCL pune dovezile și următorul pas în același loc.
  items:
    instance-library:
      title: O bibliotecă organizată de instanțe
      benefit: Vezi lumile vanilla, cu moduri și experimentale împreună, într-un singur loc gata de lansare.
      capabilities: Versiuni de joc și loader-e separate|Vezi modurile, salvările și resursele dintr-o privire|Lansează configurația de care ai nevoie
    instance-create-modloaders:
      title: Creează instanțe Java și Bedrock
      benefit: Începe o configurație nouă cu loader-ul și ediția potrivite pentru lumea pe care vrei să o joci.
      capabilities: Suport Java Edition și Bedrock experimental|Forge, Fabric, Quilt, NeoForge, OptiFine și LabyMod|Surse Minecraft oficiale și versiuni locale
    instance-folder-groups:
      title: Grupuri de foldere pentru instanțe
      benefit: Organizează numeroase instanțe în foldere astfel încât diferitele lumi și configurații să rămână ușor de parcurs.
      capabilities: Grupează instanțele după scop sau proiect|Păstrează configurațiile înrudite împreună|Comută între foldere direct din bara de instanțe
    instance-settings:
      title: Setări ale instanței
      benefit: Ajustează Java, memoria, versiunile, loader-ele și comportamentul la lansare fără a afecta altă configurație.
      capabilities: Configurare independentă pe instanță|Selectare versiune și loader|Control al aspectului per instanță
    instance-theme:
      title: Tema instanței
      benefit: Oferă fiecărei lumi propria identitate cu fundaluri, culori, efect de estompare, fonturi și CSS personalizat.
      capabilities: Imagine de fundal și suprapunere|Colțuri rotunjite și control al fonturilor|Exportă și importă o temă
    local-server:
      title: Lansează un server local
      benefit: Transformă o instanță într-un server local configurabil cu o lume, limită de jucători și fișiere exportabile.
      capabilities: MOTD, port și limită de jucători|Selectare lume și fișiere de server|Exportă un pachet de server
    server-list:
      title: Listă de servere
      benefit: Păstrează destinațiile multiplayer aproape de instanța care le folosește și vezi starea conexiunii.
      capabilities: Stare server și număr de jucători|Fixează și elimină destinații|Afișează clar erorile de conexiune
    modpack-market:
      title: Piața de pachete de moduri
      benefit: Răsfoiește conținut Modrinth, CurseForge și FTB dintr-o singură piață cu căutare integrată.
      capabilities: Filtre după sursă, versiune, loader și categorie|Descoperă pachete populare și recente|Deschide pagina de detalii a pachetului
    online-mod-search:
      title: Căutare online de moduri
      benefit: Găsește moduri compatibile pe principalele platforme ale comunității înainte ca acestea să ajungă în instanța ta.
      capabilities: Surse Modrinth și CurseForge|Filtre pentru versiunea Minecraft și loader|Filtre de mediu și categorii
    modpack-detail:
      title: Detalii pachet de moduri
      benefit: Înțelege un pachet înainte de a-l instala, de la capturi de ecran și autori până la cerințe tehnice.
      capabilities: Capturi de ecran, etichete și statistici ale proiectului|Acțiuni de instalare și lansare|Informații tehnice și resurse externe
    mod-collections:
      title: Colecții de moduri
      benefit: Salvează proiectele la care vrei să revii și transformă o colecție într-o configurație reutilizabilă.
      capabilities: Colecții în launcher|Proiecte Modrinth urmărite|Instalare în lot și gestionare colecții
    mod-detail:
      title: Detalii mod
      benefit: Inspectează un mod înainte de a-ți modifica instanța și înțelege versiunile, dependențele și sursele sale.
      capabilities: Selectare versiuni și dependențe|Loader-e, categorii și link-uri către sursă|Descriere și resurse externe
    local-mods:
      title: Gestionarea modurilor instalate
      benefit: Vezi ce este activat, filtrează rapid și păstrează setul activ funcțional.
      capabilities: Caută, sortează și filtrează moduri|Verifică dependențele și conținutul neutilizat|Alege o politică de actualizare
    custom-mod-groups:
      title: Grupuri personalizate de moduri
      benefit: Creează propriile grupuri și salvează regulile care organizează o instanță complexă.
      capabilities: Aplică și salvează reguli de grupare|Grupează moduri din meniul contextual|Activează, dezactivează sau inspectează fișiere
    save-preview:
      title: Previzualizare salvări și unelte Chunk
      benefit: Examinează vizual o lume înainte de a o lansa și fă modificări precise la nivel de Chunk.
      capabilities: Navighează și inspectează hărțile lumii|Selectează, copiază sau șterge Chunk-uri|Citește proprietățile și materialele lumii
    blueprint-preview:
      title: Previzualizare planuri (Blueprints)
      benefit: Previzualizează o structură în 3D și verifică compatibilitatea și materialele înainte de a o plasa în joc.
      capabilities: Formate Litematica și WorldEdit|Stare compatibilitate și moduri lipsă|Listă de materiale și conversie de format
    modpack-export:
      title: Export pachet de moduri
      benefit: Împachetează o instanță pentru alți jucători fără a pierde metadatele și fișierele necesare funcționării.
      capabilities: Export CurseForge și Modrinth|Metadate pentru autor, descriere și URL|Alege fișierele și resursele de inclus
    server-export:
      title: Export server
      benefit: Selectează lumea și fișierele potrivite ale serverului, apoi exportă un server local cu o configurație clară.
      capabilities: Exportă într-un folder sau încarcă|Selectează fișierele serverului|Configurează MOTD și opțiunile serverului
    account-login:
      title: Servicii multiple de autentificare
      benefit: Alege serviciul de cont care se potrivește modului tău de joc, de la Microsoft la conturi offline și servicii terțe.
      capabilities: Conturi Microsoft și offline|Servicii Ely.by și LittleSkin|Adaugă și gestionează servicii de autentificare
    quick-action:
      title: Acțiune rapidă
      benefit: Găsește instanțe și comenzi fără a părăsi pagina pe care lucrezi.
      capabilities: Caută comenzi, instanțe și moduri|Lansează sau creează o instanță|Navigare rapidă de la tastatură cu Ctrl+K
    crash-diagnosis:
      title: Rapoarte de eroare și eșec la lansare
      benefit: Citește jurnalele reale, rapoartele de crash și ieșirea serverului din spatele unei lansări eșuate.
      capabilities: Jurnale, rapoarte de crash și erori de lansare|Erori de rezolvare a modurilor și coduri de ieșire|Copiază un prompt pentru instrumente AI externe
    ai-agent:
      title: Agent AI integrat
      benefit: Lasă un agent să inspecteze sistemul de fișiere virtual al instanței și să explice o soluție concretă.
      capabilities: Citește fișierele și rapoartele instanței|Investighează înainte de a trage o concluzie|Aplică o remediere concretă atunci când este posibil
