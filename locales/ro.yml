sceneLanding:
  linux:
    eyebrow: XMCL / EDIȚIA LINUX
    title: Launcher-ul Minecraft care se simte nativ pe Linux.
    lede: Un launcher open-source rafinat pentru desktop-uri Linux și Steam Deck. Alege pachetul pe care îl așteaptă distribuția ta, conectează-te la un ecran 4K și păstrează fiecare lume la un singur clic distanță.
    primaryAction: Descarcă pentru Linux
    secondaryAction: Vezi fluxul de lucru Linux
    heroNote: Versiuni Linux native, opțiuni ARM64 și suport Flathub
    visualLabel: XMCL · Spațiu de lucru Linux
    heroAlt: Ecranul principal XMCL afișând o bibliotecă de instanțe Minecraft
    visualTag: Spațiu de lucru pregătit pentru 4K
    visualStatus: GATA PENTRU URMĂTOAREA TA LUME
    workflowKicker: UN FLUX DE LUCRU AXAT PE LINUX
    workflowTitle: De la managerul de pachete la sesiunea de joc, fără obstacole.
    workflowDescription: 'XMCL păstrează aproape lucrurile de care le pasă jucătorilor de Linux: instalări previzibile, o interfață clară și medii de joc independente între care poți comuta cu ușurință.'
    signals:
      packages:
        number: '05'
        label: Pachete Linux
        description: DEB, RPM, AppImage, tar.xz și Flathub.
      scale:
        number: '4K'
        label: Clar la orice scară
        description: O bibliotecă densă care rămâne lizibilă pe un ecran mare.
      worlds:
        number: '∞'
        label: Lumi separate
        description: Previne conflictele între versiuni, loader-e și salvări.
    features:
      install:
        label: 01 / ALEGE INSTALAREA
        title: Folosește formatul pe care distribuția ta îl înțelege.
        description: Descarcă un pachet nativ pentru desktop-ul tău sau folosește Flathub atunci când vrei o variantă portabilă, potrivită pentru Steam Deck. XMCL oferă și versiuni ARM64 acolo unde hardware-ul o cere.
        point1: DEB și RPM pentru distribuțiile Linux populare
        point2: AppImage și tar.xz pentru instalări portabile
        point3: Suport Flathub pentru Steam Deck
        alt: Dialogul XMCL de creare a instanței cu versiuni Minecraft și mod loader-e
      organize:
        label: 02 / PĂSTREAZĂ TOTUL ORGANIZAT
        title: Fiecare instanță are propria sa pistă curată.
        description: Separă configurațiile vanilla, cu moduri, de testare și de server fără a muta foldere manual. Versiunile, loader-ele, modurile, salvările și setările tale rămân împreună.
        point1: Date de joc și setări de lansare independente
        point2: Forge, Fabric, Quilt, NeoForge și altele
        point3: Comutare rapidă între lumi și experimente
        alt: Biblioteca de instanțe XMCL cu profiluri de joc Minecraft organizate
      anywhere:
        label: 03 / JOACĂ ORIUNDE
        title: Un launcher desktop care călătorește bine.
        description: Treci de la un desktop Linux la o sesiune pe Steam Deck fără a renunța la o bibliotecă clară sau la o configurație de încredere. XMCL oferă colecției tale spațiu să crească fără a o transforma într-un tabel complicat.
        point1: Cale Flathub concepută pentru Steam Deck
        point2: O interfață clară pe ecrane 4K
        point3: Open source și construit pentru jucătorii de Linux
        alt: Pagina principală XMCL cu o bibliotecă mare de instanțe
    download:
      kicker: DESCARCĂ PENTRU LINUX
      title: Instalează XMCL în felul tău.
      description: Alege pachetul potrivit sistemului tău sau folosește Flathub pentru a aduce XMCL pe Steam Deck.
      link: Vezi toate versiunile și prebuild-urile
  creators:
    eyebrow: XMCL / PENTRU CREATORI DE PACHETE DE MODURI
    title: Construiește pachete de moduri cu întregul ciclu de lansare într-un singur loc.
    lede: Descoperă proiecte, rezolvă dependențe, testează un set funcțional, diagnostichează erori și exportă un pachet curat pentru Modrinth sau CurseForge fără a părăsi launcher-ul.
    primaryAction: Explorează fluxurile pentru creatori
    secondaryAction: Deschide catalogul de funcționalități
    heroNote: Fluxuri de lucru Modrinth și CurseForge, cu diagnosticare asistată de AI
    visualLabel: XMCL · Spațiu de lucru pentru creatori
    heroAlt: Piața de pachete de moduri XMCL cu proiecte Modrinth și CurseForge
    visualTag: MODRINTH ↔ CURSEFORGE
    visualStatus: SET DE LUCRU SINCRONIZAT
    workflowKicker: CICLUL CREATORULUI
    workflowTitle: O cale mai rapidă de la idee la un pachet pe care jucătorii îl pot lansa cu adevărat.
    workflowDescription: 'XMCL tratează un pachet de moduri ca pe un sistem viu. Explorează ambele cataloage, fă modificări deliberate și lasă launcher-ul să evidențieze relațiile care mențin lansarea stabilă.'
    signals:
      sources:
        number: '2×'
        label: Surse de proiecte
        description: Caută pe Modrinth și CurseForge dintr-un singur spațiu de lucru.
      export:
        number: '1-CLIC'
        label: Export pachet
        description: Construiește un pachet MR sau CF distribuibil în câțiva pași.
      ai:
        number: 'AI'
        label: Asistență la erori
        description: Transformă un raport de eșec într-un următor pas util.
    features:
      discover:
        label: 01 / DESCOPERĂ
        title: Caută în ambele ecosisteme fără să-ți împarți atenția.
        description: Găsește proiecte pe Modrinth și CurseForge cu filtre pentru versiune, loader, mediu și categorie. XMCL mapează proiectele între ambele surse, astfel încât să poți compara același proiect cu mai puține presupuneri.
        point1: Căutare Modrinth și CurseForge într-un singur flux
        point2: Filtre de compatibilitate pentru versiunea Minecraft și loader
        point3: Mapare de proiecte între platforme
        alt: Căutare online de moduri XMCL cu filtre de sursă și compatibilitate
      build:
        label: 02 / CONSTRUIEȘTE
        title: Fă din dependențe o parte a planului.
        description: Când un mod are nevoie de un alt mod, XMCL poate instala dependența odată cu el. Când activezi sau dezactivezi un proiect, launcher-ul te ajută să păstrezi setul coerent în loc să te oblige să urmărești manual graful de dependențe.
        point1: Instalare automată a dependențelor
        point2: Activare și dezactivare conștientă de dependențe
        point3: Inspectează versiuni, loader-e și metadatele proiectului
        alt: Vizualizare detalii mod XMCL afișând versiuni și dependențe
      curate:
        label: 03 / ORGANIZEAZĂ
        title: Păstrează setul de lucru suplu și intenționat.
        description: Caută, sortează, grupează, actualizează și elimină modurile care nu mai au ce căuta acolo. Grupurile personalizate fac ușoară testarea conținutului opțional, compararea profilurilor sau menținerea unei versiuni candidate curate.
        point1: Verificări automate ale actualizărilor pentru moduri
        point2: Grupuri personalizate pentru conținut opțional și de test
        point3: Găsește și elimină modurile neutilizate
        alt: Vizualizare XMCL de gestionare a modurilor instalate cu controale de căutare și actualizare
      export:
        label: 04 / EXPORTĂ
        title: Livrează un singur pachet în formatul de care au nevoie jucătorii tăi.
        description: Exportă un pachet de moduri Modrinth sau CurseForge finisat, cu metadatele corecte și fișierele selectate. Pasul de lansare devine o parte repetabilă a fluxului de lucru, nu o arhivare făcută pe ultima sută de metri.
        point1: Export cu un singur clic pentru Modrinth și CurseForge
        point2: Metadate pentru autor, descriere, URL și versiune
        point3: Alege exact ce fișiere și resurse sunt livrate
        alt: Ecranul XMCL de export pachet de moduri pentru formatele Modrinth și CurseForge
      diagnose:
        label: 05 / DIAGNOSTICHEAZĂ
        title: Lasă AI-ul să transforme rapoartele de crash în soluții.
        description: Când o lansare de test eșuează, XMCL pune jurnalele, rapoartele de crash și un agent AI în același loc. Agentul poate inspecta contextul instanței și poate explica un următor pas concret.
        point1: Citește jurnalele de lansare și rapoartele de crash în context
        point2: Investigare asistată de AI a fișierelor instanței
        point3: Rezolvă conflictele de moduri înainte de lansare
        alt: Agentul AI XMCL investigând o eroare de lansare Minecraft
    cta:
      kicker: UN BANC DE LUCRU PENTRU URMĂTOAREA TA LANSARE
      title: Fă pachetul. Livrează pachetul. Păstrează-l stabil.
      description: XMCL oferă creatorilor un ciclu local rapid pentru descoperire, testare, diagnosticare și export în cele două ecosisteme pe care jucătorii tăi le folosesc deja.
      button: Explorează toate funcționalitățile
