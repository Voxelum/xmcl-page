  ui:
    kicker: XMCL / CATALOG DE FUNCȚIONALITĂȚI
    heading: Launcher-ul, pe înțelesul tău.
    description: Explorează fluxurile de lucru care fac configurarea Minecraft cu moduri mai ușor de construit, înțeles și partajat.
