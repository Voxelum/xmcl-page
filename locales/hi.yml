    homepage: मुख्य पृष्ठ
    catalog: कैटलॉग
    guide: गाइड
    detail: विवरण
  groups:
    instances:
      short: इंस्टेंस
      title: इंस्टेंस और प्रोफाइल
      description: हर माइनक्राफ्ट सेटअप को स्वतंत्र, स्पष्ट और तुरंत खेलने के लिए तैयार रखें।
    community:
      short: समुदाय
      title: मॉड्स और सामुदायिक सामग्री
      description: माइनक्राफ्ट को अपनी अगली दुनिया में बदलने वाले प्रोजेक्ट्स को खोजें और इंस्टॉल करें।
    mods:
      short: मॉड नियंत्रण
      title: मॉड प्रबंधन
      description: खोज, समूहीकरण, निर्भरता जांच और नियंत्रित अपडेट के साथ बड़े मॉड सेटअप को व्यवस्थित रखें।
    world-tools:
      short: वर्ल्ड टूल्स
      title: वर्ल्ड टूल्स
      description: 'अपनी दुनिया के साथ काम करें: संरचना देखें, हिस्से चुनें और सामग्री को समझें।'
    sharing:
      short: शेयरिंग
      title: शेयरिंग और मल्टीप्लेयर
      description: एक काम करने वाले सेटअप को अपने कंप्यूटर से किसी मित्र या सर्वर पर पूरी तरह ट्रांसफर करें।
    accounts:
      short: अकाउंट्स
      title: खाते और उत्पादकता
      description: अपनी पहचान, अनुकूलन और लगातार इस्तेमाल होने वाले कार्यों को अपनी दुनिया के करीब रखें।
    diagnostics:
      short: डायग्नोस्टिक्स
      title: निदान और सहायता
      description: लॉन्च विफल होने पर XMCL त्रुटि लॉग और अगला सुधारात्मक कदम एक ही स्थान पर दिखाता है।
  items:
    instance-library:
      title: व्यवस्थित इंस्टेंस लाइब्रेरी
      benefit: वेनिला, मॉडेड और प्रायोगिक दुनिया को एक ही लॉन्च-रेडी स्थान पर देखें।
      capabilities: अलग गेम संस्करण और लोडर्स|मॉड्स, सेव और रिसोर्सेज पर त्वरित नज़र|अपनी पसंद का सेटअप लॉन्च करें
    instance-create-modloaders:
      title: Java और Bedrock इंस्टेंस बनाएं
      benefit: अपनी पसंद के अनुसार लोडर और संस्करण चुनकर एक नया सेटअप शुरू करें।
      capabilities: Java Edition और प्रायोगिक Bedrock समर्थन|Forge, Fabric, Quilt, NeoForge, OptiFine और LabyMod|माइनक्राफ्ट और स्थानीय संस्करण स्रोत
    instance-folder-groups:
      title: इंस्टेंस फ़ोल्डर समूह
      benefit: कई इंस्टेंस को फ़ोल्डरों में व्यवस्थित करें ताकि अलग-अलग सेटअप आसानी से मिल सकें।
      capabilities: उद्देश्य या प्रोजेक्ट के अनुसार समूह बनाएं|संबंधित सेटअप एक साथ रखें|साइडबार से आसानी से फ़ोल्डर बदलें
    instance-settings:
      title: इंस्टेंस सेटिंग्स
      benefit: दूसरे सेटअप को छुए बिना Java, मेमोरी, वर्शन, लोडर और लॉन्च व्यवहार को ट्यून करें।
      capabilities: स्वतंत्र इंस्टेंस कॉन्फ़िगरेशन|संस्करण और लोडर चयन|प्रति-इंस्टेंस उपस्थिति नियंत्रण
    instance-theme:
      title: इंस्टेंस थीम
      benefit: बैकग्राउंड, रंग, ब्लर, फॉन्ट और कस्टम CSS के साथ हर दुनिया को एक अनूठी पहचान दें।
      capabilities: बैकग्राउंड इमेज और ओवरले|गोल कोने और फ़ॉन्ट नियंत्रण|थीम निर्यात और आयात करें
    local-server:
      title: लोकल सर्वर लॉन्च करें
      benefit: किसी इंस्टेंस को दुनिया, प्लेयर लिमिट और एक्सपोर्टेबल फाइलों के साथ लोकल सर्वर में बदलें।
      capabilities: MOTD, पोर्ट और खिलाड़ी सीमा|दुनिया और सर्वर फाइल चयन|सर्वर पैकेज निर्यात करें
    server-list:
      title: सर्वर सूची
      benefit: मल्टीप्लेयर गंतव्यों को संबंधित इंस्टेंस के पास रखें और कनेक्शन स्थिति देखें।
      capabilities: सर्वर स्थिति और खिलाड़ी संख्या|गंतव्य पिन करें और हटाएं|कनेक्शन विफलताएं स्पष्ट दिखाएं
    modpack-market:
      title: मोडपैक मार्केट
      benefit: Modrinth, CurseForge और FTB सामग्री को एक ही खोजने योग्य बाज़ार से ब्राउज़ करें।
      capabilities: स्रोत, संस्करण, लोडर और श्रेणी फ़िल्टर|ट्रेंडिंग और नवीनतम पैक खोजें|पैक विवरण पृष्ठ खोलें
    online-mod-search:
      title: ऑनलाइन मॉड खोज
      benefit: प्रमुख सामुदायिक प्लेटफ़ॉर्म से संगत मॉड्स को अपने इंस्टेंस में लाने से पहले खोजें।
      capabilities: Modrinth और CurseForge स्रोत|माइनक्राफ्ट संस्करण और लोडर फ़िल्टर|पर्यावरण और श्रेणी फ़िल्टर
    modpack-detail:
      title: मोडपैक विवरण
      benefit: इंस्टॉल करने से पहले स्क्रीनशॉट, लेखकों और तकनीकी आवश्यकताओं को समझें।
      capabilities: स्क्रीनशॉट, टैग और प्रोजेक्ट आँकड़े|इंस्टॉल और लॉन्च क्रियाएं|तकनीकी जानकारी और बाहरी संसाधन
    mod-collections:
      title: मॉड संग्रह
      benefit: 'पसंदीदा प्रोजेक्ट्स को सहेजें और एक संग्रह को पुन: प्रयोज्य सेटअप में बदलें।'
      capabilities: लॉन्चर संग्रह|फॉलो किए गए Modrinth प्रोजेक्ट|बैच इंस्टॉल और संग्रह प्रबंधन
    mod-detail:
      title: मॉड विवरण
      benefit: इंस्टेंस में जोड़ने से पहले मॉड के संस्करण, निर्भरता और स्रोत की जाँच करें।
      capabilities: संस्करण चयन और निर्भरता|लोडर्स, श्रेणियां और स्रोत लिंक|विवरण और बाहरी संसाधन
    local-mods:
      title: इंस्टॉल किए गए मॉड प्रबंधन
      benefit: देखें कि क्या सक्षम है, तेज़ी से फ़िल्टर करें और सेटअप को सुचारू रखें।
      capabilities: मॉड्स खोजें, छाँटें और फ़िल्टर करें|निर्भरता और अप्रयुक्त सामग्री जाँचें|अपडेट नीति चुनें
    custom-mod-groups:
      title: कस्टम मॉड समूह
      benefit: अपने स्वयं के समूह बनाएं और जटिल सेटअप को व्यवस्थित करने वाले नियम सहेजें।
      capabilities: समूहीकरण नियम लागू करें और सहेजें|संदर्भ मेनू से मॉड्स समूहीकृत करें|फ़ाइलें सक्षम, अक्षम या निरीक्षण करें
    save-preview:
      title: सेव पूर्वावलोकन और चंक टूल्स
      benefit: लॉन्च करने से पहले दुनिया को विज़ुअली देखें और चंक स्तर पर सटीक बदलाव करें।
      capabilities: विश्व मानचित्र देखें और नेविगेट करें|चंक चुनें, कॉपी करें या हटाएं|दुनिया के गुण और सामग्री पढ़ें
    blueprint-preview:
      title: ब्लूप्रिंट पूर्वावलोकन
      benefit: गेम में रखने से पहले 3D में संरचना देखें और संगतता व सामग्री सत्यापित करें।
      capabilities: Litematica और WorldEdit प्रारूप|संगतता और अनुपलब्ध मॉड स्थिति|सामग्री सूची और प्रारूप रूपांतरण
    modpack-export:
      title: मोडपैक निर्यात
      benefit: अन्य खिलाड़ियों के लिए मेटाडेटा और आवश्यक फाइलों को सुरक्षित रखते हुए पैक बनाएं।
      capabilities: CurseForge और Modrinth निर्यात|लेखक, विवरण और URL मेटाडेटा|शामिल करने के लिए फाइलें चुनें
    server-export:
      title: सर्वर निर्यात
      benefit: सही दुनिया और सर्वर फाइलें चुनें, फिर स्पष्ट कॉन्फ़िगरेशन के साथ लोकल सर्वर निर्यात करें।
      capabilities: फ़ोल्डर या अपलोड में निर्यात करें|सर्वर फाइलें चुनें|MOTD और सर्वर विकल्प कॉन्फ़िगर करें
    account-login:
      title: एकाधिक प्रमाणीकरण सेवाएं
      benefit: Microsoft से लेकर ऑफलाइन और तृतीय-पक्ष सेवाओं तक अपना पसंदीदा खाता चुनें।
      capabilities: Microsoft और ऑफलाइन खाते|Ely.by और LittleSkin सेवाएं|प्रमाणीकरण सेवाएं जोड़ें और प्रबंधित करें
    quick-action:
      title: त्वरित कार्रवाई
      benefit: वर्तमान पृष्ठ को छोड़े बिना इंस्टेंस और कमांड आसानी से खोजें।
