      description: Даследуйце светы, выбірайце іх часткі і вывучайце матэрыялы.
    sharing:
      short: Абмен
      title: Абмен і мультыплэер
      description: Пераносьце працоўную канфігурацыю сябру, на сервер або ў іншую ўсталёўку.
    accounts:
      short: Акаўнты
      title: Акаўнты і прадукцыйнасць
      description: Кіруйце ідэнтычнасцю, выглядам і частымі дзеяннямі побач са сваімі светамі.
    diagnostics:
      short: Дыягностыка
      title: Дыягностыка і дапамога
      description: Пры памылцы запуску ўсе звесткі і наступныя дзеянні знаходзяцца ў адным месцы.
  items:
    instance-library:
      title: Арганізаваная бібліятэка інстансаў
      benefit: Бачыце ванільныя, мадыфікаваныя і эксперыментальныя светы разам у адзінай прасторы, гатовай да запуску.
      capabilities: Асобныя версіі гульні і загрузчыкі|Хуткі агляд модаў, захаванняў і рэсурсаў|Запуск неабходнай канфігурацыі
    instance-create-modloaders:
      title: Стварэнне інстансаў Java і Bedrock
      benefit: Стварайце новую канфігурацыю з загрузчыкам і выданнем, якія адпавядаюць свету, у які вы хочаце гуляць.
      capabilities: Падтрымка Java Edition і эксперыментальнай Bedrock|Forge, Fabric, Quilt, NeoForge, OptiFine і LabyMod|Версіі Minecraft і лакальныя крыніцы версій
    instance-folder-groups:
      title: Групы інстансаў па папках
      benefit: Размяркоўвайце мноства інстансаў па папках, каб розныя светы і канфігурацыі было лёгка аглядаць.
      capabilities: Групоўка інстансаў па прызначэнні або праектах|Захоўвайце звязаныя канфігурацыі разам|Пераключэнне паміж папкамі на панэлі інстансаў
    instance-settings:
      title: Налады інстансу
      benefit: Наладжвайце Java, памяць, версіі, загрузчыкі і паводзіны запуску, не чапаючы іншыя канфігурацыі.
      capabilities: Незалежная канфігурацыя інстансу|Выбар версіі і загрузчыка|Кіраванне знешнім выглядам для кожнага інстансу
    instance-theme:
      title: Тэма інстансу
      benefit: Надайце кожнаму свету ўласную індывідуальнасць з дапамогай фонавых малюнкаў, колераў, размыцця, шрыфтоў і ўласнага CSS.
      capabilities: Фонавы малюнак і накладанне|Закругленыя вуглы і кіраванне шрыфтамі|Экспарт і імпарт тэмы
    local-server:
      title: Запуск лакальнага сервера
      benefit: Ператварыце інстанс у наладжвальны лакальны сервер са светам, лімітам гульцоў і файламі для экспарту.
      capabilities: MOTD, порт і ліміт гульцоў|Выбар свету і файлаў сервера|Экспарт пакета сервера
    server-list:
      title: Спіс сервераў
      benefit: Трымайце мультыплэерныя адрасы побач з інстансам, які іх выкарыстоўвае, і адсочвайце стан злучэння.
      capabilities: Стан сервера і колькасць гульцоў|Замацаванне і выдаленне адрасоў|Выразнае адлюстраванне памылак злучэння
    modpack-market:
      title: Рынак модпакаў
      benefit: Праглядайце кантэнт Modrinth, CurseForge і FTB на адзінай пляцоўцы з пошукам.
      capabilities: Фільтры па крыніцах, версіях, загрузчыках і катэгорыях|Адкрыццё папулярных і найноўшых модпакаў|Адкрыццё старонкі звестак аб модпаку
    online-mod-search:
      title: Пошук модаў онлайн
      benefit: Знаходзьце сумяшчальныя моды на найбуйнейшых платформах супольнасці перад даданнем у свой інстанс.
      capabilities: Крыніцы Modrinth і CurseForge|Фільтры па версіях Minecraft і загрузчыках|Фільтры па асяроддзі і катэгорыях
    modpack-detail:
      title: Падрабязнасці модпака
      benefit: "Вывучыце модпак перад устаноўкай: ад скрыншотаў і аўтараў да тэхнічных патрабаванняў."
      capabilities: Скрыншоты, тэгі і статыстыка праекта|Дзеянні па ўстаноўцы і запуску|Тэхнічная інфармацыя і знешнія рэсурсы
    mod-collections:
      title: Калекцыі модаў
      benefit: Захоўвайце праекты, да якіх хочаце вярнуцца, і ператварайце калекцыі ў гатовыя канфігурацыі.
      capabilities: Калекцыі лаўнчара|Адсочваныя праекты Modrinth|Пакетная ўстаноўка і кіраванне калекцыямі
    mod-detail:
      title: Падрабязнасці мода
      benefit: Вывучайце мод перад змяненнем інстансу і разбірайцеся ў яго версіях, залежнасцях і крыніцах.
      capabilities: Выбар версій і залежнасці|Загрузчыкі, катэгорыі і спасылкі на крыніцы|Апісанне і знешнія рэсурсы
    local-mods:
      title: Кіраванне ўсталяванымі модамі
      benefit: Глядзіце, што ўключана, хутка фільтруйце файлы і падтрымлівайце працоўны набор у парадку.
      capabilities: Пошук, сартаванне і фільтрацыя модаў|Праверка залежнасцей і нявыкарыстанага змесціва|Выбар палітыкі абнаўлення
    custom-mod-groups:
      title: Уласныя групы модаў
      benefit: Стварайце ўласныя групы і захоўвайце правілы для арганізацыі складаных інстансаў.
      capabilities: Ужыванне і захаванне правіл групоўкі|Групоўка модаў праз кантэкстнае меню|Уключэнне, адключэнне або прагляд файлаў
    save-preview:
      title: Прагляд свету і інструменты чанкаў
      benefit: Наглядна аглядайце свет перад запускам і рабіце дакладныя змены на ўзроўні чанкаў.
      capabilities: Перамяшчэнне і агляд карт свету|Выбар, капіяванне або выдаленне чанкаў|Прагляд уласцівасцей свету і матэрыялаў
    blueprint-preview:
      title: Прагляд blueprint
      benefit: Праглядайце пабудову ў 3D і правярайце сумяшчальнасць і матэрыялы перад размяшчэннем у гульні.
      capabilities: Фарматы Litematica і WorldEdit|Сумяшчальнасць і стан адсутных модаў|Спіс матэрыялаў і канвертацыя фарматаў
    modpack-export:
      title: Экспарт модпака
      benefit: Упакоўвайце інстанс для іншых гульцоў без страты метаданых і файлаў, неабходных для працы.
      capabilities: Экспарт для CurseForge і Modrinth|Метаданыя аўтара, апісанне і URL|Выбар файлаў і рэсурсаў для ўключэння
    server-export:
      title: Экспарт сервера
      benefit: Выбірайце патрэбны свет і файлы сервера, затым экспартуйце лакальны сервер са зразумелай канфігурацыяй.
      capabilities: Экспарт у папку або запампоўка|Выбар файлаў сервера|Налада MOTD і параметраў сервера
    account-login:
      title: Некалькі сэрвісаў аўтэнтыфікацыі
      benefit: "Выбірайце сэрвіс акаўнтаў пад свой стыль гульні: ад Microsoft да афлайн-профіляў і іншых сэрвісаў."
      capabilities: Акаўнты Microsoft і афлайн-профілі|Сэрвісы Ely.by і LittleSkin|Даданне сэрвісаў аўтэнтыфікацыі і кіраванне імі
    quick-action:
      title: Хуткія дзеянні
      benefit: Знаходзьце інстансы і каманды, не пакідаючы старонку, на якой вы працуеце.
      capabilities: Пошук каманд, інстансаў і модаў|Запуск або стварэнне інстансу|Кіраванне з клавіятуры праз Ctrl+K
    crash-diagnosis:
      title: Справаздачы аб збоях і памылках запуску
      benefit: Чытайце рэальныя журналы, справаздачы аб збоях і вывад сервера пры няўдалым запуску.
      capabilities: Журналы, справаздачы аб збоях і памылкі запуску|Памылкі сумяшчальнасці модаў і коды выхаду|Капіяванне запыту для знешніх інструментаў AI
    ai-agent:
      title: Убудаваны AI Agent
      benefit: Дазвольце агенту даследаваць віртуальную файлавую сістэму інстансу і прапанаваць канкрэтнае выпраўленне.
      capabilities: Чытанне файлаў і справаздач інстансу|Аналіз перад фармуляваннем высноў|Ужыванне практычнага выпраўлення, калі магчыма
