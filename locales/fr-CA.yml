  « Ouvrir dans le lanceur » pour effectuer la redirection manuellement.
redirectHelperMessage: >-
  Une fenêtre contextuelle vous demandera d'ouvrir le lanceur. Si cela ne
  fonctionne toujours pas, vous pouvez essayer de glisser le bouton directement
  dans la fenêtre du lanceur !
