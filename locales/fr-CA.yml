features:
  label: Fonctionnalités
  ui:
    kicker: XMCL / CATALOGUE DES FONCTIONNALITÉS
    heading: Le lanceur, en un coup d'œil.
    description: Explorez les flux de travail qui simplifient la création, la compréhension et le partage d'une installation Minecraft moddée.
    all: Toutes les fonctionnalités
    search: Rechercher une fonctionnalité…
    features: fonctionnalités
    featuresInView: fonctionnalités affichées
    readWorkflow: Voir le flux de travail
  status:
    homepage: Accueil
    catalog: Catalogue
    guide: Guide
    detail: Détails
  groups:
    instances:
      short: Instances
      title: Instances et profils
      description: Gardez chaque configuration Minecraft indépendante, claire et prête à lancer sans perdre les détails qui la rendent unique.
    community:
      short: Communauté
      title: Mods et contenu communautaire
      description: Découvrez, examinez et installez les projets qui transforment une version de Minecraft en votre prochain monde.
    mods:
      short: Gestion des mods
      title: Gestion des mods
      description: Gardez une grande installation moddée claire grâce à la recherche, au regroupement, à la vérification des dépendances et aux contrôles de mise à jour.
    world-tools:
      short: Outils du monde
      title: Outils du monde
      description: "Travaillez directement avec les mondes de vos instances : inspectez leur structure, sélectionnez des portions et analysez leurs matériaux."
    sharing:
      short: Partage
      title: Partage et multijoueur
      description: Transférez une configuration fonctionnelle vers un ami, un serveur ou une autre installation en conservant tous les détails.
    accounts:
      short: Comptes
      title: Comptes et productivité
      description: Gardez votre identité, votre personnalisation et vos actions fréquentes tout près des mondes dans lesquels vous jouez.
    diagnostics:
      short: Diagnostic
      title: Diagnostic et assistance
      description: Lorsqu'un lancement échoue, XMCL rassemble les indices et la prochaine action au même endroit.
  items:
    instance-library:
      title: Une bibliothèque d'instances organisée
      benefit: Voyez vos mondes vanilla, moddés et expérimentaux ensemble dans un accueil prêt à lancer.
      capabilities: Séparer les versions et les chargeurs|Voir les mods, sauvegardes et ressources en un coup d'œil|Lancer la configuration voulue
    instance-create-modloaders:
      title: Créer des instances Java et Bedrock
      benefit: Démarrez une nouvelle configuration avec l'édition et le chargeur adaptés au monde souhaité.
      capabilities: Java Edition et prise en charge expérimentale de Bedrock|Forge, Fabric, Quilt, NeoForge, OptiFine et LabyMod|Sources Minecraft et versions locales
    instance-folder-groups:
      title: Groupes d'instances par dossiers
      benefit: Classez de nombreuses instances dans des dossiers pour repérer rapidement vos différents mondes et configurations.
      capabilities: Grouper les instances par projet ou usage|Garder les configurations liées ensemble|Changer de dossier depuis la barre des instances
    instance-settings:
      title: Paramètres de l'instance
      benefit: Ajustez Java, la mémoire, les versions, les chargeurs et le lancement sans toucher aux autres installations.
      capabilities: Configuration d'instance indépendante|Choix de la version et du chargeur|Contrôles d'apparence propres à l'instance
    instance-theme:
      title: Thème de l'instance
      benefit: Donnez à chaque monde sa propre identité avec des arrière-plans, couleurs, flou, polices et CSS personnalisé.
      capabilities: Image d'arrière-plan et superposition|Coins arrondis et choix de polices|Importer et exporter un thème
    local-server:
      title: Lancer un serveur local
      benefit: Transformez une instance en serveur local configurable avec un monde, une limite de joueurs et des fichiers exportables.
      capabilities: MOTD, port et limite de joueurs|Sélection du monde et des fichiers serveur|Exporter un paquet serveur
    server-list:
      title: Liste des serveurs
      benefit: Gardez les destinations multijoueur près de l'instance associée et voyez leur état de connexion.
      capabilities: État du serveur et nombre de joueurs|Épingler et retirer des serveurs|Afficher clairement les échecs de connexion
    modpack-market:
      title: Marché des modpacks
      benefit: Parcourez le contenu Modrinth, CurseForge et FTB depuis un marché unique avec recherche intégrée.
      capabilities: Filtres de source, version, chargeur et catégorie|Découverte des packs populaires et récents|Ouvrir la fiche détaillée d'un pack
    online-mod-search:
      title: Recherche de mods en ligne
      benefit: Trouvez des mods compatibles sur les principales plateformes communautaires avant de les ajouter à votre instance.
      capabilities: Sources Modrinth et CurseForge|Filtres de version Minecraft et de chargeur|Filtres d'environnement et de catégorie
    modpack-detail:
      title: Détails du modpack
      benefit: Examinez un pack avant de l'installer, des captures d'écran et auteurs jusqu'aux exigences techniques.
      capabilities: Captures d'écran, étiquettes et statistiques|Actions d'installation et de lancement|Renseignements techniques et ressources externes
    mod-collections:
      title: Collections de mods
      benefit: Enregistrez les projets à revoir plus tard et transformez une collection en configuration réutilisable.
      capabilities: Collections du lanceur|Projets Modrinth suivis|Installation groupée et gestion des collections
    mod-detail:
      title: Détails du mod
      benefit: Inspectez un mod avant de modifier votre instance et consultez ses versions, dépendances et sources.
      capabilities: Choix de version et dépendances|Chargeurs, catégories et liens sources|Description et ressources externes
    local-mods:
      title: Gestion des mods installés
      benefit: Voyez ce qui est activé, filtrez rapidement et gardez votre ensemble de travail en bon état.
      capabilities: Rechercher, trier et filtrer les mods|Vérifier les dépendances et le contenu inutilisé|Choisir une politique de mise à jour
    custom-mod-groups:
      title: Groupes de mods personnalisés
      benefit: Créez vos propres groupes et enregistrez les règles qui organisent une instance complexe.
      capabilities: Appliquer et enregistrer des règles de regroupement|Grouper des mods depuis le menu contextuel|Activer, désactiver ou inspecter des fichiers
    save-preview:
      title: Aperçu de sauvegarde et outils de chunks
      benefit: Visualisez un monde avant de le lancer et effectuez des modifications précises au niveau des chunks.
      capabilities: Parcourir et inspecter les cartes du monde|Sélectionner, copier ou supprimer des chunks|Consulter les propriétés et matériaux du monde
    blueprint-preview:
      title: Aperçu de plan (Blueprint)
      benefit: Prévisualisez une structure en 3D et vérifiez sa compatibilité et ses matériaux avant de la placer en jeu.
      capabilities: Formats Litematica et WorldEdit|Compatibilité et mods manquants|Liste des matériaux et conversion de format
    modpack-export:
      title: Exporter un modpack
      benefit: Empaquetez une instance pour d'autres joueurs sans perdre les métadonnées ni les fichiers essentiels.
      capabilities: Exportation CurseForge et Modrinth|Métadonnées d'auteur, de description et d'URL|Choisir précisément les fichiers et ressources à inclure
    server-export:
      title: Exporter un serveur
      benefit: Sélectionnez le bon monde et les fichiers serveur, puis exportez un serveur local clairement configuré.
      capabilities: Exporter vers un dossier ou téléverser|Choisir les fichiers serveur|Configurer le MOTD et les options du serveur
    account-login:
      title: Services d'authentification multiples
      benefit: Choisissez le service de compte adapté à votre façon de jouer, de Microsoft aux profils hors ligne et services tiers.
      capabilities: Comptes Microsoft et hors ligne|Services Ely.by et LittleSkin|Ajouter et gérer des services d'authentification
    quick-action:
      title: Actions rapides
      benefit: Trouvez des instances et des commandes sans quitter la page sur laquelle vous travaillez.
      capabilities: Rechercher des commandes, instances et mods|Lancer ou créer une instance|Navigation au clavier avec Ctrl+K
    crash-diagnosis:
      title: Rapports de plantage et d'échec de lancement
      benefit: Consultez les journaux, rapports de plantage et sorties serveur derrière un lancement échoué.
      capabilities: Journaux, rapports de plantage et échecs de lancement|Erreurs de résolution de mods et codes de sortie|Copier une requête pour des outils d'IA externes
    ai-agent:
      title: Agent IA intégré
      benefit: Laissez un agent inspecter le système de fichiers virtuel de l'instance et proposer une solution concrète.
      capabilities: Lire les fichiers et rapports de l'instance|Analyser avant de conclure|Appliquer un correctif concret lorsque possible
