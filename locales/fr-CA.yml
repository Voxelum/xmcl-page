gameInstall:
  title:
    body: Plus de souci pour {gameInstall}
    gameInstall: l'installation du jeu
  description: >-
    XMCL prend entièrement en charge l'installation de Minecraft vanilla, Forge,
    Fabric et même OptiFine au même endroit dans le lanceur. Il prend aussi en
    charge le miroir tiers BMCL API, et vous pouvez même configurer votre propre
    miroir personnalisé dans le lanceur.
optimalDisk:
  title:
    body: Espace disque {optimal} même avec des {massiveResources}
    optimal: optimisé
    massiveResources: ressources volumineuses
  description: >-
    XMCL conserve tous vos mods, packs de textures, packs de shaders et modpacks
    dans un seul emplacement de stockage. Lorsque vous utilisez une ressource
    existante, il crée un lien physique (hard link) dans l'instance sans la
    copier. Vous n'aurez donc plus jamais de mods en double dans le dossier
    /mods.
cleanWorkspace:
  title:
    body: Gardez votre espace de travail {clean} grâce aux instances multiples
    clean: propre
  description: >-
    XMCL prend en charge nativement les instances multiples. Vous pouvez créer
    facilement plusieurs instances distinctes sans craindre de mélanger vos
    différents paramètres de lancement.
communityIntegration:
  title:
    body: Intégration {multipleCommunities}
    multipleCommunities: multicommunautaire
  description: >-
    XMCL intègre directement CurseForge, Modrinth et FeedTheBeast (FTB). Il
    prend également en charge les comptes et systèmes d'apparences personnalisés
    comme Blessing Skin.
