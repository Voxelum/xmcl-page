        description: Trouvez des projets sur Modrinth et CurseForge grâce aux filtres de version, chargeur, environnement et catégorie. XMCL fait correspondre les projets entre les deux plateformes pour vous permettre de comparer facilement le même contenu.
        point1: Recherche Modrinth et CurseForge en un seul flux
        point2: Filtres de compatibilité de version Minecraft et de chargeur
        point3: Correspondance des projets entre plateformes
        alt: Recherche de mods en ligne XMCL avec filtres de source et de compatibilité
      build:
        label: 02 / CONSTRUIRE
        title: Intégrez les dépendances dès le départ.
        description: Lorsqu'un mod dépend d'un autre, XMCL peut installer la dépendance automatiquement. Lorsque vous activez ou désactivez un projet, le lanceur maintient la cohérence de l'ensemble au lieu de vous laisser tout vérifier à la main.
        point1: Installation automatique des dépendances
        point2: Activation et désactivation tenant compte des dépendances
        point3: Inspection des versions, chargeurs et métadonnées de projet
        alt: Vue détaillée du mod XMCL affichant les versions et les dépendances
      curate:
        label: 03 / ORGANISER
        title: Gardez un ensemble de travail léger et maîtrisé.
        description: Recherchez, triez, groupez, mettez à jour et retirez les mods superflus. Les groupes personnalisés facilitent l'essai de contenu optionnel, la comparaison de profils ou la préparation d'une version candidate.
        point1: Vérification automatique des mises à jour de mods
        point2: Groupes personnalisés pour le contenu optionnel et les tests
        point3: Repérage et suppression des mods inutilisés
        alt: Vue de gestion des mods installés XMCL avec contrôles de recherche et de mise à jour
      export:
        label: 04 / EXPORTER
        title: Publiez un pack dans le format souhaité par vos joueurs.
        description: Exportez un modpack Modrinth ou CurseForge soigné avec les bonnes métadonnées et les fichiers choisis. La publication devient une étape reproductible du flux de travail, et non une archive bricolée à la dernière minute.
        point1: Exportation en un clic vers Modrinth et CurseForge
        point2: Métadonnées d'auteur, description, URL et version
        point3: Choix précis des fichiers et ressources inclus
        alt: Écran d'exportation de modpack XMCL pour les formats Modrinth et CurseForge
      diagnose:
        label: 05 / DIAGNOSTIQUER
        title: Laissez l'IA transformer les rapports de plantage en correctifs.
        description: Lorsqu'un lancement d'essai échoue, XMCL rassemble journaux, rapports de plantage et agent IA au même endroit. L'agent peut inspecter le contexte de l'instance et expliquer une prochaine étape concrète.
        point1: Lecture des journaux de lancement et rapports de plantage en contexte
        point2: Analyse assistée par IA des fichiers de l'instance
        point3: Résolution des conflits de mods avant la publication
        alt: Agent IA de XMCL analysant un échec de lancement de Minecraft
