gameInstall:
  title:
    body: Ne aggódj többé a {gameInstall} miatt
    gameInstall: játéktelepítés
  description: >-
    Az XMCL egyetlen helyen támogatja a vanilla Minecraft, a Minecraft Forge, a
    Fabric és még az OptiFine telepítését is! Mindent elintézhetsz közvetlenül az
    indítón belül. Emellett támogatja a harmadik féltől származó BMCL API tükröt,
    sőt saját tükröt is beállíthatsz.
optimalDisk:
  title:
    body: '{optimal} tárhelyhasználat {massiveResources} mellett is'
    optimal: Optimális
    massiveResources: hatalmas erőforrások
  description: >-
    Az XMCL minden modot, erőforráscsomagot, shader csomagot és modcsomagot egy
    központi tárhelyen tárol. Amikor egy már ismert erőforrást használsz, hard
    link segítségével telepíti azt a példányba másolás nélkül. Így soha többé nem
    lesznek felesleges másolatok a /mods mappában.
cleanWorkspace:
  title:
    body: Tartsd {clean} a munkaterületedet több példánnyal
    clean: tisztán
  description: >-
    Az XMCL beépített többpéldányos támogatással rendelkezik. Könnyedén
    létrehozhatsz több különálló példányt, így nem kell aggódnod az eltérő
    indítási beállítások keveredése miatt.
communityIntegration:
