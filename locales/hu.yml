  status:
    homepage: Kezdőlap
    catalog: Katalógus
    guide: Útmutató
    detail: Részletek
  groups:
    instances:
      short: Példányok
      title: Példányok és profilok
      description: Tartsd minden Minecraft-beállításodat elkülönítve, átláthatóan és indításra készen anélkül, hogy elveszítenéd az egyedi részleteket.
    community:
      short: Közösség
      title: Modok és közösségi tartalmak
      description: Fedezz fel, vizsgálj meg és telepíts olyan projekteket, amelyek egy Minecraft-verzióból a következő világodat varázsolják.
    mods:
      short: Modkezelés
      title: Modok kezelése
      description: Tartsd átláthatóan a nagyobb modolt összeállításokat kereséssel, csoportosítással, függőség-ellenőrzéssel és tudatos frissítéskezeléssel.
    world-tools:
      short: Világeszközök
      title: Világeszközök
      description: "Dolgozz közvetlenül a példányaid mögötti világokkal: vizsgáld meg a felépítésüket, válassz ki részeket, és nézd át az anyaglistát."
    sharing:
      short: Megosztás
      title: Megosztás és többjátékos mód
      description: Vidd át egy működő összeállításodat a barátaidhoz, egy szerverre vagy egy másik telepítésre minden részlet megőrzésével.
    accounts:
      short: Fiókok
      title: Fiókok és hatékonyság
      description: Tartsd az identitásodat, a testreszabást és a gyakori műveleteket közel a világaidhoz.
    diagnostics:
      short: Diagnosztika
      title: Diagnosztika és segítségnyújtás
      description: Ha egy indítás meghiúsul, az XMCL egy helyen mutatja a bizonyítékokat és a következő lépést.
  items:
    instance-library:
      title: Egyetlen rendezett példánykönyvtár
      benefit: Lásd egy helyen a vanilla, modolt és kísérleti világokat, azonnal indítható állapotban.
      capabilities: Külön játékverziók és modbetöltők|Modok, mentések és erőforrások egy pillantással|Az adott összeállítás azonnali indítása
    instance-create-modloaders:
      title: Java és Bedrock példányok létrehozása
      benefit: Indíts új összeállítást pontosan azzal a betöltővel és kiadással, amelyikre a világodnak szüksége van.
      capabilities: Java Edition és kísérleti Bedrock támogatás|Forge, Fabric, Quilt, NeoForge, OptiFine és LabyMod|Hivatalos Minecraft és helyi verzióforrások
    instance-folder-groups:
      title: Példánymappák és csoportok
      benefit: Rendezd mappákba a példányaidat, hogy a különböző világok és projektek könnyen áttekinthetők maradjanak.
      capabilities: Példányok csoportosítása cél vagy projekt szerint|Összetartozó beállítások egyben tartása|Gyors váltás a mappák között a példánysávon
    instance-settings:
      title: Példánybeállítások
      benefit: Hangold finomra a Javát, a memóriát, a verziókat, a betöltőket és az indítási viselkedést más példányok érintése nélkül.
      capabilities: Független példánykonfiguráció|Verzió- és betöltőválasztás|Példányonkénti megjelenési beállítások
    instance-theme:
      title: Példánytéma
      benefit: Adj minden világnak saját arculatot háttérképekkel, színekkel, elmosással, betűtípusokkal és egyéni CSS-sel.
      capabilities: Háttérkép és fedőréteg|Lekerekített sarkok és betűtípus-beállítások|Témák exportálása és importálása
    local-server:
      title: Helyi szerver indítása
      benefit: Alakíts át egy példányt testreszabható helyi szerverré világválasztással, játékoskorláttal és exportálható fájlokkal.
      capabilities: MOTD, port és játékoskorlát|Világ- és szerverfájlok kiválasztása|Szervercsomag exportálása
    server-list:
      title: Szerverlista
      benefit: Tartsd a többjátékos szervereket közvetlenül a hozzájuk tartozó példány mellett, és lásd a kapcsolat állapotát.
      capabilities: Szerverállapot és játékosszám|Szerverek rögzítése és eltávolítása|Kapcsolódási hibák egyértelmű megjelenítése
    modpack-market:
      title: Modcsomag-piactér
      benefit: Böngéssz a Modrinth, CurseForge és FTB tartalmai között egyetlen kereshető felületen.
      capabilities: Forrás-, verzió-, betöltő- és kategóriaszűrők|Népszerű és legújabb csomagok felfedezése|Csomag részleteinek megnyitása
    online-mod-search:
      title: Online modkeresés
      benefit: Találj kompatibilis modokat a főbb közösségi platformokon, még mielőtt a példányodba kerülnének.
      capabilities: Modrinth és CurseForge források|Minecraft-verzió és betöltő szűrők|Környezeti és kategóriaszűrők
    modpack-detail:
      title: Modcsomag részletei
      benefit: Ismerj meg egy csomagot telepítés előtt, a képernyőképektől és szerzőktől a technikai követelményekig.
      capabilities: Képernyőképek, címkék és projektstatisztikák|Telepítési és indítási műveletek|Technikai adatok és külső források
    mod-collections:
      title: Modgyűjtemények
      benefit: Mentsd el a később is használni kívánt projekteket, és alakíts egy gyűjteményt újrahasznosítható összeállítássá.
      capabilities: Indítón belüli gyűjtemények|Követett Modrinth-projektek|Csoportos telepítés és gyűjteménykezelés
    mod-detail:
      title: Mod részletei
      benefit: Vizsgálj meg egy modot a példány módosítása előtt, és nézd át a verzióit, függőségeit és forrásait.
      capabilities: Verzióválasztás és függőségek|Betöltők, kategóriák és forráslinkek|Leírás és külső hivatkozások
    local-mods:
      title: Telepített modok kezelése
      benefit: Lásd, mi van engedélyezve, szűrj gyorsan, és tartsd stabilan a működő összeállítást.
      capabilities: Modok keresése, rendezése és szűrése|Függőségek és nem használt tartalmak ellenőrzése|Frissítési szabályzat kiválasztása
    custom-mod-groups:
      title: Egyéni modcsoportok
      benefit: Hozz létre saját csoportokat, és mentsd el a szabályokat, amelyek rendszerezik az összetett példányokat.
      capabilities: Csoportosítási szabályok alkalmazása és mentése|Modok csoportosítása a helyi menüből|Fájlok engedélyezése, letiltása vagy megtekintése
    save-preview:
      title: Mentés-előnézet és chunk-eszközök
      benefit: Tekintsd át vizuálisan a világodat indítás előtt, és végezz pontos, chunk-szintű módosításokat.
      capabilities: Világtérképek görgetése és vizsgálata|Chunkok kijelölése, másolása vagy törlése|Világtulajdonságok és anyagok megtekintése
    blueprint-preview:
      title: Tervrajz-előnézet
      benefit: Tekints meg egy építményt 3D-ben, és ellenőrizd a kompatibilitást meg az anyagigényt a játékbeli elhelyezés előtt.
      capabilities: Litematica és WorldEdit formátumok|Kompatibilitás és hiányzó modok jelzése|Anyaglista és formátumkonvertálás
    modpack-export:
      title: Modcsomag exportálása
      benefit: Csomagolj össze egy példányt más játékosok számára anélkül, hogy elvesznének a működéshez szükséges metaadatok és fájlok.
      capabilities: CurseForge és Modrinth exportálás|Szerző, leírás és URL metaadatok|A csomagba kerülő fájlok és erőforrások kiválasztása
    server-export:
      title: Szerver exportálása
      benefit: Válaszd ki a megfelelő világ- és szerverfájlokat, majd exportálj egy átlátható konfigurációjú helyi szervert.
      capabilities: Exportálás mappába vagy feltöltés|Szerverfájlok kiválasztása|MOTD és szerverbeállítások megadása
    account-login:
      title: Többféle hitelesítési szolgáltatás
      benefit: Válaszd ki a játékstílusodhoz illő fiókszolgáltatást a Microsofttól az offline és külső szolgáltatásokig.
      capabilities: Microsoft és offline fiókok|Ely.by és LittleSkin szolgáltatások|Hitelesítési szolgáltatások hozzáadása és kezelése
    quick-action:
      title: Gyorsművelet
      benefit: Találj meg példányokat és parancsokat anélkül, hogy elhagynád az aktuális oldalt.
      capabilities: Parancsok, példányok és modok keresése|Példány indítása vagy létrehozása|Billentyűzet-központú navigáció a Ctrl+K billentyűvel
    crash-diagnosis:
      title: Összeomlási és indítási hibajelentések
      benefit: Olvasd el a sikertelen indítás mögötti valódi naplókat, összeomlási jelentéseket és szerverkimeneteket.
      capabilities: Naplók, összeomlási jelentések és indítási hibák|Modfeloldási hibák és kilépési kódok|Prompt másolása külső AI-eszközökhöz
    ai-agent:
      title: Beépített AI-ügynök
      benefit: Engedd, hogy az ügynök megvizsgálja a példány virtuális fájlrendszerét, és konkrét javítási javaslatot adjon.
      capabilities: Példányfájlok és jelentések olvasása|Alapos vizsgálat a következtetés előtt|Megvalósítható javítás alkalmazása, ha lehetséges
