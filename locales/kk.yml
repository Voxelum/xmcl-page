      benefit: "Ойын стиліңізге сәйкес келетін тіркелгі қызметін таңдаңыз: Microsoft-тан оффлайн және үшінші тарап қызметтеріне дейін."
      capabilities: Microsoft және оффлайн тіркелгілер|Ely.by және LittleSkin қызметтері|Аутентификация қызметтерін қосу және басқару
