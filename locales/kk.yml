      title: Blueprint алдын ала көрінісі
      benefit: Құрылымды ойынға орналастырмас бұрын оны 3D форматында қарап, үйлесімділік пен материалдарды тексеріңіз.
      capabilities: Litematica және WorldEdit форматтары|Үйлесімділік және жетіспейтін мод күйі|Материалдар тізімі және форматты түрлендіру
    modpack-export:
      title: Модпакты экспорттау
      benefit: Инстанстың жұмысын қамтамасыз ететін метадеректер мен файлдарды жоғалтпай, басқа ойыншылар үшін жинақтаңыз.
      capabilities: CurseForge және Modrinth экспорты|Автор, сипаттама және URL метадеректері|Қосылатын файлдар мен активтерді таңдау
