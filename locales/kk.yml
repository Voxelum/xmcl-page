      title: Жеке мод топтары
      benefit: Өз топтарыңызды жасаңыз және күрделі инстансты реттейтін ережелерді сақтаңыз.
      capabilities: Топтау ережелерін қолдану және сақтау|Контекстік мәзірден модтарды топтау|Файлдарды қосу, өшіру немесе тексеру
    save-preview:
      title: Әлемді алдын ала көру және чанк құралдары
      benefit: Әлемді іске қоспас бұрын көрнекі түрде қарап шығыңыз және чанк деңгейінде дәл өзгерістер жасаңыз.
      capabilities: Әлем карталарын жылжыту және қарау|Чанктерді таңдау, көшіру немесе жою|Әлем қасиеттері мен материалдарын оқу
