      benefit: Жұмыс істеп жатқан беттен шықпай-ақ инстанстар мен командаларды табыңыз.
      capabilities: Командаларды, инстанстарды және модтарды іздеу|Инстансты іске қосу немесе жасау|Ctrl+K арқылы жылдам пернетақта навигациясы
