      title: Модпактар нарығы
      benefit: Modrinth, CurseForge және FTB мазмұнын бір іздеу нарығынан қарап шығыңыз.
      capabilities: Көз, нұсқа, жүктеуіш және санат сүзгілері|Трендтегі және соңғы пактерді табу|Пак туралы толық мәлімет бетін ашу
    online-mod-search:
      title: Онлайн мод іздеу
      benefit: Инстансыңызға орнатпас бұрын, негізгі қауымдастық платформаларынан үйлесімді модтарды табыңыз.
      capabilities: Modrinth және CurseForge көздері|Minecraft нұсқасы мен жүктеуіш сүзгілері|Орта және санат сүзгілері
    modpack-detail:
      title: Модпак толық ақпараты
      benefit: Скриншоттар мен авторлардан бастап техникалық талаптарға дейін орнатпас бұрын пак туралы толық түсініңіз.
      capabilities: Скриншоттар, тегтер және жоба статистикасы|Орнату және іске қосу әрекеттері|Техникалық ақпарат және сыртқы ресурстар
    mod-collections:
      title: Мод топтамалары
      benefit: Қайта оралғыңыз келетін жобаларды сақтаңыз және жинақты қайта пайдалануға болатын ортаға айналдырыңыз.
      capabilities: Лаунчер топтамалары|Жазылған Modrinth жобалары|Пакеттік орнату және топтамаларды басқару
    mod-detail:
      title: Мод толық ақпараты
      benefit: Инстансты өзгертпес бұрын модты тексеріп, оның нұсқаларын, тәуелділіктерін және көздерін түсініңіз.
      capabilities: Нұсқаны таңдау және тәуелділіктер|Жүктеуіштер, санаттар және бастапқы код сілтемелері|Сипаттама және сыртқы ресурстар
    local-mods:
      title: Орнатылған модтарды басқару
      benefit: Не қосылғанын көріңіз, жылдам сүзгіден өткізіңіз және жұмыс жинағын дұрыс қалыпта ұстаңыз.
      capabilities: Модтарды іздеу, сұрыптау және сүзгіден өткізу|Тәуелділіктер мен пайдаланылмаған мазмұнды тексеру|Жаңарту саясатын таңдау
