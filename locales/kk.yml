      title: Инстанс параметрлері
      benefit: Басқа жинаққа әсер етпестен Java, жад, нұсқалар, жүктеуіштер және іске қосу әрекетін реттеңіз.
      capabilities: Тәуелсіз инстанс конфигурациясы|Нұсқа мен жүктеуішті таңдау|Әр инстансқа арналған сыртқы көріністі басқару
    instance-theme:
      title: Инстанс тақырыбы
      benefit: Фондар, түстер, бұлдырату, қаріптер және жеке CSS көмегімен әр әлемге өзіндік ерекшелік беріңіз.
      capabilities: Фондық кескін және қабаттасу|Дөңгеленген бұрыштар мен қаріптерді басқару|Тақырыпты экспорттау және импорттау
    local-server:
      title: Жергілікті серверді іске қосу
      benefit: Инстансты әлемі, ойыншылар шегі және экспортталатын файлдары бар теңшелетін жергілікті серверге айналдырыңыз.
      capabilities: MOTD, порт және ойыншылар шегі|Әлем мен сервер файлдарын таңдау|Сервер пакетін экспорттау
    server-list:
      title: Серверлер тізімі
      benefit: Желілік ойын бағыттарын оларды пайдаланатын инстанс жанында ұстаңыз және олардың байланыс күйін көріңіз.
      capabilities: Сервер күйі және ойыншылар саны|Бағыттарды бекіту және жою|Байланыс қателерін анық көрсету
