      benefit: Дұрыс әлем мен сервер файлдарын таңдап, анық конфигурациясы бар жергілікті серверді экспорттаңыз.
      capabilities: Қалтаға экспорттау немесе жүктеу|Сервер файлдарын таңдау|MOTD және сервер параметрлерін теңшеу
