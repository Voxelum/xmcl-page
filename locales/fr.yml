sceneLanding:
  linux:
    eyebrow: XMCL / ÉDITION LINUX
    title: Le launcher Minecraft qui semble natif sous Linux.
    lede: Un launcher open source soigné pour les bureaux Linux et Steam Deck. Choisissez votre paquet et lancez chaque monde en un clic.
    primaryAction: Télécharger pour Linux
    secondaryAction: Voir le workflow Linux
    heroNote: Builds Linux natifs, ARM64 et support Flathub
    visualLabel: XMCL · espace Linux
    heroAlt: Accueil XMCL avec une bibliothèque d’instances Minecraft
    visualTag: Espace prêt pour la 4K
    visualStatus: PRÊT POUR VOTRE PROCHAIN MONDE
    workflowKicker: WORKFLOW LINUX-FIRST
    workflowTitle: Du paquet à la partie sans friction.
    workflowDescription: XMCL réunit des installations prévisibles, une interface claire et des environnements de jeu indépendants pour les joueurs Linux.
    signals:
      packages:
        number: "05"
        label: Paquets Linux
        description: DEB, RPM, AppImage, tar.xz et Flathub.
      scale:
        number: 4K
        label: Lisible à toute échelle
        description: Une bibliothèque claire sur les grands écrans.
      worlds:
        number: ∞
        label: Mondes séparés
        description: Versions, loaders et sauvegardes restent isolés.
    download:
      kicker: TÉLÉCHARGER POUR LINUX
      title: Installez XMCL à votre façon.
      description: Choisissez le paquet adapté ou utilisez Flathub sur Steam Deck.
      link: Voir toutes les versions et builds
    features:
      install:
        label: 01 / CHOISISSEZ VOTRE INSTALLATION
        title: Utilisez le format compris par votre distribution.
        description: Téléchargez un paquet natif pour votre bureau ou passez par Flathub pour une option portable et adaptée au Steam Deck. XMCL propose également des builds ARM64 pour le matériel compatible.
        point1: DEB et RPM pour les distributions Linux courantes
        point2: AppImage et tar.xz pour les installations portables
        point3: Prise en charge de Flathub pour Steam Deck
        alt: Boîte de dialogue de création d'instance XMCL avec versions Minecraft et mod loaders
      organize:
        label: 02 / GARDEZ TOUT ORGANISÉ
        title: Chaque instance dispose de son propre espace dédié.
        description: Séparez les configurations vanilla, moddées, de test et de serveur sans manipuler les dossiers à la main. Vos versions, loaders, mods, sauvegardes et paramètres restent groupés.
        point1: Données de jeu et paramètres de lancement indépendants
        point2: Forge, Fabric, Quilt, NeoForge et plus encore
        point3: Bascule rapide entre vos mondes et vos tests
        alt: Bibliothèque d'instances XMCL avec profils de jeu Minecraft organisés
      anywhere:
        label: 03 / JOUEZ PARTOUT
        title: Un launcher de bureau qui vous suit partout.
        description: Passez d'un bureau Linux à une session sur Steam Deck sans renoncer à une bibliothèque claire ou à une configuration fiable. XMCL laisse votre collection s'agrandir sans se transformer en feuille de calcul.
        point1: Option Flathub conçue pour le Steam Deck
        point2: Une interface soignée sur les écrans 4K
        point3: Open source et conçu pour les joueurs Linux
        alt: Page d'accueil XMCL avec une grande bibliothèque d'instances
  creators:
    eyebrow: XMCL / POUR LES CRÉATEURS DE MODPACKS
    title: Construisez vos modpacks avec toute la boucle de publication au même endroit.
    lede: Trouvez des projets, résolvez les dépendances, testez, analysez les crashs et exportez un pack Modrinth ou CurseForge propre.
    primaryAction: Explorer les workflows créateur
    secondaryAction: Ouvrir le catalogue des fonctionnalités
    heroNote: Workflows Modrinth, CurseForge et diagnostic assisté par IA
    visualLabel: XMCL · espace créateur
    heroAlt: Marché de modpacks XMCL avec des projets Modrinth et CurseForge
    visualTag: MODRINTH ↔ CURSEFORGE
    visualStatus: ENSEMBLE DE TRAVAIL SYNCHRONISÉ
    workflowKicker: LA BOUCLE DU CRÉATEUR
    workflowTitle: De l’idée au pack que les joueurs peuvent réellement lancer.
    workflowDescription: XMCL traite le modpack comme un système vivant et vous aide à suivre les catalogues, les changements et les dépendances.
    signals:
      sources:
        number: 2×
        label: Sources de projets
        description: Recherchez Modrinth et CurseForge dans un seul espace.
      export:
        number: UN CLIC
        label: Export de pack
        description: Créez un paquet MR ou CF distribuable en quelques étapes.
      ai:
        number: IA
        label: Assistance crash
        description: Transformez un rapport d’erreur en prochaine action.
    cta:
      kicker: POUR VOTRE PROCHAINE VERSION
      title: Construire. Publier. Garder le pack sain.
      description: XMCL offre aux créateurs une boucle locale rapide pour découvrir, tester, diagnostiquer et exporter.
      button: Explorer toutes les fonctionnalités
    features:
      discover:
        label: 01 / DÉCOUVRIR
        title: Explorez les deux écosystèmes sans disperser votre attention.
        description: Trouvez des projets sur Modrinth et CurseForge grâce aux filtres de version, loader, environnement et catégorie. XMCL met en correspondance les projets des deux plateformes pour vous permettre de comparer facilement le même contenu.
        point1: Recherche Modrinth et CurseForge en un seul flux
        point2: Filtres de compatibilité de version Minecraft et de loader
        point3: Correspondance des projets entre plateformes
        alt: Recherche de mods en ligne XMCL avec filtres de source et de compatibilité
      build:
        label: 02 / CONSTRUIRE
        title: Intégrez les dépendances dès le départ.
        description: Lorsqu'un mod en nécessite un autre, XMCL peut installer la dépendance automatiquement. Lorsque vous activez ou désactivez un projet, le launcher préserve la cohérence de l'ensemble au lieu de vous laisser suivre le graphe à la main.
        point1: Installation automatique des dépendances
        point2: Actions d'activation et de désactivation prenant en compte les dépendances
        point3: Inspection des versions, loaders et métadonnées de projet
        alt: Vue détaillée du mod XMCL montrant les versions et les dépendances
      curate:
        label: 03 / ORGANISER
        title: Conservez un ensemble de travail épuré et maîtrisé.
        description: Recherchez, triez, groupez, mettez à jour et supprimez les mods superflus. Les groupes personnalisés facilitent le test de contenus optionnels, la comparaison de profils ou la préparation d'une release candidate.
        point1: Vérification automatique des mises à jour de mods
        point2: Groupes personnalisés pour les contenus optionnels et de test
        point3: Recherche et suppression des mods inutilisés
        alt: Vue de gestion des mods installés XMCL avec contrôles de recherche et de mise à jour
      export:
        label: 04 / EXPORTER
        title: Distribuez un modpack au format souhaité par vos joueurs.
        description: Exportez un modpack Modrinth ou CurseForge soigné avec les métadonnées requises et les fichiers sélectionnés. La publication devient une étape répétable du workflow, et non une archive bricolée à la dernière minute.
        point1: Export en un clic vers Modrinth et CurseForge
        point2: Métadonnées d'auteur, description, URL et version
        point3: Choix précis des fichiers et assets à inclure
        alt: Écran d'export de modpack XMCL pour les formats Modrinth et CurseForge
      diagnose:
        label: 05 / DIAGNOSTIQUER
        title: Laissez l'AI vous aider à transformer les rapports de crash en correctifs.
        description: Quand un lancement de test échoue, XMCL regroupe logs, rapports de crash et agent AI au même endroit. L'agent peut inspecter le contexte de l'instance et expliquer une solution concrète.
        point1: Lecture des logs de lancement et rapports de crash en contexte
        point2: Investigation assistée par AI des fichiers de l'instance
        point3: Résolution des conflits de mods avant publication
        alt: Agent AI de XMCL analysant un échec de lancement de Minecraft
