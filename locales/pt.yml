intro:
  first:
    body: Um launcher de Minecraft {openSource} com uma interface {modernUx}.
    openSource: código aberto
    modernUx: moderna
  second:
    body: Gerencie todos os seus {mods} de forma {diskEfficient}!
    diskEfficient: eficiente em disco
