sceneLanding:
  linux:
    eyebrow: XMCL / EDIÇÃO LINUX
    title: O launcher de Minecraft que parece nativo no Linux.
    lede: Um launcher de código aberto e polido para desktops Linux e Steam Deck. Escolha o pacote que sua distribuição espera e mantenha cada mundo a um clique de distância.
    primaryAction: Baixar para Linux
    secondaryAction: Ver o fluxo Linux
    heroNote: Builds nativos para Linux, opções ARM64 e suporte ao Flathub
    visualLabel: XMCL · espaço de trabalho Linux
    heroAlt: Tela inicial do X Minecraft Launcher mostrando uma biblioteca de instâncias do Minecraft
    visualTag: Espaço de trabalho pronto para 4K
    visualStatus: PRONTO PARA SEU PRÓXIMO MUNDO
    workflowKicker: UM FLUXO LINUX-FIRST
    workflowTitle: Do gerenciador de pacotes ao jogo sem fricção.
    workflowDescription: "O XMCL mantém o que os jogadores Linux se importam próximo: instalações previsíveis, uma interface clara e ambientes de jogo independentes."
    signals:
      packages:
        number: "05"
        label: Pacotes Linux
        description: DEB, RPM, AppImage, tar.xz e Flathub.
      scale:
        number: 4K
        label: Claro em qualquer escala
        description: Uma biblioteca densa que permanece legível em telas grandes.
      worlds:
        number: ∞
        label: Mundos separados
        description: Versões, loaders e saves não se misturam.
    download:
      kicker: BAIXAR PARA LINUX
      title: Instale o XMCL do seu jeito.
      description: Escolha o pacote que pertence ao seu sistema, ou use o Flathub para o Steam Deck.
      link: Ver todos os lançamentos e prebuilds
    features:
      install:
        label: 01 / ESCOLHA SUA INSTALAÇÃO
        title: Use o formato que sua distribuição entende.
        description: Baixe um pacote nativo para o seu desktop ou use o Flathub quando quiser uma opção portátil e compatível com o Steam Deck. O XMCL também oferece builds ARM64 quando o hardware exigir.
        point1: DEB e RPM para os principais desktops Linux
        point2: AppImage e tar.xz para instalações portáteis
        point3: Suporte ao Flathub para o Steam Deck
        alt: Diálogo de criação de instância do XMCL com versões do Minecraft e mod loaders
      organize:
        label: 02 / MANTENHA A ORGANIZAÇÃO
        title: Cada instância tem seu próprio espaço dedicado.
        description: Separe configurações vanilla, modificadas, de teste e de servidor sem ter que gerenciar pastas manualmente. Suas versões, loaders, mods, saves e configurações permanecem juntos.
        point1: Dados de jogo e configurações de inicialização independentes
        point2: Forge, Fabric, Quilt, NeoForge e mais
        point3: Alternância rápida entre mundos e experimentos
        alt: Biblioteca de instâncias do XMCL com perfis de jogo do Minecraft organizados
      anywhere:
        label: 03 / JOGUE EM QUALQUER LUGAR
        title: Um launcher para desktop que acompanha você.
        description: Passe do desktop Linux para uma sessão no Steam Deck sem abrir mão de uma biblioteca organizada ou de uma configuração confiável. O XMCL dá espaço para sua coleção crescer sem transformá-la em uma planilha.
        point1: Versão Flathub projetada para o Steam Deck
        point2: Interface nítida em telas 4K
        point3: Código aberto e feito para jogadores de Linux
        alt: Página inicial do XMCL com uma grande biblioteca de instâncias
  creators:
    eyebrow: XMCL / PARA CRIADORES DE MODPACKS
    title: Crie modpacks com todo o ciclo de lançamento em um só lugar.
    lede: Descubra projetos, resolva dependências, teste uma configuração, diagnostique crashes e exporte um pack limpo para Modrinth ou CurseForge sem sair do launcher.
    primaryAction: Explorar fluxos de criadores
    secondaryAction: Abrir o catálogo de funcionalidades
    heroNote: Fluxos Modrinth e CurseForge, com diagnóstico assistido por IA
    visualLabel: XMCL · espaço de trabalho do criador
    heroAlt: Mercado de modpacks do X Minecraft Launcher com projetos do Modrinth e CurseForge
    visualTag: MODRINTH ↔ CURSEFORGE
    visualStatus: CONJUNTO DE TRABALHO SINCRONIZADO
    workflowKicker: O CICLO DO CRIADOR
    workflowTitle: Um caminho mais rápido de uma ideia bruta a um pack que os jogadores podem iniciar.
    workflowDescription: O XMCL trata um modpack como um sistema vivo. Explore ambos os catálogos, faça mudanças deliberadas e deixe o launcher revelar os relacionamentos que mantêm seu lançamento saudável.
    signals:
      sources:
        number: 2×
        label: Fontes de projetos
        description: Busque Modrinth e CurseForge em um único espaço.
      export:
        number: 1 CLIQUE
        label: Exportação do pack
        description: Crie um pacote MR ou CF distribuível em poucos passos.
      ai:
        number: IA
        label: Assistência a crashes
        description: Transforme um relatório de falha em uma próxima ação útil.
    cta:
      kicker: UMA BANCADA PARA SEU PRÓXIMO LANÇAMENTO
      title: Crie o pack. Lance o pack. Mantenha-o saudável.
      description: O XMCL dá aos criadores um ciclo local rápido para descoberta, testes, diagnóstico e exportação nos dois ecossistemas que seus jogadores já usam.
      button: Explorar todas as funcionalidades
    features:
      discover:
        label: 01 / DESCUBRA
        title: Busque em ambos os ecossistemas sem dividir seu foco.
        description: Encontre projetos no Modrinth e no CurseForge com filtros de versão, loader, ambiente e categoria. O XMCL mapeia projetos entre as duas fontes para que você compare o mesmo trabalho sem adivinhações.
        point1: Busca no Modrinth e no CurseForge em um único fluxo
        point2: Filtros de compatibilidade de versão do Minecraft e loader
        point3: Mapeamento de projetos multiplataforma
        alt: Busca online de mods do XMCL com filtros de fonte e compatibilidade
      build:
        label: 02 / CONSTRUA
        title: Faça das dependências parte do plano.
        description: Quando um mod precisa de outro, o XMCL pode instalar a dependência junto. Ao ativar ou desativar um projeto, o launcher ajuda a manter o conjunto resultante coerente, em vez de exigir que você rastreie o grafo manualmente.
        point1: Instalação automática de dependências
        point2: Ações de ativar e desativar com reconhecimento de dependências
        point3: Inspecione versões, loaders e metadados do projeto
        alt: Visualização de detalhes do mod no XMCL mostrando versões e dependências
      curate:
        label: 03 / REFINE
        title: Mantenha o conjunto de trabalho enxuto e intencional.
        description: Busque, ordene, agrupe, atualize e remova os mods que não pertencem mais ao conjunto. Grupos personalizados facilitam testar conteúdo opcional, comparar perfis ou manter uma versão candidata focada.
        point1: Verificação automática de atualizações de mods
        point2: Grupos personalizados para conteúdo de teste e opcional
        point3: Encontre e remova mods não utilizados
        alt: Visualização de gerenciamento de mods instalados do XMCL com controles de busca e atualização
      export:
        label: 04 / EXPORTE
        title: Publique um modpack no formato que seus jogadores precisam.
        description: Exporte um modpack polido para o Modrinth ou CurseForge com os metadados corretos e os arquivos selecionados. O lançamento se torna uma etapa reproduzível do fluxo de trabalho, não uma compactação de última hora.
        point1: Exportação para Modrinth e CurseForge em um clique
        point2: Metadados de autor, descrição, URL e versão
        point3: Escolha exatamente quais arquivos e assets enviar
        alt: Tela de exportação de modpack do XMCL para formatos Modrinth e CurseForge
      diagnose:
        label: 05 / DIAGNOSTIQUE
        title: Deixe a AI ajudar a transformar relatórios de crash em correções.
        description: Quando uma inicialização de teste falha, o XMCL reúne logs, relatórios de crash e um agente de AI no mesmo lugar. O agente pode inspecionar o contexto da instância e sugerir uma ação prática a ser tomada.
        point1: Leia logs de inicialização e relatórios de crash em contexto
        point2: Investigação de arquivos da instância assistida por AI
        point3: Resolva conflitos de mods antes do lançamento
        alt: Agente de AI do XMCL investigando uma falha de inicialização do Minecraft
