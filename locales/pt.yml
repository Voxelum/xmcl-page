optimalDisk:
  title:
    body: Espaço em disco {optimal} com {massiveResources}
    optimal: Ótimo
    massiveResources: recursos massivos
  description: O XMCL armazena todos os mods, pacotes de recursos, shaders e modpacks em um único local. Em vez de copiar arquivos para cada perfil, usa links físicos. Isso significa que você nunca verá arquivos duplicados na pasta /mods, economizando muito espaço em disco.
