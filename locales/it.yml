sceneLanding:
  linux:
    eyebrow: XMCL / EDIZIONE LINUX
    title: Il launcher Minecraft che sembra nativo su Linux.
    lede: Un launcher open source curato per desktop Linux e Steam Deck. Scegli il pacchetto giusto e avvia ogni mondo con un clic.
    primaryAction: Scarica per Linux
    secondaryAction: Vedi il flusso Linux
    heroNote: Build Linux native, ARM64 e supporto Flathub
    visualLabel: XMCL · spazio Linux
    heroAlt: Home di XMCL con una libreria di istanze Minecraft
    visualTag: Spazio pronto per il 4K
    visualStatus: PRONTO PER IL TUO PROSSIMO MONDO
    workflowKicker: FLUSSO LINUX-FIRST
    workflowTitle: Dal pacchetto alla partita senza attriti.
    workflowDescription: XMCL riunisce installazioni prevedibili, un'interfaccia chiara e ambienti di gioco indipendenti per chi usa Linux.
    signals:
      packages:
        number: "05"
        label: Pacchetti Linux
        description: DEB, RPM, AppImage, tar.xz e Flathub.
      scale:
        number: 4K
        label: Chiaro a ogni scala
        description: Una libreria leggibile anche su schermi grandi.
      worlds:
        number: ∞
        label: Mondi separati
        description: Versioni, loader e salvataggi restano indipendenti.
    download:
      kicker: SCARICA PER LINUX
      title: Installa XMCL come preferisci.
      description: Scegli il pacchetto adatto o usa Flathub su Steam Deck.
      link: Vedi tutte le release e le build
    features:
      install:
        label: 01 / SCEGLI L'INSTALLAZIONE
        title: Usa il formato nativo della tua distribuzione.
        description: Scarica un pacchetto nativo per il tuo desktop oppure usa Flathub per una soluzione portatile e ideale per Steam Deck. XMCL offre anche build ARM64 per l'hardware che lo richiede.
        point1: DEB e RPM per i principali desktop Linux
        point2: AppImage e tar.xz per installazioni portatili
        point3: Supporto Flathub per Steam Deck
        alt: Finestra di dialogo per la creazione di istanze di XMCL con versioni di Minecraft e mod loader
      organize:
        label: 02 / MANTIENI L'ORDINE
        title: Ogni istanza ha il suo spazio dedicato e ordinato.
        description: Separa configurazioni vanilla, moddate, di test e server senza dover gestire le cartelle a mano. Versioni, loader, mod, salvataggi e impostazioni restano sempre uniti.
        point1: Dati di gioco e impostazioni di avvio indipendenti
        point2: Forge, Fabric, Quilt, NeoForge e altri ancora
        point3: Passaggio rapido tra mondi ed esperimenti
        alt: Libreria delle istanze di XMCL con profili di gioco Minecraft organizzati
      anywhere:
        label: 03 / GIOCA OVUNQUE
        title: Un launcher desktop perfetto anche in mobilità.
        description: Passa dal desktop Linux a una sessione su Steam Deck senza rinunciare a una libreria ordinata o a una configurazione affidabile. XMCL fa crescere la tua collezione senza trasformarla in un foglio di calcolo.
        point1: Percorso Flathub ottimizzato per Steam Deck
        point2: Un'interfaccia curata anche su schermi 4K
        point3: Open source e creato per i giocatori Linux
        alt: Home page di XMCL con una vasta libreria di istanze
  creators:
    eyebrow: XMCL / PER CREATOR DI MODPACK
    title: Crea modpack con l'intero ciclo di release in un unico posto.
    lede: Scopri progetti, risolvi dipendenze, testa configurazioni, analizza crash ed esporta pack puliti per Modrinth o CurseForge.
    primaryAction: Esplora i flussi per creator
    secondaryAction: Apri il catalogo funzioni
    heroNote: Flussi Modrinth, CurseForge e diagnosi assistita dall'IA
    visualLabel: XMCL · spazio del creator
    heroAlt: Mercato modpack XMCL con progetti Modrinth e CurseForge
    visualTag: MODRINTH ↔ CURSEFORGE
    visualStatus: SET DI LAVORO SINCRONIZZATO
    workflowKicker: IL CICLO DEL CREATOR
    workflowTitle: Dall'idea a un pack che i giocatori possono davvero avviare.
    workflowDescription: XMCL tratta il modpack come un sistema vivo e aiuta a seguire cataloghi, modifiche e dipendenze.
    signals:
      sources:
        number: 2×
        label: Fonti dei progetti
        description: Cerca Modrinth e CurseForge in un solo spazio.
      export:
        number: UN CLIC
        label: Esportazione pack
        description: Crea un pacchetto MR o CF distribuibile in pochi passaggi.
      ai:
        number: IA
        label: Assistenza crash
        description: Trasforma un report di errore in un'azione utile.
    cta:
      kicker: PER LA TUA PROSSIMA RELEASE
      title: Crea. Pubblica. Mantieni sano il pack.
      description: XMCL offre ai creator un ciclo locale rapido per scoprire, testare, diagnosticare ed esportare.
      button: Esplora tutte le funzioni
    features:
      discover:
        label: 01 / SCOPRI
        title: Cerca in entrambi gli ecosistemi senza disperdere l'attenzione.
        description: Trova progetti su Modrinth e CurseForge con filtri per versione, loader, ambiente e categoria. XMCL mappa i progetti tra le due piattaforme per consentirti di confrontare lo stesso lavoro con precisione.
        point1: Ricerca su Modrinth e CurseForge in un unico flusso
        point2: Filtri di compatibilità per versione di Minecraft e loader
        point3: Mappatura multipiattaforma dei progetti
        alt: Ricerca mod online di XMCL con filtri per sorgente e compatibilità
      build:
        label: 02 / CREA
        title: Includi le dipendenze nei tuoi piani.
        description: Quando una mod richiede un'altra mod, XMCL può installare automaticamente la dipendenza necessaria. Quando attivi o disattivi un progetto, il launcher mantiene coerente l'intero insieme senza farti tracciare manualmente il grafo.
        point1: Installazione automatica delle dipendenze
        point2: Attivazione e disattivazione consapevole delle dipendenze
        point3: Ispezione di versioni, loader e metadati del progetto
        alt: Vista dettagli mod di XMCL con versioni e dipendenze
      curate:
        label: 03 / CURA
        title: Mantieni il set di lavoro snello e mirato.
        description: Cerca, ordina, raggruppa, aggiorna e rimuovi le mod non più necessarie. I gruppi personalizzati facilitano il test di contenuti opzionali, il confronto tra profili o la rifinitura di una release candidate.
        point1: Controllo automatico degli aggiornamenti delle mod
        point2: Gruppi personalizzati per contenuti opzionali e di test
        point3: Trova e rimuovi le mod inutilizzate
        alt: Vista gestione mod installate di XMCL con controlli di ricerca e aggiornamento
      export:
        label: 04 / ESPORTA
        title: Distribuisci il pacchetto nel formato adatto ai tuoi giocatori.
        description: Esporta un modpack rifinito per Modrinth o CurseForge con i metadati corretti e i file selezionati. Il rilascio diventa una fase ripetibile del flusso di lavoro, non un'operazione di archiviazione all'ultimo minuto.
        point1: Esportazione con un clic per Modrinth e CurseForge
        point2: Metadati di autore, descrizione, URL e versione
        point3: Scegli esattamente quali file e asset distribuire
        alt: Schermata di esportazione modpack di XMCL per i formati Modrinth e CurseForge
      diagnose:
        label: 05 / DIAGNOSTICA
        title: Lascia che l'AI trasformi i report di crash in soluzioni.
        description: Quando un avvio di prova fallisce, XMCL riunisce log, report di crash e un agente AI nello stesso posto. L'agente può esaminare il contesto dell'istanza e suggerire una soluzione concreta.
        point1: Leggi log di avvio e report di crash nel contesto
        point2: Indagine assistita dall'AI sui file dell'istanza
        point3: Risolvi i conflitti tra mod prima della pubblicazione
        alt: Agente AI di XMCL che esamina un errore di avvio di Minecraft
