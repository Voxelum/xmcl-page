optimalDisk:
  title:
    body: Spazio su disco {optimal} con {massiveResources}
    optimal: Ottimale
    massiveResources: risorse enormi
  description: XMCL salva mod, pacchetti di risorse, shader e modpack in un unico posto. Invece di copiare i file per ogni profilo, vengono usati collegamenti fisici (hard link). Questo significa che non vedrai mai file duplicati nella cartella /mods, risparmiando molto spazio su disco.
