    title: Minecraftowy launcher, który czuje się natywnie na Linuxie.
    lede: Dopieszczony launcher open source dla komputerów z Linuxem i Steam Decka. Wybierz właściwy pakiet i uruchamiaj każdy świat jednym kliknięciem.
    primaryAction: Pobierz dla Linuxa
    secondaryAction: Zobacz workflow Linuxa
    heroNote: Natywne buildy Linux, ARM64 i obsługa Flathub
