      scale:
        number: 4K
        label: Wyraźny w każdej skali
        description: Rozbudowana biblioteka, która pozostaje czytelna na dużym ekranie.
      worlds:
        number: ∞
        label: Osobne światy
        description: Koniec z konfliktami wersji, loaderów i zapisów gry.
    features:
      install:
        label: 01 / WYBIERZ METODĘ INSTALACJI
        title: Używaj formatu, który rozumie Twoja dystrybucja.
        description: Pobierz natywny pakiet dla swojego pulpitu lub skorzystaj z Flathuba, gdy potrzebujesz przenośnego rozwiązania przyjaznego dla Steam Decka. XMCL oferuje również kompilacje ARM64 tam, gdzie wymaga tego sprzęt.
        point1: DEB i RPM dla popularnych pulpitów Linux
        point2: AppImage i tar.xz do instalacji przenośnych
        point3: Obsługa Flathub dla Steam Decka
        alt: Okno dialogowe tworzenia instancji w XMCL z wersjami Minecrafta i modloaderami
      organize:
        label: 02 / ZACHOWAJ PORZĄDEK
        title: Każda instancja otrzymuje własną, czystą przestrzeń.
        description: Rozdziel konfiguracje czyste, zmodyfikowane, testowe i serwerowe bez konieczności ręcznego żonglowania folderami. Twoje wersje, loadery, mody, zapisy i ustawienia pozostają razem.
        point1: Niezależne dane gry i ustawienia uruchamiania
        point2: Forge, Fabric, Quilt, NeoForge i więcej
        point3: Szybkie przełączanie między światami i eksperymentami
        alt: Biblioteka instancji XMCL z uporządkowanymi profilami gier Minecraft
      anywhere:
        label: 03 / GRAJ WSZĘDZIE
        title: Desktopowy launcher, który świetnie sprawdza się w podróży.
        description: Przechodź z komputera z Linuxem do sesji na Steam Decku bez rezygnacji z przejrzystej biblioteki czy niezawodnej konfiguracji. XMCL daje Twojej kolekcji przestrzeń do rozwoju, nie zamieniając jej w arkusz kalkulacyjny.
        point1: Wariant Flathub zaprojektowany z myślą o Steam Decku
        point2: Przejrzysty interfejs na ekranach 4K
        point3: Open source stworzony dla graczy na Linuxie
        alt: Strona główna XMCL z rozbudowaną biblioteką instancji
