  status:
    homepage: Strona główna
    catalog: Katalog
    guide: Poradnik
    detail: Szczegóły
  groups:
    instances:
      short: Instancje
      title: Instancje i profile
      description: Zarządzaj każdą konfiguracją Minecraft niezależnie i miej ją zawsze gotową do uruchomienia.
    community:
      short: Społeczność
      title: Mody i treści społeczności
      description: Odkrywaj, sprawdzaj i instaluj projekty do kolejnego świata Minecraft.
    mods:
      short: Zarządzanie modami
      title: Zarządzanie modami
      description: Uporządkuj duże konfiguracje dzięki wyszukiwaniu, grupom i kontroli zależności.
    world-tools:
      short: Narzędzia świata
      title: Narzędzia świata
      description: Badaj światy, wybieraj ich części i sprawdzaj użyte materiały.
    sharing:
      short: Udostępnianie
      title: Udostępnianie i multiplayer
      description: Przenoś działającą konfigurację do znajomego, serwera lub innej instalacji.
    accounts:
      short: Konta
      title: Konta i produktywność
      description: Zarządzaj tożsamością, wyglądem i częstymi działaniami przy swoich światach.
    diagnostics:
      short: Diagnostyka
      title: Diagnostyka i pomoc
      description: Po błędzie uruchamiania znajdź dowody i następne działanie w jednym miejscu.
  items:
    instance-library:
      title: Zorganizowana biblioteka instancji
      benefit: Przeglądaj czyste, zmodyfikowane i eksperymentalne światy w jednym gotowym do gry miejscu.
      capabilities: Osobne wersje gry i loadery|Błyskawiczny wgląd w mody, zapisy i zasoby|Uruchamiaj konfigurację, której potrzebujesz
    instance-create-modloaders:
      title: Tworzenie instancji Java i Bedrock
      benefit: Rozpocznij nową konfigurację z loaderem i edycją dopasowaną do świata, w który chcesz zagrać.
      capabilities: Java Edition i eksperymentalna obsługa Bedrock|Forge, Fabric, Quilt, NeoForge, OptiFine i LabyMod|Źródła wersji Minecraft i wersji lokalnych
    instance-folder-groups:
      title: Grupowanie instancji w folderach
      benefit: Organizuj instancje w foldery, aby różne światy i konfiguracje pozostały czytelne i uporządkowane.
      capabilities: Grupuj instancje według celu lub projektu|Trzymaj powiązane konfiguracje razem|Przełączaj foldery z bocznego paska instancji
    instance-settings:
      title: Ustawienia instancji
      benefit: Dostosowuj Javę, pamięć, wersje, loadery i zachowanie przy starcie bez wpływu na inne konfiguracje.
      capabilities: Niezależna konfiguracja instancji|Wybór wersji i loadera|Indywidualne ustawienia wyglądu instancji
    instance-theme:
      title: Motyw instancji
      benefit: Nadaj każdemu światu unikalny charakter za pomocą tła, kolorów, rozmycia, czcionek i własnego CSS.
      capabilities: Obraz tła i nakładka|Zaokrąglenia rogów i ustawienia czcionek|Eksport i import motywu
    local-server:
      title: Uruchom lokalny serwer
      benefit: Przekształć instancję w konfigurowalny serwer lokalny ze światem, limitem graczy i plikami gotowymi do eksportu.
      capabilities: MOTD, port i limit graczy|Wybór świata i plików serwera|Eksport paczki serwera
    server-list:
      title: Lista serwerów
      benefit: Trzymaj serwery multiplayer blisko instancji, która z nich korzysta, i sprawdzaj stan połączenia.
      capabilities: Status serwera i liczba graczy|Przypinanie i usuwanie serwerów|Czytelne komunikaty o błędach połączenia
    modpack-market:
      title: Rynek modpacków
      benefit: Przeglądaj zawartość Modrinth, CurseForge i FTB z jednego przeszukiwalnego rynku.
      capabilities: Filtry źródła, wersji, loadera i kategorii|Odkrywanie popularnych i najnowszych paczek|Strona ze szczegółami paczki
    online-mod-search:
      title: Wyszukiwanie modów online
      benefit: Wyszukuj kompatybilne mody na głównych platformach społeczności, zanim trafią do Twojej instancji.
      capabilities: Źródła Modrinth i CurseForge|Filtry wersji Minecrafta i loadera|Filtry środowiska i kategorii
    modpack-detail:
      title: Szczegóły modpacka
      benefit: Poznaj paczkę przed instalacją — od zrzutów ekranu i autorów po wymagania techniczne.
      capabilities: Zrzuty ekranu, tagi i statystyki projektu|Instalacja i uruchamianie|Informacje techniczne i zasoby zewnętrzne
    mod-collections:
      title: Kolekcje modów
      benefit: Zapisuj projekty, do których chcesz wrócić, i przekształcaj kolekcje w gotowe do ponownego użycia konfiguracje.
      capabilities: Kolekcje w launcherze|Obserwowane projekty Modrinth|Instalacja wsadowa i zarządzanie kolekcją
    mod-detail:
      title: Szczegóły moda
      benefit: Sprawdź moda przed zmianą instancji i poznaj jego wersje, zależności oraz źródła.
      capabilities: Wybór wersji i zależności|Loadery, kategorie i linki źródłowe|Opis i zasoby zewnętrzne
    local-mods:
      title: Zarządzanie zainstalowanymi modami
      benefit: Sprawdzaj aktywne elementy, szybko filtruj zawartość i dbaj o spójność działającego zestawu.
      capabilities: Wyszukiwanie, sortowanie i filtrowanie modów|Sprawdzanie zależności i nieużywanej zawartości|Wybór zasad aktualizacji
    custom-mod-groups:
      title: Własne grupy modów
      benefit: Twórz własne grupy i zapisuj reguły porządkujące złożoną instancję.
      capabilities: Stosowanie i zapisywanie reguł grupowania|Grupowanie modów z menu kontekstowego|Włączanie, wyłączanie lub sprawdzanie plików
    save-preview:
      title: Podgląd świata i narzędzia chunków
      benefit: Obejrzyj świat wizualnie przed uruchomieniem i wprowadzaj precyzyjne zmiany na poziomie chunków.
      capabilities: Przesuwanie i badanie map świata|Zaznaczanie, kopiowanie lub usuwanie chunków|Odczyt właściwości świata i materiałów
    blueprint-preview:
      title: Podgląd blueprintu
      benefit: Wyświetlaj podgląd struktur w 3D i weryfikuj zgodność oraz materiały przed umieszczeniem ich w grze.
      capabilities: Formaty Litematica i WorldEdit|Zgodność i stan brakujących modów|Lista materiałów i konwersja formatów
    modpack-export:
      title: Eksport modpacka
      benefit: Spakuj instancję dla innych graczy bez utraty metadanych i plików potrzebnych do jej działania.
      capabilities: Eksport do CurseForge i Modrinth|Metadane autora, opisu i adresu URL|Wybór dołączanych plików i zasobów
    server-export:
      title: Eksport serwera
      benefit: Wybierz odpowiedni świat oraz pliki serwera i wyeksportuj lokalny serwer z przejrzystą konfiguracją.
      capabilities: Eksport do folderu lub przesłanie|Wybór plików serwera|Konfiguracja MOTD i opcji serwera
    account-login:
      title: Wiele usług uwierzytelniania
      benefit: Wybierz usługę konta dopasowaną do Twojego stylu gry — od Microsoft po konta offline i usługi zewnętrzne.
      capabilities: Konta Microsoft i offline|Usługi Ely.by i LittleSkin|Dodawanie i zarządzanie usługami uwierzytelniania
    quick-action:
      title: Szybkie działania
      benefit: Wyszukuj instancje i polecenia bez opuszczania bieżącej strony.
      capabilities: Szukaj poleceń, instancji i modów|Uruchamiaj lub twórz instancje|Nawigacja z klawiatury za pomocą Ctrl+K
    crash-diagnosis:
      title: Raporty awarii i błędów uruchamiania
      benefit: Czytaj rzeczywiste logi, raporty awarii i komunikaty serwera wyjaśniające nieudane uruchomienie.
      capabilities: Logi, raporty awarii i błędy uruchamiania|Błędy zależności modów i kody wyjścia|Kopiowanie promptu dla zewnętrznych narzędzi AI
    ai-agent:
      title: Wbudowany agent AI
      benefit: Pozwól agentowi zbadać wirtualny system plików instancji i zaproponować konkretne rozwiązanie.
      capabilities: Odczyt plików instancji i raportów|Analiza problemu przed wyciągnięciem wniosków|Zastosowanie gotowej poprawki, gdy to możliwe
