      export:
        number: 1-KLIKNIĘCIE
        label: Eksport paczki
        description: Utwórz gotowy pakiet MR lub CF w kilku krokach.
      ai:
        number: AI
        label: Pomoc przy awariach
        description: Zamieniaj raport błędu w konkretne kolejne działanie.
    features:
      discover:
        label: 01 / ODKRYWAJ
        title: Przeszukuj oba ekosystemy bez rozpraszania uwagi.
        description: Znajduj projekty na platformach Modrinth i CurseForge dzięki filtrom wersji, loadera, środowiska i kategorii. XMCL łączy projekty z obu źródeł, ułatwiając porównywanie tych samych prac bez zgadywania.
        point1: Wyszukiwanie na Modrinth i CurseForge w jednym miejscu
        point2: Filtry zgodności wersji Minecrafta i loaderów
        point3: Porównywanie projektów między platformami
        alt: Wyszukiwanie modów online w XMCL z filtrami źródeł i kompatybilności
