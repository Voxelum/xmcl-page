    cta:
      kicker: WARSZTAT DLA TWOJEGO NASTĘPNEGO WYDANIA
      title: Zbuduj. Wydaj. Utrzymuj paczkę w dobrej kondycji.
      description: XMCL daje twórcom szybki lokalny cykl odkrywania, testowania, diagnozowania i eksportu.
      button: Odkryj wszystkie funkcje
