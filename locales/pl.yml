        label: 02 / BUDUJ
        title: Uwzględnij zależności już na etapie planowania.
        description: Gdy mod wymaga innego moda, XMCL może zainstalować tę zależność razem z nim. Kiedy włączasz lub wyłączasz projekt, launcher dba o spójność całego zestawu, zamiast zmuszać Cię do ręcznego analizowania powiązań.
        point1: Automatyczna instalacja zależności
        point2: Włączanie i wyłączanie z uwzględnieniem zależności
        point3: Przegląd wersji, loaderów i metadanych projektu
        alt: Widok szczegółów moda w XMCL z wersjami i zależnościami
      curate:
        label: 03 / SELEKCJONUJ
        title: Utrzymuj działający zestaw w zwięzłej i przemyślanej formie.
        description: Szukaj, sortuj, grupuj, aktualizuj i usuwaj mody, które nie są już potrzebne. Własne grupy ułatwiają testowanie opcjonalnej zawartości, porównywanie profili czy dopracowywanie wersji kandydującej.
        point1: Automatyczne sprawdzanie aktualizacji modów
        point2: Własne grupy dla zawartości opcjonalnej i testowej
        point3: Wyszukiwanie i usuwanie nieużywanych modów
        alt: Widok zarządzania zainstalowanymi modami w XMCL z kontrolą wyszukiwania i aktualizacji
      export:
        label: 04 / EKSPORTUJ
        title: Wydaj jedną paczkę w formacie, którego potrzebują Twoi gracze.
        description: Eksportuj dopracowany modpack Modrinth lub CurseForge z odpowiednimi metadanymi i wybranymi plikami. Etap wydania staje się powtarzalną częścią pracy, a nie pośpiesznym pakowaniem archiwum na ostatnią chwilę.
        point1: Eksport do Modrinth i CurseForge jednym kliknięciem
        point2: Metadane autora, opisu, adresu URL i wersji
        point3: Dokładny wybór dołączanych plików i zasobów
        alt: Ekran eksportu modpacka w XMCL dla formatów Modrinth i CurseForge
      diagnose:
        label: 05 / DIAGNOZUJ
        title: Pozwól AI przekształcić raporty awarii w gotowe rozwiązania.
        description: Gdy uruchomienie testowe się nie powiedzie, XMCL gromadzi logi, raporty awarii i agenta AI w jednym miejscu. Agent może zbadać kontekst instancji i wyjaśnić kolejne kroki do wykonania.
        point1: Odczyt logów uruchamiania i raportów awarii w kontekście
        point2: Badanie plików instancji wspomagane przez AI
        point3: Rozwiązywanie konfliktów modów przed publikacją
        alt: Agent AI w XMCL badający błąd uruchomienia Minecrafta
