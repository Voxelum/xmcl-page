      short: 分享與連線
      title: 分享與多人遊戲
      description: 將完整的遊戲環境從本機分享給朋友、伺服器或另一台裝置。
    accounts:
      short: 帳號與效率
      title: 帳號與效率工具
      description: 在遊戲世界附近管理身分、個人化設定和常用操作。
    diagnostics:
      short: 診斷
      title: 診斷與輔助
      description: 啟動失敗時，在同一個地方查看證據並找到下一步操作。
  items:
    instance-library:
      title: 統一的實例庫
      benefit: 在一個隨時可啟動的統一首頁中，集中查看原版、模組與實驗性世界。
      capabilities: 隔離不同遊戲版本與載入器|模組、存檔與資源一目了然|啟動所需的遊戲設定
    instance-create-modloaders:
      title: 建立 Java 與 Bedrock 實例
      benefit: 選擇適合目標世界的載入器與版本，快速建立新的遊戲設定。
      capabilities: 支援 Java Edition 與實驗性 Bedrock|Forge、Fabric、Quilt、NeoForge、OptiFine 與 LabyMod|Minecraft 與本機版本來源
    instance-folder-groups:
      title: 實例資料夾分組
      benefit: 將大量實例按資料夾整理，讓不同世界與設定更容易瀏覽查找。
      capabilities: 按專案或用途將實例分組|將相關設定放在一起|從實例側邊欄切換資料夾
    instance-settings:
      title: 實例設定
      benefit: 獨立微調 Java、記憶體、版本、載入器與啟動行為，完全不影響其他設定。
      capabilities: 獨立的實例設定|版本與載入器選擇|個別實例的外觀控制
    instance-theme:
      title: 實例主題
      benefit: 使用背景、顏色、模糊、字型與自訂 CSS，為每個世界賦予專屬風格。
      capabilities: 背景圖片與重疊圖層|圓角與字型控制|匯出與匯入主題
    local-server:
      title: 啟動本機伺服器
      benefit: 將實例轉換為可自訂設定的本機伺服器，並配置世界、玩家人數上限與可匯出的檔案。
      capabilities: MOTD、連接埠與玩家人數上限|世界與伺服器檔案選取|匯出伺服器套件
    server-list:
      title: 伺服器列表
      benefit: 將多人遊戲伺服器緊鄰對應實例放置，並即時查看連線狀態。
      capabilities: 伺服器狀態與玩家人數|釘選與移除連線目的地|清楚顯示連線失敗原因
    modpack-market:
      title: 整合包市場
      benefit: 在單一可搜尋的市集中，瀏覽 Modrinth、CurseForge 與 FTB 內容。
      capabilities: 來源、版本、載入器與分類篩選|發掘熱門與最新整合包|開啟整合包詳細頁面
    online-mod-search:
      title: 線上模組搜尋
      benefit: 在模組加入實例前，先在各大主流社群平台中找到相容的模組。
      capabilities: Modrinth 與 CurseForge 來源|Minecraft 版本與載入器篩選|環境與分類篩選
    modpack-detail:
      title: 整合包詳情
      benefit: 在安裝前全面了解整合包，涵蓋螢幕截圖、作者、統計數據到技術需求。
      capabilities: 螢幕截圖、標籤與專案統計|安裝與啟動操作|技術資訊與外部資源
    mod-collections:
      title: 模組收藏
      benefit: 收藏想再次查看的專案，並將收藏清單轉換為可重複使用的設定。
      capabilities: 啟動器收藏|已追蹤的 Modrinth 專案|批次安裝與收藏管理
    mod-detail:
      title: 模組詳情
      benefit: 在修改實例前先檢視模組，掌握其版本、依賴項目與來源資訊。
      capabilities: 版本選擇與相依性|載入器、分類與來源連結|描述與外部資源
    local-mods:
      title: 已安裝模組管理
      benefit: 快速查看已啟用的內容、進行篩選，並保持目前運行的模組配置健全。
      capabilities: 搜尋、排序與篩選模組|檢查依賴項目與未使用的內容|選擇更新策略
    custom-mod-groups:
      title: 自訂模組分組
      benefit: 建立專屬分組並儲存分類規則，讓複雜的實例井井有條。
      capabilities: 套用與儲存分組規則|從右鍵選單將模組分組|啟用、停用或檢查檔案
    save-preview:
      title: 存檔預覽與區塊工具
      benefit: 啟動世界前先以視覺化方式檢視地圖，並進行精確的區塊級調整。
      capabilities: 平移與檢視世界地圖|選取、複製或刪除區塊|查看世界屬性與材料
    blueprint-preview:
      title: 藍圖預覽
      benefit: 在放入遊戲前以 3D 預覽建築結構，並確認相容性與所需材料。
      capabilities: Litematica 與 WorldEdit 格式|相容性與缺失模組狀態|材料清單與格式轉換
    modpack-export:
      title: 整合包匯出
      benefit: 將實例打包分享給其他玩家，完整保留使其正常運作的中繼資料與檔案。
      capabilities: CurseForge 與 Modrinth 匯出|作者、描述與 URL 中繼資料|選擇要包含的檔案與資產
    server-export:
      title: 伺服器匯出
      benefit: 選擇正確的世界與伺服器檔案，匯出設定清晰的本機伺服器。
      capabilities: 匯出至資料夾或上傳|選取伺服器檔案|設定 MOTD 與伺服器選項
    account-login:
      title: 多種驗證服務
      benefit: 選擇適合你遊玩習慣的帳號服務，從 Microsoft、離線帳號到第三方驗證服務皆可支援。
      capabilities: Microsoft 與離線帳號|Ely.by 與 LittleSkin 服務|新增與管理驗證服務
    quick-action:
      title: 快速操作
      benefit: 無需離開目前頁面，即可搜尋實例與執行指令。
      capabilities: 搜尋指令、實例與模組|啟動或建立實例|使用 Ctrl+K 快速鍵導航
    crash-diagnosis:
      title: 當機與啟動失敗報告
      benefit: 查看啟動失敗背後的實際記錄、當機報告與伺服器輸出。
      capabilities: 記錄、當機報告與啟動失敗|模組解析錯誤與結束代碼|複製 Prompt 給外部 AI 工具
    ai-agent:
      title: 內建 AI Agent
      benefit: 讓 Agent 檢查實例的虛擬檔案系統，並解釋具體可行的修復方案。
      capabilities: 讀取實例檔案與報告|深入分析後再得出結論|在可行時套用修復方案
