      discover:
        label: 01 / 發現專案
        title: 不切換平台，同時搜尋兩個生態。
        description: 按版本、載入器、環境與分類篩選 Modrinth 與 CurseForge 專案，並透過雙向映射比較同一個專案。
        point1: 單一流程同時搜尋 Modrinth 與 CurseForge
        point2: Minecraft 版本與載入器相容性篩選
        point3: 跨平台專案雙向映射
        alt: 具備來源與相容性篩選的 XMCL 線上模組搜尋
      build:
        label: 02 / 建置設定
        title: 讓依賴成為建置計畫的一部分。
        description: 安裝模組時自動處理依賴，啟用或停用專案時也會考量關聯性，避免手動追蹤相依關聯圖。
        point1: 自動安裝依賴
        point2: 啟用與停用時感知依賴關係
        point3: 查看版本、載入器與專案中繼資料
        alt: 展示版本與依賴關係的 XMCL 模組詳情
      curate:
        label: 03 / 整理內容
        title: 保持工作集精簡且具針對性。
        description: 搜尋、排序、分組、更新並移除不再需要的模組。自訂分組能輕鬆測試選用內容、比對設定檔，或讓發布候選版本保持精確。
        point1: 自動檢查模組更新
        point2: 為選用與測試內容建立自訂分組
        point3: 找出並移除未使用的模組
        alt: 具備搜尋與更新控制項的 XMCL 已安裝模組管理
      export:
        label: 04 / 匯出發布
        title: 按玩家需要的格式發布整合包。
        description: 匯出帶有完整中繼資料與精選檔案的 Modrinth 或 CurseForge 整合包，讓發布成為可重複的工作流程步驟。
        point1: 一鍵匯出 Modrinth 與 CurseForge 整合包
        point2: 作者、描述、網址與版本中繼資料
        point3: 精確挑選要發布的檔案與資產
        alt: XMCL Modrinth 與 CurseForge 整合包匯出頁面
      diagnose:
        label: 05 / 分析問題
        title: 讓 AI 幫你把當機報告變成修復方案。
        description: 測試啟動失敗時，在同一個地方查看記錄、當機報告並使用 AI Agent 分析實例環境。Agent 能直接檢查實例環境內容，並說明具體可行的下一步修復操作。
        point1: 在上下文脈絡中查看啟動記錄與當機報告
        point2: AI 輔助檢查實例檔案
        point3: 在發布前排查並解決模組衝突
        alt: XMCL AI Agent 分析 Minecraft 啟動失敗
