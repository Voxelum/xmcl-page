features:
  label: Λειτουργίες
  ui:
    kicker: XMCL / ΚΑΤΑΛΟΓΟΣ ΛΕΙΤΟΥΡΓΙΩΝ
    heading: Ο launcher, χαρτογραφημένος.
    description: Εξερευνήστε τις ροές εργασίας που κάνουν τη δημιουργία, κατανόηση και κοινή χρήση ενός modded Minecraft πιο απλή.
    all: Όλες οι λειτουργίες
    search: Αναζήτηση λειτουργιών...
    features: λειτουργίες
    featuresInView: λειτουργίες σε προβολή
    readWorkflow: Δείτε τη ροή εργασίας
  status:
    homepage: Αρχική
    catalog: Κατάλογος
    guide: Οδηγός
    detail: Λεπτομέρειες
  groups:
    instances:
      short: Instances
      title: Instances και προφίλ
      description: Διατηρήστε κάθε εγκατάσταση Minecraft ανεξάρτητη, ορατή και έτοιμη για εκκίνηση, χωρίς να χάνετε τις λεπτομέρειες που την κάνουν δική σας.
    community:
      short: Κοινότητα
      title: Mods και περιεχόμενο κοινότητας
      description: Ανακαλύψτε, ελέγξτε και εγκαταστήστε τα έργα που μετατρέπουν μια έκδοση του Minecraft στον επόμενο κόσμο σας.
    mods:
      short: Έλεγχος mods
      title: Διαχείριση mods
      description: Διατηρήστε μια μεγάλη εγκατάσταση mods κατανοητή με αναζήτηση, ομαδοποίηση, έλεγχο εξαρτήσεων και στοχευμένες ενημερώσεις.
    world-tools:
      short: Εργαλεία κόσμου
      title: Εργαλεία κόσμου
      description: 'Δουλέψτε με τους κόσμους πίσω από τα instances σας: επιθεωρήστε τη μορφή τους, επιλέξτε τμήματα και κατανοήστε τα υλικά τους.'
    sharing:
      short: Κοινή χρήση
      title: Κοινή χρήση και multiplayer
      description: Μεταφέρετε μια λειτουργική εγκατάσταση από τον υπολογιστή σας σε έναν φίλο, έναν server ή άλλη εγκατάσταση με όλες τις λεπτομέρειες ανέπαφες.
    accounts:
      short: Λογαριασμοί
      title: Λογαριασμοί και παραγωγικότητα
      description: Κρατήστε την ταυτότητα, την εξατομίκευση και τις συχνές ενέργειες κοντά στους κόσμους που παίζετε.
    diagnostics:
      short: Διαγνωστικά
      title: Διαγνωστικά και υποβοήθηση
      description: Όταν μια εκκίνηση αποτυγχάνει, ο XMCL συγκεντρώνει τα στοιχεία και την επόμενη ενέργεια στο ίδιο σημείο.
  items:
    instance-library:
      title: Μία οργανωμένη βιβλιοθήκη instances
      benefit: Δείτε vanilla, modded και πειραματικούς κόσμους μαζί σε ένα έτοιμο για εκκίνηση περιβάλλον.
      capabilities: Ξεχωριστές εκδόσεις παιχνιδιού και loaders|Προβολή Mods, Saves και πόρων με μια ματιά|Εκκίνηση της εγκατάστασης που χρειάζεστε
    instance-create-modloaders:
      title: Δημιουργία Java και Bedrock Instances
      benefit: Ξεκινήστε μια νέα εγκατάσταση με τον loader και την έκδοση που ταιριάζουν στον κόσμο που θέλετε να παίξετε.
      capabilities: Java Edition και πειραματική υποστήριξη Bedrock|Forge, Fabric, Quilt, NeoForge, OptiFine και LabyMod|Επίσημες και τοπικές πηγές εκδόσεων Minecraft
    instance-folder-groups:
      title: Ομάδες Φακέλων Instances
      benefit: Οργανώστε πολλά instances σε φακέλους ώστε διαφορετικοί κόσμοι και εγκαταστάσεις να παραμένουν ευανάγνωστα.
      capabilities: Ομαδοποίηση instances ανά σκοπό ή έργο|Συγκέντρωση σχετικών εγκαταστάσεων|Εναλλαγή μεταξύ φακέλων από τη γραμμή instances
    instance-settings:
      title: Ρυθμίσεις instance
      benefit: Ρυθμίστε Java, μνήμη, εκδόσεις, loaders και συμπεριφορά εκκίνησης χωρίς να επηρεάσετε άλλες εγκαταστάσεις.
      capabilities: Ανεξάρτητη ρύθμιση instance|Επιλογή έκδοσης και loader|Έλεγχος εμφάνισης ανά instance
    instance-theme:
      title: Θέμα Instance
      benefit: Δώστε σε κάθε κόσμο τη δική του ταυτότητα με φόντα, χρώματα, θόλωση, γραμματοσειρές και προσαρμοσμένο CSS.
      capabilities: Εικόνα φόντου και επικάλυψη|Στρογγυλεμένες γωνίες και επιλογές γραμματοσειράς|Εξαγωγή και εισαγωγή θέματος
    local-server:
      title: Εκκίνηση τοπικού server
      benefit: Μετατρέψτε ένα instance σε παραμετροποιήσιμο τοπικό server με κόσμο, όριο παικτών και εξαγώγιμα αρχεία.
      capabilities: MOTD, θύρα και όριο παικτών|Επιλογή κόσμου και αρχείων server|Εξαγωγή πακέτου server
    server-list:
      title: Λίστα Servers
      benefit: Κρατήστε τους multiplayer προορισμούς κοντά στο instance που τους χρησιμοποιεί και δείτε την κατάσταση σύνδεσής τους.
      capabilities: Κατάσταση server και αριθμός παικτών|Καρφίτσωμα και αφαίρεση προορισμών|Σαφής εμφάνιση σφαλμάτων σύνδεσης
    modpack-market:
      title: Αγορά Modpacks
      benefit: Περιηγηθείτε σε περιεχόμενο από Modrinth, CurseForge και FTB μέσα από μία ενιαία αναζητήσιμη αγορά.
      capabilities: Φίλτρα πηγής, έκδοσης, loader και κατηγορίας|Ανακάλυψη δημοφιλών και πρόσφατων packs|Άνοιγμα σελίδας λεπτομερειών pack
    online-mod-search:
      title: Διαδικτυακή Αναζήτηση Mods
      benefit: Βρείτε συμβατά Mods στις μεγάλες πλατφόρμες της κοινότητας πριν φτάσουν στο instance σας.
      capabilities: Πηγές Modrinth και CurseForge|Φίλτρα έκδοσης Minecraft και loader|Φίλτρα περιβάλλοντος και κατηγορίας
    modpack-detail:
      title: Λεπτομέρειες Modpack
      benefit: Γνωρίστε ένα pack πριν το εγκαταστήσετε, από στιγμιότυπα οθόνης και δημιουργούς έως τεχνικές απαιτήσεις.
      capabilities: Στιγμιότυπα, ετικέτες και στατιστικά έργου|Ενέργειες εγκατάστασης και εκκίνησης|Τεχνικές πληροφορίες και εξωτερικοί πόροι
    mod-collections:
      title: Συλλογές Mods
      benefit: Αποθηκεύστε έργα που θέλετε να ξαναδείτε και μετατρέψτε μια συλλογή σε επαναχρησιμοποιήσιμη εγκατάσταση.
      capabilities: Συλλογές του launcher|Ακολουθούμενα έργα Modrinth|Μαζική εγκατάσταση και διαχείριση συλλογών
    mod-detail:
      title: Λεπτομέρειες Mod
      benefit: Επιθεωρήστε ένα Mod πριν αλλάξετε το instance σας και δείτε εκδόσεις, εξαρτήσεις και πηγές.
      capabilities: Επιλογή έκδοσης και εξαρτήσεις|Loaders, κατηγορίες και σύνδεσμοι πηγών|Περιγραφή και εξωτερικοί πόροι
    local-mods:
      title: Διαχείριση Εγκατεστημένων Mods
      benefit: Δείτε τι είναι ενεργοποιημένο, φιλτράρετέ το γρήγορα και διατηρήστε το σύνολο υγιές.
      capabilities: Αναζήτηση, ταξινόμηση και φιλτράρισμα Mods|Έλεγχος εξαρτήσεων και αχρησιμοποίητου περιεχομένου|Επιλογή πολιτικής ενημερώσεων
    custom-mod-groups:
      title: Προσαρμοσμένες Ομάδες Mods
      benefit: Δημιουργήστε τις δικές σας ομάδες και αποθηκεύστε κανόνες που οργανώνουν ένα σύνθετο instance.
      capabilities: Εφαρμογή και αποθήκευση κανόνων ομαδοποίησης|Ομαδοποίηση Mods από το μενού περιβάλλοντος|Ενεργοποίηση, απενεργοποίηση ή επιθεώρηση αρχείων
    save-preview:
      title: Προεπισκόπηση Save και Εργαλεία Chunk
      benefit: Δείτε έναν κόσμο οπτικά πριν τον ξεκινήσετε και κάντε ακριβείς αλλαγές σε επίπεδο Chunk.
      capabilities: Μετακίνηση και επιθεώρηση χαρτών κόσμου|Επιλογή, αντιγραφή ή διαγραφή Chunks|Ανάγνωση ιδιοτήτων και υλικών κόσμου
    blueprint-preview:
      title: Προεπισκόπηση Blueprint
      benefit: Δείτε μια κατασκευή σε 3D και ελέγξτε συμβατότητα και υλικά πριν την τοποθετήσετε στο παιχνίδι.
      capabilities: Μορφές Litematica και WorldEdit|Κατάσταση συμβατότητας και ελλειπόντων Mods|Λίστα υλικών και μετατροπή μορφής
    modpack-export:
      title: Εξαγωγή Modpack
      benefit: Πακετάρετε ένα instance για άλλους παίκτες χωρίς να χάσετε τα μεταδεδομένα και τα αρχεία που το κάνουν να λειτουργεί.
      capabilities: Εξαγωγή για CurseForge και Modrinth|Μεταδεδομένα δημιουργού, περιγραφής και URL|Επιλογή αρχείων και πόρων προς συμπερίληψη
    server-export:
      title: Εξαγωγή Server
      benefit: Επιλέξτε τον σωστό κόσμο και τα αρχεία server και εξαγάγετε έναν τοπικό server με καθαρή παραμετροποίηση.
      capabilities: Εξαγωγή σε φάκελο ή μεταφόρτωση|Επιλογή αρχείων server|Ρύθμιση MOTD και επιλογών server
    account-login:
      title: Πολλαπλές Υπηρεσίες Ταυτοποίησης
      benefit: Επιλέξτε την υπηρεσία λογαριασμού που ταιριάζει στον τρόπο που παίζετε, από Microsoft έως offline και υπηρεσίες τρίτων.
      capabilities: Λογαριασμοί Microsoft και offline|Υπηρεσίες Ely.by και LittleSkin|Προσθήκη και διαχείριση υπηρεσιών ταυτοποίησης
    quick-action:
      title: Γρήγορες Ενέργειες
      benefit: Βρείτε instances και εντολές χωρίς να φύγετε από τη σελίδα στην οποία εργάζεστε.
      capabilities: Αναζήτηση εντολών, instances και Mods|Εκκίνηση ή δημιουργία instance|Πλοήγηση με πληκτρολόγιο μέσω Ctrl+K
    crash-diagnosis:
      title: Αναφορές Crash και Αποτυχίας Εκκίνησης
      benefit: Διαβάστε τα πραγματικά logs, crash reports και την έξοδο του server πίσω από μια αποτυχημένη εκκίνηση.
      capabilities: Logs, crash reports και αποτυχίες εκκίνησης|Σφάλματα επίλυσης mods και κωδικοί εξόδου|Αντιγραφή prompt για εξωτερικά εργαλεία AI
    ai-agent:
      title: Ενσωματωμένος AI Agent
      benefit: Αφήστε έναν agent να επιθεωρήσει το εικονικό σύστημα αρχείων του instance και να προτείνει μια πρακτική λύση.
      capabilities: Ανάγνωση αρχείων instance και αναφορών|Διερεύνηση πριν την εξαγωγή συμπερασμάτων|Εφαρμογή πρακτικής διόρθωσης όπου είναι δυνατό
