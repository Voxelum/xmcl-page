gameInstall:
  title:
    body: Τέλος οι έγνοιες για την {gameInstall}
    gameInstall: Εγκατάσταση Παιχνιδιού
  description: >-
    Ο XMCL υποστηρίζει εγκατάσταση vanilla Minecraft, Minecraft Forge, Fabric
    και ακόμη και OptiFine, όλα σε ένα! Μπορείτε να τα εγκαταστήσετε από ένα
    ενιαίο σημείο μέσα στον Launcher. Υποστηρίζει επίσης τον mirror BMCL API,
    ενώ μπορείτε να ορίσετε και τον δικό σας προσαρμοσμένο mirror.
optimalDisk:
  title:
    body: '{optimal} χώρος στον δίσκο με {massiveResources}'
    optimal: Βέλτιστος
    massiveResources: Τεράστιους Πόρους
  description: >-
    Ο XMCL αποθηκεύει όλα τα mods, resource packs, shader packs και modpacks σε
    μία κεντρική τοποθεσία. Όταν χρησιμοποιείτε έναν ήδη αποθηκευμένο πόρο,
    χρησιμοποιεί hard link για την εγκατάσταση στο instance χωρίς αντιγραφή.
    Έτσι δεν θα βλέπετε ποτέ ξανά διπλότυπα αρχεία στον φάκελο /mods.
cleanWorkspace:
  title:
    body: Κρατήστε τον χώρο εργασίας σας {clean} με πολλαπλά instances
    clean: Καθαρό
  description: >-
    Ο XMCL διαθέτει ενσωματωμένη υποστήριξη πολλαπλών instances. Μπορείτε να
    δημιουργήσετε εύκολα πολλά instances, ώστε να μην ανησυχείτε για σύγχυση
    μεταξύ διαφορετικών ρυθμίσεων εκκίνησης.
communityIntegration:
  title:
    body: Ενσωμάτωση με {multipleCommunities}
    multipleCommunities: Πολλαπλές Κοινότητες
  description: >-
    Ο XMCL διαθέτει ενσωματωμένη υποστήριξη για CurseForge και Modrinth.
    Προσφέρει επίσης υποστήριξη για προσαρμοσμένους λογαριασμούς και συστήματα
    skins, όπως το Blessing Skin.
