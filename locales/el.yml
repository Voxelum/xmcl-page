redirectHelperTitle: >-
  Εάν δεν ανακατευθυνθείτε αυτόματα, μπορείτε να πατήσετε το κουμπί Άνοιγμα στον
  Launcher για χειροκίνητη ανακατεύθυνση.
redirectHelperMessage: >-
  Θα εμφανιστεί ένα αναδυόμενο παράθυρο που θα σας ζητήσει να ανοίξετε τον
  launcher. Εάν εξακολουθεί να μη λειτουργεί, δοκιμάστε να σύρετε το κουμπί στο
  παράθυρο του launcher!
