sceneLanding:
  linux:
    eyebrow: XMCL / ΕΚΔΟΣΗ LINUX
    title: Ο Minecraft launcher που δείχνει φυσικός στο Linux.
    lede: Ένας καλοσχεδιασμένος launcher ανοιχτού κώδικα για Linux desktops και Steam Deck. Επιλέξτε το πακέτο που περιμένει η διανομή σας, συνδέστε οθόνη 4K και κρατήστε κάθε κόσμο ένα κλικ μακριά.
    primaryAction: Λήψη για Linux
    secondaryAction: Δείτε τη ροή εργασίας στο Linux
    heroNote: Εγγενή πακέτα Linux, επιλογές ARM64 και υποστήριξη Flathub
    visualLabel: XMCL · Περιβάλλον Linux
    heroAlt: Αρχική οθόνη XMCL που εμφανίζει μια βιβλιοθήκη Minecraft instances
    visualTag: Περιβάλλον έτοιμο για 4K
    visualStatus: ΕΤΟΙΜΟΣ ΓΙΑ ΤΟΝ ΕΠΟΜΕΝΟ ΚΟΣΜΟ ΣΑΣ
    workflowKicker: ΡΟΗ ΕΡΓΑΣΙΑΣ ΜΕ ΠΡΟΤΕΡΑΙΟΤΗΤΑ ΤΟ LINUX
    workflowTitle: Από τον διαχειριστή πακέτων στο παιχνίδι χωρίς εμπόδια.
    workflowDescription: 'Ο XMCL κρατά κοντά όσα έχουν σημασία για τους παίκτες Linux: προβλέψιμες εγκαταστάσεις, ευκρινή διεπαφή και ανεξάρτητα περιβάλλοντα παιχνιδιού με εύκολη εναλλαγή.'
    signals:
      packages:
        number: '05'
        label: Πακέτα Linux
        description: DEB, RPM, AppImage, tar.xz και Flathub.
      scale:
        number: '4K'
        label: Ευκρινής σε κάθε κλίμακα
        description: Μια πλούσια βιβλιοθήκη που παραμένει ευανάγνωστη σε μεγάλη οθόνη.
      worlds:
        number: '∞'
        label: Ξεχωριστοί κόσμοι
        description: Αποτρέψτε συγκρούσεις μεταξύ εκδόσεων, loaders και saves.
    features:
      install:
        label: 01 / ΕΠΙΛΕΞΤΕ ΕΓΚΑΤΑΣΤΑΣΗ
        title: Χρησιμοποιήστε τη μορφή που καταλαβαίνει η διανομή σας.
        description: Κατεβάστε ένα εγγενές πακέτο για τον υπολογιστή σας ή χρησιμοποιήστε Flathub για μια φορητή λύση φιλική προς το Steam Deck. Ο XMCL προσφέρει επίσης εκδόσεις ARM64 όπου το απαιτεί το υλικό.
        point1: DEB και RPM για δημοφιλείς διανομές Linux
        point2: AppImage και tar.xz για φορητές εγκαταστάσεις
        point3: Υποστήριξη Flathub για Steam Deck
        alt: Παράθυρο δημιουργίας instance XMCL με εκδόσεις Minecraft και mod loaders
      organize:
        label: 02 / ΔΙΑΤΗΡΗΣΤΕ ΤΑΞΗ
        title: Κάθε instance έχει τον δικό του καθαρό χώρο.
        description: Διαχωρίστε vanilla, modded, δοκιμαστικές και server εγκαταστάσεις χωρίς χειροκίνητη διαχείριση φακέλων. Οι εκδόσεις, οι loaders, τα mods, τα saves και οι ρυθμίσεις μένουν μαζί.
        point1: Ανεξάρτητα δεδομένα παιχνιδιού και ρυθμίσεις εκκίνησης
        point2: Forge, Fabric, Quilt, NeoForge και άλλα
        point3: Γρήγορη εναλλαγή μεταξύ κόσμων και πειραμάτων
        alt: Βιβλιοθήκη instances XMCL με οργανωμένα προφίλ Minecraft
      anywhere:
        label: 03 / ΠΑΙΞΤΕ ΠΑΝΤΟΥ
        title: Ένας desktop launcher που ταξιδεύει εύκολα.
        description: Μεταβείτε από έναν υπολογιστή Linux σε συνεδρία Steam Deck χωρίς να χάσετε μια καθαρή βιβλιοθήκη ή μια αξιόπιστη εγκατάσταση. Ο XMCL δίνει χώρο στη συλλογή σας να μεγαλώσει χωρίς να γίνει χαοτική.
        point1: Διαδρομή Flathub σχεδιασμένη για Steam Deck
        point2: Καθαρή διεπαφή σε οθόνες 4K
        point3: Ανοιχτός κώδικας, φτιαγμένος για παίκτες Linux
        alt: Αρχική σελίδα XMCL με μεγάλη βιβλιοθήκη instances
    download:
      kicker: ΛΗΨΗ ΓΙΑ LINUX
      title: Εγκαταστήστε τον XMCL με τον δικό σας τρόπο.
      description: Επιλέξτε το πακέτο που ταιριάζει στο σύστημά σας ή χρησιμοποιήστε το Flathub για να φέρετε τον XMCL στο Steam Deck.
      link: Δείτε όλες τις εκδόσεις και τα prebuilds
  creators:
    eyebrow: XMCL / ΓΙΑ ΔΗΜΙΟΥΡΓΟΥΣ MODPACKS
    title: Χτίστε modpacks με ολόκληρο τον κύκλο κυκλοφορίας σε ένα μέρος.
    lede: Ανακαλύψτε έργα, επιλύστε εξαρτήσεις, δοκιμάστε ένα λειτουργικό σύνολο, διαγνώστε crashes και εξαγάγετε ένα καθαρό pack για Modrinth ή CurseForge χωρίς να φύγετε από τον launcher.
    primaryAction: Εξερευνήστε τις ροές δημιουργών
    secondaryAction: Άνοιγμα καταλόγου λειτουργιών
    heroNote: Ροές Modrinth και CurseForge, με διάγνωση υποβοηθούμενη από AI
    visualLabel: XMCL · Χώρος εργασίας δημιουργού
    heroAlt: Αγορά modpacks XMCL με έργα Modrinth και CurseForge
    visualTag: MODRINTH ↔ CURSEFORGE
    visualStatus: ΕΝΕΡΓΟ ΣΥΝΟΛΟ ΣΕ ΣΥΓΧΡΟΝΙΣΜΟ
    workflowKicker: Ο ΚΥΚΛΟΣ ΤΟΥ ΔΗΜΙΟΥΡΓΟΥ
    workflowTitle: Πιο γρήγορος δρόμος από μια αρχική ιδέα σε ένα pack που οι παίκτες μπορούν πραγματικά να τρέξουν.
    workflowDescription: 'Ο XMCL αντιμετωπίζει ένα modpack ως ζωντανό σύστημα. Εξερευνήστε και τους δύο καταλόγους, κάντε στοχευμένες αλλαγές και αφήστε τον launcher να αναδείξει τις σχέσεις που κρατούν την έκδοσή σας υγιή.'
    signals:
      sources:
        number: '2×'
        label: Πηγές έργων
        description: Αναζήτηση σε Modrinth και CurseForge από έναν χώρο εργασίας.
      export:
        number: '1-ΚΛΙΚ'
        label: Εξαγωγή pack
        description: Δημιουργήστε διανεμήσιμο πακέτο MR ή CF σε λίγα βήματα.
      ai:
        number: 'AI'
        label: Βοήθεια για crashes
        description: Μετατρέψτε μια αναφορά σφάλματος σε χρήσιμη επόμενη ενέργεια.
    features:
      discover:
        label: 01 / ΑΝΑΚΑΛΥΨΗ
        title: Αναζητήστε και στα δύο οικοσυστήματα χωρίς να διασπάτε την προσοχή σας.
        description: Βρείτε έργα σε Modrinth και CurseForge με φίλτρα έκδοσης, loader, περιβάλλοντος και κατηγορίας. Ο XMCL αντιστοιχίζει έργα μεταξύ των δύο πηγών ώστε να συγκρίνετε την ίδια δουλειά με λιγότερες εικασίες.
        point1: Αναζήτηση σε Modrinth και CurseForge σε μία ροή
        point2: Φίλτρα συμβατότητας έκδοσης Minecraft και loader
        point3: Διαπλατφορμική αντιστοίχιση έργων
        alt: Διαδικτυακή αναζήτηση mods XMCL με φίλτρα πηγής και συμβατότητας
      build:
        label: 02 / ΔΗΜΙΟΥΡΓΙΑ
        title: Κάντε τις εξαρτήσεις μέρος του σχεδίου.
        description: Όταν ένα mod χρειάζεται ένα άλλο mod, ο XMCL μπορεί να εγκαταστήσει μαζί και την εξάρτηση. Όταν ενεργοποιείτε ή απενεργοποιείτε ένα έργο, ο launcher βοηθά να διατηρείται το σύνολο συνεκτικό αντί να ιχνηλατείτε χειροκίνητα το γράφημα.
        point1: Αυτόματη εγκατάσταση εξαρτήσεων
        point2: Ενεργοποίηση και απενεργοποίηση με επίγνωση εξαρτήσεων
        point3: Επιθεώρηση εκδόσεων, loaders και μεταδεδομένων έργου
        alt: Προβολή λεπτομερειών mod στον XMCL με εκδόσεις και εξαρτήσεις
      curate:
        label: 03 / ΕΠΙΜΕΛΕΙΑ
        title: Διατηρήστε το ενεργό σύνολο λιτό και στοχευμένο.
        description: Αναζητήστε, ταξινομήστε, ομαδοποιήστε, ενημερώστε και αφαιρέστε τα mods που δεν ανήκουν πλέον. Οι προσαρμοσμένες ομάδες διευκολύνουν τη δοκιμή προαιρετικού περιεχομένου, τη σύγκριση προφίλ ή την εστίαση μιας υποψήφιας έκδοσης.
        point1: Αυτόματοι έλεγχοι ενημερώσεων mods
        point2: Προσαρμοσμένες ομάδες για προαιρετικό και δοκιμαστικό περιεχόμενο
        point3: Εντοπισμός και αφαίρεση αχρησιμοποίητων mods
        alt: Προβολή διαχείρισης εγκατεστημένων mods στον XMCL με αναζήτηση και ενημερώσεις
      export:
        label: 04 / ΕΞΑΓΩΓΗ
        title: Διανείμετε ένα pack στη μορφή που χρειάζονται οι παίκτες σας.
        description: Εξαγάγετε ένα ολοκληρωμένο Modrinth ή CurseForge modpack με τα σωστά μεταδεδομένα και τα επιλεγμένα αρχεία. Το βήμα κυκλοφορίας γίνεται επαναλήψιμο μέρος της ροής εργασίας, όχι αγχωτική αρχειοθέτηση της τελευταίας στιγμής.
        point1: Εξαγωγή σε Modrinth και CurseForge με ένα κλικ
        point2: Μεταδεδομένα δημιουργού, περιγραφής, URL και έκδοσης
        point3: Ακριβής επιλογή των αρχείων και πόρων που διανέμονται
        alt: Οθόνη εξαγωγής modpack XMCL για μορφές Modrinth και CurseForge
      diagnose:
        label: 05 / ΔΙΑΓΝΩΣΗ
        title: Αφήστε την AI να μετατρέψει τα crash reports σε λύσεις.
        description: Όταν μια δοκιμαστική εκκίνηση αποτυγχάνει, ο XMCL συγκεντρώνει logs, crash reports και έναν AI agent στο ίδιο σημείο. Ο agent μπορεί να επιθεωρήσει το πλαίσιο του instance και να εξηγήσει το επόμενο πρακτικό βήμα.
        point1: Ανάγνωση logs εκκίνησης και crash reports στο πλαίσιό τους
        point2: Διερεύνηση αρχείων instance με υποβοήθηση AI
        point3: Επίλυση συγκρούσεων mods πριν την κυκλοφορία
        alt: AI agent του XMCL που διερευνά αποτυχία εκκίνησης Minecraft
    cta:
      kicker: ΕΝΑΣ ΠΑΓΚΟΣ ΕΡΓΑΣΙΑΣ ΓΙΑ ΤΗΝ ΕΠΟΜΕΝΗ ΕΚΔΟΣΗ ΣΑΣ
      title: Φτιάξτε το pack. Κυκλοφορήστε το. Κρατήστε το υγιές.
      description: Ο XMCL προσφέρει στους δημιουργούς έναν γρήγορο τοπικό κύκλο ανακάλυψης, δοκιμής, διάγνωσης και εξαγωγής στα δύο οικοσυστήματα που ήδη χρησιμοποιούν οι παίκτες σας.
      button: Εξερευνήστε κάθε λειτουργία
