    features:
      discover:
        label: 01 / ПОИСК
        title: Ищите в обеих экосистемах, не рассеивая внимание.
        description: Находите проекты на Modrinth и CurseForge с помощью фильтров по версии, загрузчику, окружению и категории. XMCL сопоставляет проекты между источниками, позволяя сравнивать один и тот же мод без лишних догадок.
        point1: Поиск по Modrinth и CurseForge в едином интерфейсе
        point2: Фильтры совместимости по версии Minecraft и загрузчику
        point3: Сопоставление проектов между платформами
        alt: Онлайн-поиск модов в XMCL с фильтрами источников и совместимости
      build:
        label: 02 / СБОРКА
        title: Учитывайте зависимости на этапе планирования.
        description: Если моду требуется другой мод, XMCL может установить зависимость вместе с ним. При включении или отключении проекта лаунчер помогает сохранить целостность набора, избавляя от ручного отслеживания связей.
        point1: Автоматическая установка зависимостей
        point2: Включение и отключение с учётом зависимостей
        point3: Просмотр версий, загрузчиков и метаданных проекта
        alt: Окно сведений о моде в XMCL с отображением версий и зависимостей
      curate:
        label: 03 / КУРИРОВАНИЕ
        title: Поддерживайте рабочий набор чистым и выверенным.
        description: Ищите, сортируйте, группируйте, обновляйте и удаляйте моды, которые больше не нужны. Пользовательские группы упрощают тестирование опционального контента, сравнение профилей и подготовку релиз-кандидата.
        point1: Автоматическая проверка обновлений модов
        point2: Пользовательские группы для опционального и тестового контента
        point3: Поиск и удаление неиспользуемых модов
        alt: Экран управления установленными модами в XMCL с поиском и элементами обновления
      export:
        label: 04 / ЭКСПОРТ
        title: Выпускайте сборку в удобном для ваших игроков формате.
        description: Экспортируйте готовый модпак для Modrinth или CurseForge с корректными метаданными и выбранными файлами. Выпуск релиза становится предсказуемой частью рабочего процесса, а не судорожной архивацией в последний момент.
        point1: Экспорт для Modrinth и CurseForge в один клик
        point2: "Метаданные: автор, описание, URL и версия"
        point3: Точный выбор экспортируемых файлов и ресурсов
        alt: Экран экспорта модпака XMCL для форматов Modrinth и CurseForge
      diagnose:
        label: 05 / ДИАГНОСТИКА
        title: Используйте AI для превращения отчётов о сбоях в решения.
        description: Если тестовый запуск завершился ошибкой, XMCL собирает логи, отчёты о сбоях и AI-агента в одном окне. Агент может проанализировать контекст сборки и предложить понятный следующий шаг.
        point1: Чтение логов запуска и отчётов о сбоях в контексте
        point2: Анализ файлов сборки с помощью AI
        point3: Устранение конфликтов модов перед релизом
        alt: AI-агент XMCL анализирует сбой запуска Minecraft
