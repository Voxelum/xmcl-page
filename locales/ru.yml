  groups:
    instances:
      short: Сборки
      title: Сборки и профили
      description: Храните каждую конфигурацию Minecraft отдельно, на виду и готовой к запуску.
    community:
      short: Сообщество
      title: Моды и контент сообщества
      description: Находите, проверяйте и устанавливайте проекты для следующего мира Minecraft.
    mods:
      short: Управление модами
      title: Управление модами
      description: Сохраняйте порядок в больших сборках с помощью поиска, групп, проверки зависимостей и обновлений.
    world-tools:
      short: Миры
      title: Инструменты мира
      description: Исследуйте миры, выбирайте их части и изучайте используемые материалы.
    sharing:
      short: Обмен
      title: Обмен и мультиплеер
      description: Переносите рабочую конфигурацию друзьям, на сервер или другую установку вместе с деталями.
    accounts:
      short: Аккаунты
      title: Аккаунты и продуктивность
      description: Управляйте аккаунтами, оформлением и частыми действиями рядом с игровыми мирами.
    diagnostics:
      short: Диагностика
      title: Диагностика и помощь
      description: При ошибке запуска все сведения и следующие действия находятся в одном месте.
  items:
    instance-library:
      title: Организованная библиотека сборок
      benefit: Объедините ванильные, модифицированные и экспериментальные миры в едином месте, готовом к запуску.
      capabilities: Раздельные версии игры и загрузчики|Моды, сохранения и ресурсы как на ладони|Запуск нужной конфигурации
    instance-create-modloaders:
      title: Создание сборок Java и Bedrock
      benefit: Создавайте конфигурации с загрузчиком и изданием, подходящими для нужного вам мира.
      capabilities: Поддержка Java Edition и экспериментальной Bedrock|Forge, Fabric, Quilt, NeoForge, OptiFine и LabyMod|Версии Minecraft и локальные источники
    instance-folder-groups:
      title: Группы сборок по папкам
      benefit: Распределяйте множество сборок по папкам, чтобы в мирах и конфигурациях было легко ориентироваться.
      capabilities: Группировка сборок по назначению или проекту|Хранение связанных конфигураций вместе|Переключение между папками на панели сборок
    instance-settings:
      title: Настройки сборки
      benefit: Настраивайте Java, память, версии, загрузчики и параметры запуска индивидуально для каждой сборки.
      capabilities: Независимая конфигурация сборки|Выбор версии и загрузчика|Настройки внешнего вида для каждой сборки
    instance-theme:
      title: Тема сборки
      benefit: Придайте каждому миру индивидуальность с помощью фонов, цветов, размытия, шрифтов и пользовательского CSS.
      capabilities: Фоновое изображение и наложение|Скругление углов и управление шрифтами|Экспорт и импорт тем
    local-server:
      title: Запуск локального сервера
      benefit: Превратите сборку в настраиваемый локальный сервер с миром, лимитом игроков и экспортируемыми файлами.
      capabilities: MOTD, порт и лимит игроков|Выбор мира и файлов сервера|Экспорт готового пакета сервера
    server-list:
      title: Список серверов
      benefit: Сохраняйте адреса серверов рядом со связанной сборкой и отслеживайте состояние подключения.
      capabilities: Статус сервера и количество игроков|Закрепление и удаление серверов|Наглядное отображение ошибок подключения
    modpack-market:
      title: Рынок модпаков
      benefit: Просматривайте контент Modrinth, CurseForge и FTB в едином каталоге с удобным поиском.
      capabilities: Фильтры по источнику, версии, загрузчику и категории|Популярные и новейшие сборки|Страница с подробностями о модпаке
    online-mod-search:
      title: Поиск модов онлайн
      benefit: Находите совместимые моды на крупнейших платформах сообщества ещё до добавления в сборку.
      capabilities: Источники Modrinth и CurseForge|Фильтры по версии Minecraft и загрузчику|Фильтры по окружению и категориям
    modpack-detail:
      title: Подробности модпака
      benefit: "Узнайте всё о модпаке перед установкой: от скриншотов и авторов до технических требований."
      capabilities: Скриншоты, теги и статистика проекта|Действия по установке и запуску|Техническая информация и внешние ресурсы
    mod-collections:
      title: Коллекции модов
      benefit: Сохраняйте интересные проекты и превращайте коллекции в готовые к использованию конфигурации.
      capabilities: Коллекции лаунчера|Отслеживаемые проекты Modrinth|Пакетная установка и управление коллекциями
    mod-detail:
      title: Подробности мода
      benefit: "Изучите мод перед добавлением в сборку: версии, зависимости и источники."
      capabilities: Выбор версии и зависимости|Загрузчики, категории и ссылки на источники|Описание и внешние ресурсы
    local-mods:
      title: Управление установленными модами
      benefit: Контролируйте включённые моды, быстро фильтруйте их и поддерживайте сборку в рабочем состоянии.
      capabilities: Поиск, сортировка и фильтрация модов|Проверка зависимостей и неиспользуемого контента|Выбор политики обновлений
    custom-mod-groups:
      title: Пользовательские группы модов
      benefit: Создавайте собственные группы и сохраняйте правила для наведения порядка в сложных сборках.
      capabilities: Применение и сохранение правил группировки|Группировка модов из контекстного меню|Включение, отключение и просмотр файлов
    save-preview:
      title: Просмотр мира и инструменты чанков
      benefit: Оцените мир визуально перед запуском и вносите точные изменения на уровне чанков.
      capabilities: Перемещение и осмотр карты мира|Выбор, копирование и удаление чанков|Просмотр свойств мира и материалов
    blueprint-preview:
      title: Просмотр blueprint
      benefit: Просматривайте постройки в 3D, проверяйте совместимость и материалы до размещения в игре.
      capabilities: Форматы Litematica и WorldEdit|Совместимость и проверка недостающих модов|Список материалов и конвертация форматов
    modpack-export:
      title: Экспорт модпака
      benefit: Упакуйте сборку для других игроков, сохранив все метаданные и необходимые файлы.
      capabilities: "Экспорт для CurseForge и Modrinth|Метаданные: автор, описание и URL|Выбор включаемых файлов и ресурсов"
    server-export:
      title: Экспорт сервера
      benefit: Выберите нужный мир и файлы сервера, а затем экспортируйте локальный сервер с готовой конфигурацией.
      capabilities: Экспорт в папку или загрузка|Выбор файлов сервера|Настройка MOTD и параметров сервера
    account-login:
      title: Несколько сервисов авторизации
      benefit: "Выберите подходящий сервис аккаунтов: Microsoft, автономный режим или сторонние службы."
      capabilities: Аккаунты Microsoft и автономные аккаунты|Сервисы Ely.by и LittleSkin|Добавление и управление службами авторизации
    quick-action:
      title: Быстрые действия
      benefit: Находите сборки и команды, не покидая текущую страницу.
      capabilities: Поиск команд, сборок и модов|Запуск или создание сборки|Быстрая навигация с клавиатуры по Ctrl+K
    crash-diagnosis:
      title: Отчёты о сбоях и ошибках запуска
      benefit: Просматривайте логи, отчёты о сбоях и вывод сервера при неудачном запуске.
      capabilities: Логи, отчёты о сбоях и ошибки запуска|Ошибки разрешения модов и коды завершения|Копирование промпта для внешних AI-инструментов
    ai-agent:
      title: Встроенный AI Agent
      benefit: Доверьте агенту анализ виртуальной файловой системы сборки и получение готового решения.
      capabilities: Чтение файлов сборки и отчётов|Анализ перед выводами|Применение готового решения при возможности
