    multipleCommunities: 여러 커뮤니티
  description: "XMCL은 CurseForge와 Modrinth를 기본적으로 지원합니다. 또한, 사용자 지정 계정이나 스킨 시스템(예: Blessing Skin)도 지원할 수 있는 기능을 제공합니다."
