        description: 올바른 메타데이터와 선택한 파일로 완성도 높은 Modrinth 또는 CurseForge 모드팩을 내보내세요. 릴리스 단계가 마지막 순간의 임기응변식 압축 작업이 아닌, 반복 가능한 워크플로의 일부가 됩니다.
        point1: 원클릭 Modrinth 및 CurseForge 내보내기
