    mods:
      short: 모드 관리
      title: 모드 관리
      description: 검색, 그룹, 의존성 검사와 업데이트로 큰 모드 환경을 정리하세요.
    world-tools:
      short: 월드 도구
      title: 월드 도구
      description: 월드를 확인하고 필요한 부분과 재료를 파악하세요.
    sharing:
      short: 공유
      title: 공유와 멀티플레이
      description: 필요한 정보를 유지한 채 환경을 친구나 서버로 옮기세요.
    accounts:
      short: 계정
      title: 계정과 생산성
      description: 계정과 사용자 설정, 자주 쓰는 작업을 관리하세요.
    diagnostics:
      short: 진단
      title: 진단과 지원
      description: 실행 실패의 원인과 다음 작업을 한곳에서 확인하세요.
  items:
    instance-library:
      title: 정리된 인스턴스 라이브러리
      benefit: 바닐라, 모드, 실험적 월드를 언제든 실행할 수 있는 하나의 홈에서 확인하세요.
      capabilities: 게임 버전 및 로더 분리|모드, 세이브, 리소스를 한눈에 확인|필요한 설정을 바로 실행
    instance-create-modloaders:
      title: Java 및 Bedrock 인스턴스 만들기
      benefit: 플레이하려는 월드에 맞는 로더와 에디션으로 새로운 환경을 시작하세요.
      capabilities: Java Edition 및 실험적 Bedrock 지원|Forge, Fabric, Quilt, NeoForge, OptiFine 및 LabyMod|Minecraft 및 로컬 버전 소스
    instance-folder-groups:
      title: 인스턴스 폴더 그룹
      benefit: 수많은 인스턴스를 폴더로 정리하여 다양한 월드와 설정을 쉽게 둘러보세요.
      capabilities: 용도 또는 프로젝트별 인스턴스 그룹화|관련 설정 함께 보관|인스턴스 레일에서 폴더 간 전환
    instance-settings:
      title: 인스턴스 설정
      benefit: 다른 설정에 영향을 주지 않고 Java, 메모리, 버전, 로더 및 실행 동작을 조정하세요.
      capabilities: 독립적인 인스턴스 구성|버전 및 로더 선택|인스턴스별 외관 설정
    instance-theme:
      title: 인스턴스 테마
      benefit: 배경, 색상, 블러 효과, 글꼴 및 사용자 지정 CSS로 각 월드에 고유한 개성을 부여하세요.
      capabilities: 배경 이미지 및 오버레이|둥근 모서리 및 글꼴 제어|테마 내보내기 및 가져오기
    local-server:
      title: 로컬 서버 실행
      benefit: 인스턴스를 월드, 플레이어 수 제한 및 내보내기 가능한 파일이 포함된 맞춤형 로컬 서버로 전환하세요.
      capabilities: MOTD, 포트 및 플레이어 수 제한|월드 및 서버 파일 선택|서버 패키지 내보내기
    server-list:
      title: 서버 목록
      benefit: 멀티플레이 목적지를 인스턴스 가까이에 두고 연결 상태를 확인하세요.
      capabilities: 서버 상태 및 플레이어 수|목적지 고정 및 제거|연결 실패 상태 명확히 표시
    modpack-market:
      title: 모드팩 마켓
      benefit: 검색 가능한 하나의 마켓플레이스에서 Modrinth, CurseForge, FTB 콘텐츠를 둘러보세요.
      capabilities: 소스, 버전, 로더 및 카테고리 필터|인기 및 최신 모드팩 탐색|모드팩 상세 페이지 열기
    online-mod-search:
      title: 온라인 모드 검색
      benefit: 인스턴스에 설치하기 전에 주요 커뮤니티 플랫폼에서 호환되는 모드를 찾아보세요.
      capabilities: Modrinth 및 CurseForge 소스|Minecraft 버전 및 로더 필터|환경 및 카테고리 필터
    modpack-detail:
      title: 모드팩 상세
      benefit: 스크린샷과 제작자부터 기술 요구 사항까지, 설치 전에 팩에 대한 모든 것을 파악하세요.
      capabilities: 스크린샷, 태그 및 프로젝트 통계|설치 및 실행 작업|기술 정보 및 외부 리소스
    mod-collections:
      title: 모드 컬렉션
      benefit: 다시 찾고 싶은 프로젝트를 저장하고 컬렉션을 재사용 가능한 설정으로 만드세요.
      capabilities: 런처 컬렉션|팔로우한 Modrinth 프로젝트|일괄 설치 및 컬렉션 관리
    mod-detail:
      title: 모드 상세
      benefit: 인스턴스를 변경하기 전에 모드를 살펴보고 버전, 의존성 및 소스를 확인하세요.
      capabilities: 버전 선택 및 의존성|로더, 카테고리 및 소스 링크|설명 및 외부 리소스
    local-mods:
      title: 설치된 모드 관리
      benefit: 활성화된 항목을 확인하고 빠르게 필터링하여 작업 세트를 항상 최적의 상태로 유지하세요.
      capabilities: 모드 검색, 정렬 및 필터링|의존성 및 미사용 콘텐츠 확인|업데이트 정책 선택
    custom-mod-groups:
      title: 사용자 지정 모드 그룹
      benefit: 나만의 그룹을 만들고 복잡한 인스턴스를 체계적으로 정리하는 규칙을 저장하세요.
      capabilities: 그룹화 규칙 적용 및 저장|컨텍스트 메뉴에서 모드 그룹화|파일 활성화, 비활성화 또는 검사
    save-preview:
      title: 세이브 미리보기와 청크 도구
      benefit: 월드를 실행하기 전에 시각적으로 살펴보고 청크 단위로 정밀하게 변경하세요.
      capabilities: 월드 맵 이동 및 검사|청크 선택, 복사 또는 삭제|월드 속성 및 재료 확인
    blueprint-preview:
      title: 블루프린트 미리보기
      benefit: 인게임에 배치하기 전에 구조물을 3D로 미리 보고 호환성과 재료를 확인하세요.
      capabilities: Litematica 및 WorldEdit 형식|호환성 및 누락된 모드 상태|재료 목록 및 형식 변환
    modpack-export:
      title: 모드팩 내보내기
      benefit: 원활한 작동에 필요한 메타데이터와 파일을 유지한 채 다른 플레이어를 위한 인스턴스를 패키징하세요.
      capabilities: CurseForge 및 Modrinth 내보내기|작성자, 설명 및 URL 메타데이터|포함할 파일 및 애셋 선택
    server-export:
      title: 서버 내보내기
      benefit: 알맞은 월드와 서버 파일을 선택하고 명확한 설정이 포함된 로컬 서버를 내보내세요.
      capabilities: 폴더로 내보내기 또는 업로드|서버 파일 선택|MOTD 및 서버 옵션 구성
    account-login:
      title: 여러 인증 서비스
      benefit: Microsoft부터 오프라인 및 타사 서비스까지, 플레이 방식에 맞는 계정 서비스를 선택하세요.
      capabilities: Microsoft 및 오프라인 계정|Ely.by 및 LittleSkin 서비스|인증 서비스 추가 및 관리
    quick-action:
      title: 빠른 작업
      benefit: 작업 중인 페이지를 벗어나지 않고 인스턴스와 명령을 찾아보세요.
      capabilities: 명령, 인스턴스 및 모드 검색|인스턴스 실행 또는 생성|Ctrl+K를 통한 키보드 중심 탐색
    crash-diagnosis:
      title: 충돌 및 실행 실패 보고서
      benefit: 실행 실패 뒤에 숨겨진 실제 로그, 충돌 보고서 및 서버 출력을 확인하세요.
      capabilities: 로그, 충돌 보고서 및 실행 실패 원인|모드 해결 오류 및 종료 코드|외부 AI 도구용 프롬프트 복사
    ai-agent:
      title: 내장 AI Agent
      benefit: 에이전트가 인스턴스 가상 파일 시스템을 검사하고 실행 가능한 해결책을 설명하도록 하세요.
      capabilities: 인스턴스 파일 및 보고서 분석|결론을 내리기 전 원인 조사|가능한 경우 실행 가능한 수정 조치 적용
