      export:
        label: 04 / صدّر
        title: أطلق حزمتك بالتنسيق الذي يحتاجه لاعبوك.
        description: صدّر حزمة تعديلات متقنة لـ Modrinth أو CurseForge مع البيانات الوصفية الصحيحة والملفات المحددة. لتصبح خطوة الإصدار جزءاً متكرراً من سير عملك، وليست مجرد عملية أرشفة في اللحظة الأخيرة.
        point1: تصدير بنقرة واحدة إلى Modrinth وCurseForge
        point2: البيانات الوصفية للمؤلف والوصف ورابط URL والإصدار
