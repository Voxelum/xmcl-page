        description: اعثر على المشاريع عبر Modrinth وCurseForge باستخدام عوامل تصفية الإصدار والمُحمّل والبيئة والفئة. يطابق XMCL المشاريع بين كلا المصدرين حتى تتمكن من مقارنة نفس العمل دون تخمين.
