redirectHelperTitle: إذا لم يتم توجيهك تلقائياً، يمكنك النقر على زر "الفتح في التطبيق" للتوجيه يدوياً.
redirectHelperMessage: سيظهر لك مربع حوار يطلب منك فتح اللانشر. إذا كان لا يزال لا يعمل، يمكنك محاولة سحب الزر إلى نافذة اللانشر!
