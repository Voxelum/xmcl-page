features:
  label: الميزات
  ui:
    kicker: XMCL / كتالوج الميزات
    heading: ميزات المشغّل
    description: استكشف مسارات العمل التي تجعل إنشاء بيئة Minecraft المعدّلة وفهمها ومشاركتها أسهل.
    all: كل الميزات
    search: البحث عن ميزة...
    features: ميزات
    featuresInView: ميزات معروضة
    readWorkflow: عرض مسار العمل
  status:
    homepage: الصفحة الرئيسية
    catalog: الكتالوج
    guide: الدليل
    detail: التفاصيل
  groups:
    instances:
      short: النسخ
      title: النسخ والملفات الشخصية
      description: حافظ على كل إعداد Minecraft مستقلاً ومرئياً وجاهزاً للتشغيل.
    community:
      short: المجتمع
      title: التعديلات ومحتوى المجتمع
      description: اكتشف المشاريع التي تحول إصدار Minecraft إلى عالمك التالي وتحقق منها وثبتها.
    mods:
      short: إدارة التعديلات
      title: إدارة التعديلات
      description: حافظ على ترتيب البيئات الكبيرة باستخدام البحث والمجموعات وفحص التبعيات والتحديثات.
    world-tools:
      short: أدوات العالم
      title: أدوات العالم
      description: افحص العوالم وحدد أجزاءها وتعرّف على المواد المستخدمة فيها.
    sharing:
      short: المشاركة
      title: المشاركة واللعب الجماعي
      description: انقل إعداداً يعمل إلى صديق أو خادم أو تثبيت آخر مع تفاصيله.
    accounts:
      short: الحسابات
      title: الحسابات والإنتاجية
      description: أدر الهوية والتخصيص والإجراءات المتكررة بالقرب من عوالمك.
    diagnostics:
      short: التشخيص
      title: التشخيص والمساعدة
      description: عند فشل التشغيل، ستجد الأدلة والإجراء التالي في المكان نفسه.
  items:
    instance-library:
      title: مكتبة نسخ منظمة
      benefit: شاهد العوالم الأصلية والمعدّلة والتجريبية معاً في واجهة واحدة جاهزة للتشغيل.
      capabilities: فصل إصدارات اللعبة ومُحمّلاتها|الاطلاع على التعديلات وملفات الحفظ والموارد بنظرة سريعة|تشغيل الإعداد الذي تحتاجه
    instance-create-modloaders:
      title: إنشاء نسخ Java وBedrock
      benefit: ابدأ إعداداً جديداً بالمُحمّل والإصدار المتوافقين مع العالم الذي تريد لعبه.
      capabilities: دعم Java Edition ودعم Bedrock التجريبي|Forge وFabric وQuilt وNeoForge وOptiFine وLabyMod|مصادر إصدارات Minecraft والمصادر المحلية
    instance-folder-groups:
      title: مجموعات النسخ في مجلدات
      benefit: رتّب النسخ المتعددة في مجلدات لتظل العوالم والإعدادات المختلفة سهلة الاستعراض.
      capabilities: تجميع النسخ حسب الغرض أو المشروع|إبقاء الإعدادات المرتبطة معاً|التبديل بين المجلدات من الشريط الجانبي للنسخ
    instance-settings:
      title: إعدادات النسخة
      benefit: اضبط Java والذاكرة والإصدارات والمُحمّلات وسلوك التشغيل دون المساس بأي إعداد آخر.
      capabilities: تكوين مستقل لكل نسخة|اختيار الإصدار والمُحمّل|عناصر تحكم في المظهر لكل نسخة
    instance-theme:
      title: سمة النسخة
      benefit: امنح كل عالم هويته الخاصة بخلفيات وألوان وتأثيرات ضبابية وخطوط وتنسيق CSS مخصص.
      capabilities: صورة الخلفية والطبقة الشفافة|حواف مستديرة وعناصر تحكم في الخطوط|تصدير السمة واستيرادها
    local-server:
      title: تشغيل خادم محلي
      benefit: حوّل أي نسخة إلى خادم محلي قابل للتكوين مع تحديد العالم والحد الأقصى للاعبين وملفات قابلة للتصدير.
      capabilities: رسالة MOTD والمنفذ والحد الأقصى للاعبين|تحديد العالم وملفات الخادم|تصدير حزمة خادم
    server-list:
      title: قائمة الخوادم
      benefit: احتفظ بوجهات اللعب الجماعي بالقرب من النسخة التي تستخدمها واطّلع على حالة اتصالها.
      capabilities: حالة الخادم وعدد اللاعبين|تثبيت الوجهات وإزالتها|إظهار حالات فشل الاتصال بوضوح
    modpack-market:
      title: سوق حزم التعديلات
      benefit: تصفح محتوى Modrinth وCurseForge وFTB من سوق واحد يدعم البحث.
      capabilities: عوامل تصفية حسب المصدر والإصدار والمُحمّل والفئة|اكتشاف الحزم الشائعة والأحدث|فتح صفحة تفاصيل الحزمة
    online-mod-search:
      title: البحث عن التعديلات عبر الإنترنت
      benefit: اعثر على التعديلات المتوافقة عبر منصات المجتمع الرئيسية قبل تثبيتها في نسختك.
      capabilities: مصادر Modrinth وCurseForge|عوامل تصفية إصدار Minecraft والمُحمّل|عوامل تصفية البيئة والفئة
    modpack-detail:
      title: تفاصيل حزمة التعديلات
      benefit: تعرّف على الحزمة قبل تثبيتها، من لقطات الشاشة والمؤلفين إلى المتطلبات التقنية.
      capabilities: لقطات شاشة ووسوم وإحصاءات المشروع|إجراءات التثبيت والتشغيل|معلومات تقنية وموارد خارجية
    mod-collections:
      title: مجموعات التعديلات
      benefit: احفظ المشاريع التي ترغب في العودة إليها وحوّل أي مجموعة إلى إعداد قابل لإعادة الاستخدام.
      capabilities: مجموعات المشغّل|مشاريع Modrinth المُتابَعة|تثبيت دفعي وإدارة المجموعات
    mod-detail:
      title: تفاصيل التعديل
      benefit: افحص التعديل قبل إضافته لنسختك وتعرّف على إصداراته وتبعياته ومصادره.
      capabilities: اختيار الإصدار والتبعيات|المُحمّلات والفئات وروابط المصدر|الوصف والموارد الخارجية
    local-mods:
      title: إدارة التعديلات المثبتة
      benefit: اطّلع على ما هو مفعّل، وصَفّه بسرعة، وحافظ على استقرار مجموعة العمل.
      capabilities: البحث في التعديلات وفرزها وتصفيتها|فحص التبعيات والمحتوى غير المستخدم|اختيار سياسة التحديث
    custom-mod-groups:
      title: مجموعات تعديلات مخصصة
      benefit: أنشئ مجموعاتك الخاصة واحفظ القواعد التي تنظم النسخ المعقدة.
      capabilities: تطبيق قواعد التجميع وحفظها|تجميع التعديلات من القائمة السياقية|تفعيل الملفات أو تعطيلها أو فحصها
    save-preview:
      title: معاينة الحفظ وأدوات المقاطع
      benefit: استعرض العالم بصرياً قبل تشغيله وأجرِ تغييرات دقيقة على مستوى القطع (Chunks).
      capabilities: التنقل وفحص خرائط العالم|تحديد القطع أو نسخها أو حذفها|قراءة خصائص العالم والمواد المستخدمة
    blueprint-preview:
      title: معاينة المخطط
      benefit: عاين الهياكل ثلاثية الأبعاد وتحقق من التوافق والمواد قبل وضعها داخل اللعبة.
      capabilities: تنسيقات Litematica وWorldEdit|حالة التوافق والتعديلات المفقودة|قائمة المواد وتحويل التنسيقات
    modpack-export:
      title: تصدير حزمة التعديلات
      benefit: احزم نسختك للاعبين الآخرين دون فقدان البيانات الوصفية والملفات اللازمة لتشغيلها.
      capabilities: تصدير إلى CurseForge وModrinth|البيانات الوصفية للمؤلف والوصف ورابط URL|اختيار الملفات والأصول المطلوب تضمينها
    server-export:
      title: تصدير الخادم
      benefit: حدد العالم المناسب وملفات الخادم، ثم صدّر خادماً محلياً بتكوين واضح.
      capabilities: تصدير إلى مجلد أو رفع|تحديد ملفات الخادم|تكوين رسالة MOTD وخيارات الخادم
    account-login:
      title: خدمات مصادقة متعددة
      benefit: اختر خدمة الحسابات التي تناسب طريقتك في اللعب، من Microsoft إلى الحسابات غير المتصلة وخدمات الطرف الثالث.
      capabilities: حسابات Microsoft والحسابات غير المتصلة|خدمات Ely.by وLittleSkin|إضافة خدمات المصادقة وإدارتها
    quick-action:
      title: إجراءات سريعة
      benefit: اعثر على النسخ والأوامر دون مغادرة الصفحة التي تعمل عليها.
      capabilities: البحث في الأوامر والنسخ والتعديلات|تشغيل نسخة أو إنشاؤها|تنقل سريع عبر لوحة المفاتيح باستخدام Ctrl+K
    crash-diagnosis:
      title: تقارير التعطل وفشل التشغيل
      benefit: اقرأ السجلات الفعلية وتقارير التعطل ومخرجات الخادم وراء أي تشغيل غير ناجح.
      capabilities: السجلات وتقارير التعطل وفشل التشغيل|أخطاء حل التعديلات ورموز الخروج|نسخ مطالبة لأدوات AI الخارجية
    ai-agent:
      title: وكيل AI مدمج
      benefit: دع وكيلاً يفحص نظام الملفات الافتراضي للنسخة ويشرح حلاً قابلاً للتطبيق.
      capabilities: قراءة ملفات النسخة وتقاريرها|التحقيق قبل التوصل إلى استنتاج|تطبيق إصلاح عملي متى أمكن
