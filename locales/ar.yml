        description: عندما يفشل تشغيل تجريبي، يضع XMCL السجلات وتقارير التعطل ووكيل AI في نفس المكان. يستطيع الوكيل فحص سياق النسخة واقتراح خطوة تالية قابلة للتنفيذ.
