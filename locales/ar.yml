        description: ابحث وافرز وجَمّع وحدّث وأزل التعديلات التي لم تعد بحاجة إليها. تسهّل المجموعات المخصصة اختبار المحتوى الاختياري، أو مقارنة الملفات الشخصية، أو إبقاء الإصدار المرشح مركزاً.
        point1: فحص تلقائي لتحديثات التعديلات
        point2: مجموعات مخصصة للمحتوى الاختياري والتجريبي
